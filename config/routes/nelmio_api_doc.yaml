# OpenAPI JSON (NelmioApiDocBundle) — Administration shell
admin_api_doc_json:
    path: /admin/api/doc.json
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger }

# Swagger UI — linked from the Administration sidebar
admin_api_doc:
    path: /admin/api/doc
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }
