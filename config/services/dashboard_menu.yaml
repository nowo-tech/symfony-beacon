# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# dashboard-menu-bundle 2.1.9 tags other FormKit types as form.type but omits SearchQueryType.
# Without the tag, FormFactory instantiates it without FormOptionsMerger (HTTP 500 on /admin/menus/).
services:
    _defaults:
        autowire: true
        autoconfigure: true

    Nowo\DashboardMenuBundle\Form\SearchQueryType: ~
