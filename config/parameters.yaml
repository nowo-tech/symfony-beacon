# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Typed aliases for env vars defined in `.env` / `.env.dist`.
# Do NOT add `env(NAME): 'default'` here (constitution Principle IX) — defaults belong in `.env.dist`.
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    default_locale: '%env(DEFAULT_LOCALE)%'
    # Catalogue fallbacks when a key is missing in the active locale (always keep English).
    fallback_locales: [en, es, de, nl, fr, it, pt]
    beacon.vapid.public_key: '%env(string:VAPID_PUBLIC_KEY)%'
    beacon.vapid.private_key: '%env(string:VAPID_PRIVATE_KEY)%'
    beacon.vapid.subject: '%env(string:VAPID_SUBJECT)%'
    beacon.mercure.env_url: '%env(string:MERCURE_URL)%'
    beacon.mercure.env_public_url: '%env(string:MERCURE_PUBLIC_URL)%'
    beacon.mercure.env_jwt_secret: '%env(string:MERCURE_JWT_SECRET)%'
    # Session cookie name (project-scoped; avoid colliding with other apps on localhost).
    beacon.session_cookie_name: SYMFONY_BEACON_SESSID
    # Pre-auth Envelope/OTLP rate limit per client IP (requests/minute; 0 disables).
    beacon.ingest_ip_rate_limit: '%env(int:BEACON_INGEST_IP_RATE_LIMIT)%'
    # Pre-auth public hook rate limit per client IP (requests/minute; 0 disables).
    beacon.hook_ip_rate_limit: '%env(int:BEACON_HOOK_IP_RATE_LIMIT)%'
    # When true, SiteBackup setup gate also triggers if menus/breadcrumbs/cookies are missing.
    app.setup.check_platform_catalogs: true
