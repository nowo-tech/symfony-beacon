# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    # Session auth without Remember me: keep login for 1 day (cookie + server GC).
    # Cookie name: %beacon.session_cookie_name% (config/parameters.yaml).
    session:
        name: '%beacon.session_cookie_name%'
        cookie_lifetime: 86400
        gc_maxlifetime: 86400
        cookie_samesite: lax
        cookie_httponly: true
    form: true
    csrf_protection: true
    validation: { enable_attributes: true }
    ide: 'cursor://file/%%f:%%l'

when@prod:
    framework:
        session:
            cookie_secure: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
