# nowo-tech/beacon-bundle — dogfood this Beacon instance when BEACON_DSN is set.
# Empty DSN disables reporting (NullBeaconClient).
# Format: http://PUBLIC_KEY:SECRET_KEY@127.0.0.1/PROJECT_ID (loopback after make ready)
nowo_beacon:
    enabled: true
    dsn: '%env(string:default::BEACON_DSN)%'
    environment: '%kernel.environment%'
    release: '%env(string:default::BEACON_RELEASE)%'
    verify_peer: true
    timeout: 2.0
    transport:
        mode: async
    register_error_listener: true
    register_console_listener: true
    register_messenger_listener: true
    auto_http_transaction: false
    before_send: App\Shared\Beacon\DropSelfIngestBeforeSend
    instrumentation:
        doctrine: false
        http_client: true
    send:
        environment: true
        release: true
        server_name: true
        stacktrace: true
        request: true
        user: false
        runtime: true
        framework: true
        os: true

when@dev:
    nowo_beacon:
        verify_peer: false
