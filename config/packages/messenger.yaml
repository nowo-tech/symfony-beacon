# yaml-language-server: $schema=../../vendor/symfony/framework-bundle/Resources/config/schema/symfony-1.0.xsd

framework:
    messenger:
        failure_transport: failed

        # JSON + HMAC signatures (via AsMessageHandler sign: true) — avoid PHP native unserialize gadgets
        # and forged ProcessEnvelopeMessage rows in the queue. Drain pending Doctrine
        # messenger_messages rows before deploy when switching MESSENGER_TRANSPORT_DSN to Redis.
        serializer:
            default_serializer: messenger.transport.symfony_serializer

        transports:
            # Envelope / OTLP ingest drain — isolated from outbound side effects.
            async_ingest:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: async_ingest
                    auto_setup: true
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000

            # Notifications, Web Push, HTTP-log (may backlog without blocking ingest).
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: async
                    auto_setup: true
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000

            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: failed
                    auto_setup: true

            sync: 'sync://'

        routing:
            App\Ingest\Message\ProcessEnvelopeMessage: async_ingest
            App\Notifications\Message\DispatchIngestNotificationsMessage: async
            App\Notifications\Message\DeliverNotificationMessage: async
            App\Notifications\Message\DeliverWebPushForProjectMessage: async
            Nowo\HttpLogBundle\Message\PersistHttpLogMessage: async
            Nowo\HttpLogBundle\Message\ExportHttpLogMessage: async
            Nowo\HttpLogBundle\Message\PurgeHttpLogMessage: async

when@test:
    framework:
        messenger:
            transports:
                async_ingest: 'sync://'
                async: 'sync://'
                failed: 'in-memory://'
