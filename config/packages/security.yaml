security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
  providers:
    app_user_provider:
      entity:
        class: App\Identity\Entity\User
        property: email
  firewalls:
    dev:
      pattern: ^/(_profiler|_wdt|assets|build)/
      security: false
    ingest:
      # INT (legacy) or UUID project ref — keep in sync with IngestRouteRequirements::PROJECT_REF
      pattern: ^/api/(\d+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/(envelope|otlp)
      security: false
    read_api:
      pattern: ^/api/projects/
      security: false
    main:
      lazy: true
      provider: app_user_provider
      # Wire UserKit AccountStatusUserChecker (≥1.1.6) so Security::login() (AuthKit magic/social/QR)
      # and form login reject disabled accounts. Tag-only registration is not enough: Symfony's
      # default firewall checker stays InMemoryUserChecker until user_checker is set explicitly.
      user_checker: Nowo\UserKitBundle\Security\AccountStatusUserChecker
      form_login:
        login_path: nowo_auth_kit_login
        check_path: nowo_auth_kit_login
        enable_csrf: true
        default_target_path: dashboard_home
        username_parameter: 'login_form[_username]'
        password_parameter: 'login_form[_password]'
        csrf_parameter: 'login_form[_csrf_token]'
        csrf_token_id: authenticate
      login_link:
        check_route: nowo_auth_kit_magic_login_check
        check_post_only: true
        lifetime: 600
        max_uses: 1
        used_link_cache: cache.app
        signature_properties: ['email']
        default_target_path: dashboard_home
        login_path: nowo_auth_kit_magic_login_request
        failure_path: nowo_auth_kit_magic_login_request
      remember_me:
        secret: '%kernel.secret%'
        # 30 days when “Remember me” is checked at login.
        lifetime: 2592000
        path: /
        remember_me_parameter: 'login_form[_remember_me]'
      login_throttling:
        max_attempts: 5
        interval: '15 minutes'
        limiter: nowo_login_throttle.database_rate_limiter
      logout:
        path: nowo_auth_kit_logout
        target: nowo_auth_kit_login
        invalidate_session: true
        enable_csrf: true
  access_control:
    - path: ^/$
      roles: PUBLIC_ACCESS
    - path: ^/(login|register|logout)$
      roles: PUBLIC_ACCESS
    - path: ^/login/magic
      roles: PUBLIC_ACCESS
    - path: ^/login/social
      roles: PUBLIC_ACCESS
    - path: ^/login/qr
      roles: PUBLIC_ACCESS
    - path: ^/reset-password
      roles: PUBLIC_ACCESS
    - path: ^/share/
      roles: PUBLIC_ACCESS
    # Locale-prefixed public surfaces (AuthKit, legal)
    - path: ^/(en|es|de|nl|fr|it|pt)/(login|register|logout)(/|$)
      roles: PUBLIC_ACCESS
    - path: ^/(en|es|de|nl|fr|it|pt)/login/magic
      roles: PUBLIC_ACCESS
    - path: ^/(en|es|de|nl|fr|it|pt)/login/social
      roles: PUBLIC_ACCESS
    - path: ^/(en|es|de|nl|fr|it|pt)/login/qr
      roles: PUBLIC_ACCESS
    - path: ^/(en|es|de|nl|fr|it|pt)/reset-password
      roles: PUBLIC_ACCESS
    - path: ^/(en|es|de|nl|fr|it|pt)/legal/
      roles: PUBLIC_ACCESS
    - path: ^/locale/
      roles: PUBLIC_ACCESS
    - path: ^/api/(\d+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/(envelope|otlp)
      roles: PUBLIC_ACCESS
    - path: ^/api/projects/
      roles: PUBLIC_ACCESS
    - path: ^/(manifest\.webmanifest|sw\.js|offline)$
      roles: PUBLIC_ACCESS
    - path: ^/legal/
      roles: PUBLIC_ACCESS
    - path: '^/cookie_consent(_alt)?$'
      roles: PUBLIC_ACCESS
    - path: ^/cookie-consent/config
      roles: PUBLIC_ACCESS
    - path: ^/health/(live|ready)$
      roles: PUBLIC_ACCESS
    - path: ^/metrics$
      roles: PUBLIC_ACCESS
    - path: ^/hooks/slack
      roles: PUBLIC_ACCESS
    # Assign OpenUri needs a Beacon session (login redirect); other Teams hooks stay public.
    - path: ^/hooks/teams/assign-me
      roles: ROLE_USER
    - path: ^/hooks/teams
      roles: PUBLIC_ACCESS
    - path: ^/hooks/email
      roles: PUBLIC_ACCESS
    - path: ^/admin/api/doc
      roles: ROLE_ADMIN
    # SiteBackupBundle: cold-start setup + panel (panel uses its own password gate)
    - path: ^/setup
      roles: PUBLIC_ACCESS
    - path: ^/(en|es|de|nl|fr|it|pt)/setup
      roles: PUBLIC_ACCESS
    - path: ^/_site_backup
      roles: PUBLIC_ACCESS
    # Framework error page previews (/_error/{code}) in dev/test
    - path: ^/_error
      roles: PUBLIC_ACCESS
    # RoutingKitBundle admin panel (in-bundle ROLE_ADMIN + firewall)
    - path: ^/admin/_routing
      roles: ROLE_ADMIN
    # HttpLogBundle admin UI (in-bundle ROLE_ADMIN gate)
    - path: ^/admin/http-log
      roles: ROLE_ADMIN
    - path: ^/
      roles: ROLE_USER
when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
    firewalls:
      main:
        login_link:
          lifetime: 600
          max_uses: 3
          used_link_cache: cache.app
