# nowo-tech/password-policy-bundle
# https://github.com/nowo-tech/PasswordPolicyBundle
nowo_password_policy:
    entities:
        App\Identity\Entity\User:
            password_field: password
            password_history_field: passwordHistory
            passwords_to_remember: 5
            expiry_days: 90
            # AuthKit reset UI is mailer-gated (encrypted DSN). Keep account security as
            # the password-policy target so expiry UX works without outbound mail.
            reset_password_route_name: account_security
            # Glob / PCRE via RouteNameMatcher (account_* covers profile, projects, security, display, …).
            notified_routes:
                - account_*
                - dashboard_home
            # Glob / PCRE via RouteNameMatcher (nowo_auth_kit_* covers login, reset, magic, social, QR).
            excluded_notified_routes:
                - nowo_auth_kit_*
            detect_password_extensions: false
    expiry_listener:
        priority: 0
        redirect_on_expiry: false
        flash_strategy: once_per_session
        # Session throttle for local cold-start / when cache.app is not visible to
        # PasswordPolicyExtension::load() (Symfony MergeExtensionConfigurationPass).
        # Prefer cache + Redis in multi-worker prod once the bundle checks in a compiler pass.
        flash_throttle_storage: session
        # flash_throttle_storage: cache
        # flash_throttle_cache_service: cache.app
        error_msg:
            text:
                title: nowo_password_policy.title
                message: nowo_password_policy.message
            type: warning
    enable_logging: true
    log_level: info
