# nowo-tech/breadcrumb-kit-bundle
# https://github.com/nowo-tech/BreadcrumbKitBundle
# Host shell only: kit/breadcrumb_dashboard_layout.html.twig — do not fork dashboard/*.twig.
nowo_breadcrumb_kit:
    locales: '%fallback_locales%'
    default_locale: '%default_locale%'
    default_collection: 'default'
    cache:
        ttl: 60
        pool: cache.app
    presentation:
        home_icon: null
        home_icon_replaces_label: true
        hide_when_single_root: true
    dashboard:
        enabled: true
        path_prefix: /breadcrumb-kit-admin
        layout_template: 'kit/breadcrumb_dashboard_layout.html.twig'
        # Tailwind host: semantic nowo-ui + kit JS modals (no Bootstrap in Vite kit-admin).
        css_framework: custom
        icon_set: none
        modals:
            collection_form: normal
            item_form: normal
            import: normal
            delete: normal
        pagination:
            enabled: true
            per_page: 20
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false
