# nowo-tech/form-kit-bundle
# https://github.com/nowo-tech/FormKitBundle
#
# default_profile beacon = Beacon product forms.
# Named kit profiles (auth_kit, dashboard_menu, …) stop vendor prepend from seeding
# Bootstrap field classes when those bundles require FormKit.
#
# FormKit 2.2.0 config tree does not allow help_attr under profiles.*.field_types
# (or profile defaults). Help chrome is styled via Twig/CSS (.help-text in
# assets/styles/_components.scss + form theme) — do not reintroduce help_attr
# until a FormKit release documents it in the schema.
nowo_form_kit:
    default_profile: beacon
    css_framework: tailwind
    # SearchType is not in FormKit's built-in map (text/email/… only).
    type_map:
        search: Symfony\Component\Form\Extension\Core\Type\SearchType
    profiles:
        beacon: &beacon_profile
            alias: beacon
            # Host FormKit catalogues live in translations/form.*.yaml
            # ({form}.{field}.label|placeholder|help). Kit profiles below override.
            translation_domain: form
            auto_placeholder: true
            auto_help: true
            required_label_suffix: null
            defaults:
                attr:
                    class: 'input'
                row_attr:
                    class: 'flex flex-col gap-2'
            field_types:
                textarea:
                    attr:
                        class: 'input'
                        rows: 3
                checkbox:
                    attr:
                        class: 'checkbox'
                    row_attr:
                        class: 'flex items-center gap-2'
                choice:
                    attr:
                        class: 'input'
                submit:
                    # Explicitly omit help (SubmitType options are label-only).
                    help: false
            help_modal:
                framework: tailwind
                icon_html: '<span aria-hidden="true">?</span>'

        # AuthKit 1.14+ (#[FormKitConfig] auth_kit) — match Beacon inputs.
        # FormKit 2.2+ inherits form-level translation_domain; keep catalogue + auto_* off.
        auth_kit:
            <<: *beacon_profile
            alias: auth_kit
            translation_domain: NowoAuthKitBundle
            auto_placeholder: false
            auto_help: false

        # DashboardMenu 2.x / BreadcrumbKit 2.0.14+ / HttpLog 1.1+ admin forms.
        # Host-defined profiles skip vendor domain seed — set kit catalogues explicitly.
        dashboard_menu:
            <<: *beacon_profile
            alias: dashboard_menu
            translation_domain: NowoDashboardMenuBundle
            auto_placeholder: false
            auto_help: false

        breadcrumb_kit:
            <<: *beacon_profile
            alias: breadcrumb_kit
            translation_domain: NowoBreadcrumbKitBundle
            auto_placeholder: false
            auto_help: false

        http_log:
            <<: *beacon_profile
            alias: http_log
            translation_domain: NowoHttpLogBundle
            auto_placeholder: false
            auto_help: false
            # Kit admin is Tailwind + UiKit; nowo-ui-input remaps slate/blue → Beacon moss under .kit-admin.
            defaults:
                attr:
                    class: 'nowo-ui-input block w-full rounded-md border border-slate-300 px-3 py-1.5 text-sm'
                row_attr:
                    class: 'flex flex-col gap-2 min-w-0'
            field_types:
                textarea:
                    attr:
                        class: 'nowo-ui-input block w-full rounded-md border border-slate-300 px-3 py-1.5 text-sm'
                        rows: 3
                checkbox:
                    attr:
                        class: 'checkbox'
                    row_attr:
                        class: 'flex items-center gap-2'
                choice:
                    attr:
                        class: 'nowo-ui-input block w-full rounded-md border border-slate-300 px-3 py-1.5 text-sm'
                submit:
                    help: false

        # CookieConsent FormKit forms label keys live in NowoCookieConsentBundle, not messages.
        cookie_consent:
            <<: *beacon_profile
            alias: cookie_consent
            translation_domain: NowoCookieConsentBundle
            auto_placeholder: false
            auto_help: false

        # RoutingKit 1.3+ panel form (#[FormKitConfig] routing_kit).
        routing_kit:
            <<: *beacon_profile
            alias: routing_kit
            translation_domain: NowoRoutingKitBundle
            auto_placeholder: false
            auto_help: false

        # GET / dashboard / index filters — own FormKit profile (not beacon).
        # Wire via AbstractGetFilterType (#[FormKitConfig('filter')]), never beacon alone.
        #
        # Contract:
        #   - label: never (field_types.*.label: false)
        #   - placeholder: always (auto_placeholder: true → {prefix}.{field}.placeholder)
        #   - help: always (auto_help: true → {prefix}.{field}.help), unless field sets help: false
        #   - required: always false except per_page (required: true via field options;
        #     AbstractGetFilterType::mergeFieldOptions defaults false; FormKit YAML cannot set required)
        # Exceptions: hidden (addHiddenFilterField: placeholder+help false);
        # choice empty-option via addFilterSelect; Twig-owned search → placeholder: false
        # (still gets help unless help: false).
        filter:
            <<: *beacon_profile
            alias: filter
            translation_domain: form
            auto_placeholder: true
            auto_help: true
            defaults:
                attr:
                    class: 'input'
                row_attr:
                    class: ''
            field_types:
                text:
                    label: false
                search:
                    label: false
                textarea:
                    label: false
                integer:
                    label: false
                number:
                    label: false
                email:
                    label: false
                password:
                    label: false
                checkbox:
                    label: false
                choice:
                    label: false
                    # Select empty-option uses ChoiceType "placeholder", not attr.placeholder.
                    # addFilterSelect() restores an empty-option key when the field needs one.
                    placeholder: false
                submit:
                    help: false
                hidden:
                    label: false
                    # Pass placeholder/help: false in field options (addHiddenFilterField) so
                    # FormOptionsMerger unsets them — profile alone leaves attr.placeholder,
                    # and HiddenType rejects bool help if left as false.
                    placeholder: false
