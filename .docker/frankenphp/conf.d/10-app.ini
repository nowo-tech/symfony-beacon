expose_php = 0
date.timezone = UTC
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; Twig form-theme compilation (Bootstrap 5 + kit themes) exceeds PHP's 128M default
; during cache:clear / TemplateCacheWarmer.
memory_limit = 512M

; Align with framework.session (1-day auth without Remember me). PHP GC default is 1440s.
session.gc_maxlifetime = 86400
session.cookie_lifetime = 86400

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.enable_file_override = 1
