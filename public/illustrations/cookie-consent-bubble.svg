<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="beacon-cc-title beacon-cc-desc">
  <title id="beacon-cc-title">Friendly round cookie</title>
  <desc id="beacon-cc-desc">Vector illustration of a smiling round cookie with chocolate chips, a bite, arms, and confetti.</desc>

  <defs>
    <radialGradient id="beacon-cc-cookieGradient" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#FFE7A1"/>
      <stop offset="58%" stop-color="#FFC95F"/>
      <stop offset="100%" stop-color="#EE922D"/>
    </radialGradient>

    <linearGradient id="beacon-cc-edgeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E98524"/>
      <stop offset="100%" stop-color="#C86418"/>
