---
# Local / default stack: FrankenPHP dev image + bind-mounted app.
# App secrets/config come from `.env` via `env_file` (cp .env.dist .env).
# `environment:` only for renames, forced values, and keys not in `.env`.
# Production image: docker compose build --build-arg… or
#   docker build --target frankenphp_prod -t symfony-frankenphp .
services:
  php:
    image: ${IMAGES_PREFIX:-}symfony-beacon-dev
    build:
      context: .
      target: frankenphp_dev
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Host bind-mount ./:/app is not owned by container root; silence Git "dubious ownership".
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
      # Built-in Caddy Mercure (dev Caddyfile) — same secret as MERCURE_JWT_SECRET.
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Worker-mode companion for hot_reload: restart PHP workers on file changes (make worker).
      # Leave empty in production-oriented overrides.
      FRANKENPHP_WORKER_CONFIG: ${FRANKENPHP_WORKER_CONFIG:-watch}
    volumes:
      # Bind-mount is required: without it, the image welcome index.php is served
      # and worker mode fails with "has not reached frankenphp_handle_request()".
      - ./:/app
      - ./.docker/frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.docker/frankenphp/conf.d/10-app.ini:/usr/local/etc/php/app.conf.d/10-app.ini:ro
      - ./.docker/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - target: 80
        published: ${HTTP_PORT:-9084}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-9447}
        protocol: tcp
      # HTTP/3/UDP disabled locally: Caddy Alt-Svc h3=":443" does not match the
      # published HTTPS_PORT (e.g. 9447) and browsers leave /_wdt pending.
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

  # Vite / Pentatrion (pnpm). Optional HMR — enable with: docker compose --profile hmr up -d
  # Default stack uses `make vite-build` (static public/build/). Leaving `pnpm run dev` running
  # rewrites entrypoints.json to viteServer mode and leaves a forever-pending HMR WebSocket
  # in the browser network panel ("page stuck downloading").
  # Browser loads /build over HTTPS via Caddy (see Caddyfile) — avoids mixed content.
  # Built files under public/build/ are served from disk; only missing paths hit this service.
  vite:
    profiles: ["hmr"]
    image: ${IMAGES_PREFIX:-}symfony-beacon-dev
    build:
      context: .
      target: frankenphp_dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      php:
        condition: service_started
    env_file:
      - .env
    environment:
      # Always bind to the compose target port (host publishes VITE_PORT → 5173).
      VITE_LISTEN_PORT: "5173"
      VITE_PORT: "5173"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
    volumes:
      - ./:/app
    ports:
      - target: 5173
        published: ${VITE_PORT:-5177}
        protocol: tcp
    command: ["pnpm", "run", "dev"]
    # Image HEALTHCHECK probes FrankenPHP :2019; this service only runs Vite.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5173/build/@vite/client >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    tty: true

  ###> doctrine/doctrine-bundle ###
  # MySQL 9.7 (latest stable official: https://hub.docker.com/_/mysql)
  database:
    image: mysql:${MYSQL_VERSION:-9.7}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Host-visible MySQL data (gitignored). Recreate DB: rm -rf .data/mysql && docker compose up -d database
      - ./.data/mysql:/var/lib/mysql
    # No host ports — reach via Compose network only (REQ-FP-006): docker compose exec database …
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-!ChangeMeRoot!}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  ###< doctrine/doctrine-bundle ###

  # Symfony Messenger worker (consumes the async MySQL queue).
  # Different from FRANKENPHP_MODE=worker (HTTP). This service does NOT serve HTTP.
  messenger:
    image: ${IMAGES_PREFIX:-}symfony-beacon-dev
    build:
      context: .
      target: frankenphp_dev
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_started
    env_file:
      - .env
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
    volumes:
      - ./:/app
    # Entrypoint prepares vendor/DB; then consumes Envelope ingest queue only.
    # --time-limit restarts the process periodically (Compose brings it back up).
    # Outbound notifications / HTTP-log / Web Push use messenger-notify.
    command:
      [
        "php",
        "bin/console",
        "messenger:consume",
        "async_ingest",
        "-vv",
        "--time-limit=3600",
        "--memory-limit=256M",
      ]
    # Image HEALTHCHECK expects FrankenPHP :2019; this process only runs Messenger.
    healthcheck:
      disable: true
    tty: true

  # Outbound notifications, HTTP-log, and Web Push (async transport).
  # Separate from messenger so notify backlog cannot starve Envelope ingest.
  messenger-notify:
    image: ${IMAGES_PREFIX:-}symfony-beacon-dev
    build:
      context: .
      target: frankenphp_dev
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_started
    env_file:
      - .env
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
    volumes:
      - ./:/app
    command:
      [
        "php",
        "bin/console",
        "messenger:consume",
        "async",
        "-vv",
        "--time-limit=3600",
        "--memory-limit=256M",
      ]
    healthcheck:
      disable: true
    tty: true

###> symfony/mercure-bundle ###
  # Optional Compose hub (production / legacy). Local/dev uses FrankenPHP built-in Mercure
  # (see .docker/frankenphp/Caddyfile + MERCURE_URL=http://php/.well-known/mercure).
  # Browsers always use same-origin /.well-known/mercure.
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Hub image expects its own key names (not MERCURE_JWT_SECRET from .env).
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${DEFAULT_URI:-https://localhost:9447}
        anonymous
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/healthz"]
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
  caddy_data:
  caddy_config:

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
