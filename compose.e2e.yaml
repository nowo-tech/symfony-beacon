# Isolated Playwright stack — separate Compose project, MySQL schema, Redis DB index, ports.
#
#   make up-e2e && make ready-e2e && make test-e2e-isolated
#
# Uses `.env.e2e.local` (generated by `.scripts/ensure-e2e-env.sh` from `.env.e2e.dist`).
# Does not replace the dogfood stack (`make up` / MYSQL_DATABASE=app / :9447).
#
# IMPORTANT: do not re-interpolate DATABASE_URL / REDIS_URL / MESSENGER_TRANSPORT_DSN /
# BEACON_DSN via `environment: ${VAR}`. Compose prefers the process environment over
# `--env-file`; an empty or dogfood-sourced shell var would wipe `.env.e2e.local` and
# crash messengers with "No transport supports the given Messenger DSN."
services:
  php:
    env_file: !override
      - .env.e2e.local
    environment:
      # Force isolation for keys Make always sets on the process env (see DC_E2E).
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_e2e}
      DEFAULT_URI: ${DEFAULT_URI:-https://localhost:9460}
    volumes:
      - ./:/app
      # Bind-mount covers /app; these named volumes shadow cache/log for the E2E project.
      - e2e_var_cache:/app/var/cache
      - e2e_var_log:/app/var/log

  messenger:
    env_file: !override
      - .env.e2e.local
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_e2e}
    volumes:
      - ./:/app
      - e2e_var_cache:/app/var/cache
      - e2e_var_log:/app/var/log

  messenger-notify:
    env_file: !override
      - .env.e2e.local
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_e2e}
    volumes:
      - ./:/app
      - e2e_var_cache:/app/var/cache
      - e2e_var_log:/app/var/log

  mercure:
    env_file: !override
      - .env.e2e.local
    environment:
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${DEFAULT_URI:-https://localhost:9460}
        anonymous

volumes:
  e2e_var_cache:
  e2e_var_log:
