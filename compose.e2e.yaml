# Isolated Playwright stack — separate Compose project, MySQL schema, Redis DB index, ports.
#
#   make up-e2e && make ready-e2e && make test-e2e-isolated
#
# Uses `.env.e2e.local` (generated by `.scripts/ensure-e2e-env.sh` from `.env.local`).
# Does not replace the dogfood stack (`make up` / MYSQL_DATABASE=app / :9447).
services:
  php:
    env_file:
      - .env.e2e.local
    environment:
      # Force isolation even if Compose merges env_file with the base `.env.local` list.
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_e2e}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_RO: ${DATABASE_URL_RO}
      DEFAULT_URI: ${DEFAULT_URI:-https://localhost:9460}
      REDIS_URL: ${REDIS_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      BEACON_DSN: ${BEACON_DSN:-}
    volumes:
      - ./:/app
      # Bind-mount covers /app; these named volumes shadow cache/log for the E2E project.
      - e2e_var_cache:/app/var/cache
      - e2e_var_log:/app/var/log

  messenger:
    env_file:
      - .env.e2e.local
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_e2e}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_RO: ${DATABASE_URL_RO}
      REDIS_URL: ${REDIS_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      BEACON_DSN: ${BEACON_DSN:-}
    volumes:
      - ./:/app
      - e2e_var_cache:/app/var/cache
      - e2e_var_log:/app/var/log

  messenger-notify:
    env_file:
      - .env.e2e.local
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_e2e}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_RO: ${DATABASE_URL_RO}
      REDIS_URL: ${REDIS_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      BEACON_DSN: ${BEACON_DSN:-}
    volumes:
      - ./:/app
      - e2e_var_cache:/app/var/cache
      - e2e_var_log:/app/var/log

  mercure:
    env_file:
      - .env.e2e.local
    environment:
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${DEFAULT_URI:-https://localhost:9460}
        anonymous

volumes:
  e2e_var_cache:
  e2e_var_log:
