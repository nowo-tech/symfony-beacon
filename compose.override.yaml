
services:
###> symfony/mailer ###
  # Local SMTP catcher (Mailpit) — app-local fallback when shared server/ Mailpit
  # is unavailable. Prefer: make mailpit (starts developer.local.server/server
  # container `mailpit`) → Admin DSN smtp://mailpit:1025. See docs/ops/MAILPIT.md.
  # Opt-in profile: `make mailpit` or docker compose --profile mail up -d mailer
  mailer:
    profiles: ["mail"]
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - target: 1025
        published: ${MAILPIT_SMTP_PORT:-1027}
        protocol: tcp
      - target: 8025
        published: ${MAILPIT_UI_PORT:-18026}
        protocol: tcp
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    # Image has no HEALTHCHECK; UI is ready almost immediately after start.
    networks:
      - default
      - shared
###< symfony/mailer ###

###> symfony/mercure-bundle ###
  # Hub stays on the Compose network; browsers use Caddy /.well-known/mercure.
  mercure:
    expose:
      - "80"
###< symfony/mercure-bundle ###
