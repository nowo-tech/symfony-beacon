# Optional production-oriented stack (no source bind-mount).
# Default local stack remains compose.yaml (frankenphp_dev + ./:/app).
#
#   cp .env.dist .env   # set real APP_SECRET / MySQL / SiteBackup secrets first
#   docker compose -f compose.prod.yaml --env-file .env up --build -d
#
# Secrets/config: `env_file: .env`. `environment:` only forces prod, remaps,
# fail-fast checks (${VAR:?…}), and values that must differ from the local template.
#
# Docs: docs/PRODUCTION.md
services:
  php:
    image: ${IMAGES_PREFIX:-}symfony-frankenphp
    build:
      context: .
      target: frankenphp_prod
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: prod
      # Fail fast if critical secrets are missing from .env (no values embedded here).
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      SITE_BACKUP_PASSWORD_HASH: ${SITE_BACKUP_PASSWORD_HASH:?Set SITE_BACKUP_PASSWORD_HASH}
      SITE_SETUP_TOKEN: ${SITE_SETUP_TOKEN:?Set SITE_SETUP_TOKEN}
      # Prod queue: do not auto-create tables at runtime.
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      FRANKENPHP_MODE: ${FRANKENPHP_MODE:-worker}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Persist Halite field-encryption key across container recreates (API secrets, webhooks, Mailer DSN).
      - php_secrets:/app/var/secrets
    ports:
      - target: 80
        published: ${HTTP_PORT:-9084}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-9447}
        protocol: tcp
      - target: 443
        published: ${HTTP3_PORT:-9443}
        protocol: udp

  database:
    image: mysql:${MYSQL_VERSION:-9.7}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  messenger:
    image: ${IMAGES_PREFIX:-}symfony-frankenphp
    build:
      context: .
      target: frankenphp_prod
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_started
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      SITE_BACKUP_PASSWORD_HASH: ${SITE_BACKUP_PASSWORD_HASH:?Set SITE_BACKUP_PASSWORD_HASH}
      SITE_SETUP_TOKEN: ${SITE_SETUP_TOKEN:?Set SITE_SETUP_TOKEN}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
    volumes:
      - php_secrets:/app/var/secrets
    command:
      [
        "php",
        "bin/console",
        "messenger:consume",
        "async_ingest",
        "-vv",
        "--time-limit=3600",
        "--memory-limit=256M",
      ]

  # Outbound notifications, HTTP-log, and Web Push (async transport).
  messenger-notify:
    image: ${IMAGES_PREFIX:-}symfony-frankenphp
    build:
      context: .
      target: frankenphp_prod
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_started
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      SITE_BACKUP_PASSWORD_HASH: ${SITE_BACKUP_PASSWORD_HASH:?Set SITE_BACKUP_PASSWORD_HASH}
      SITE_SETUP_TOKEN: ${SITE_SETUP_TOKEN:?Set SITE_SETUP_TOKEN}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
    volumes:
      - php_secrets:/app/var/secrets
    command:
      [
        "php",
        "bin/console",
        "messenger:consume",
        "async",
        "-vv",
        "--time-limit=3600",
        "--memory-limit=256M",
      ]

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${DEFAULT_URI:?Set DEFAULT_URI}
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  caddy_data:
  caddy_config:
  database_data:
  php_secrets:
  mercure_data:
  mercure_config:
