# Production-oriented app stack (no source bind-mount).
# Infra (MySQL + Redis): compose.infra.yaml — `make up-infra` then:
#   docker compose -f compose.prod.yaml --env-file .env.local up --build -d
# Or: make up-prod
#
# Secrets/config: `env_file: .env`. `environment:` only forces prod, remaps,
# fail-fast checks (${VAR:?…}), and values that must differ from the local template.
#
# Docs: docs/PRODUCTION.md · docs/ops/SHARED-SERVER.md
services:
  php:
    image: ${IMAGES_PREFIX:-}symfony-frankenphp
    build:
      context: .
      target: frankenphp_prod
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      APP_ENV: prod
      # Fail fast if critical secrets are missing from .env (no values embedded here).
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.local.local}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      SITE_BACKUP_PASSWORD_HASH: ${SITE_BACKUP_PASSWORD_HASH:?Set SITE_BACKUP_PASSWORD_HASH}
      SITE_SETUP_TOKEN: ${SITE_SETUP_TOKEN:?Set SITE_SETUP_TOKEN}
      # Prod queue: Redis by default (override with doctrine://… only if needed).
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://${REDIS_HOST:-redis-8.10.0}:${REDIS_PORT:-6379}/messages}
      FRANKENPHP_MODE: ${FRANKENPHP_MODE:-worker}
      # Never enable filesystem watch / hot_reload in production.
      FRANKENPHP_WORKER_CONFIG: ""
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Persist Halite field-encryption key across container recreates (API secrets, webhooks, Mailer DSN).
      - php_secrets:/app/var/secrets
    ports:
      - target: 80
        published: ${HTTP_PORT:-9084}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-9447}
        protocol: tcp
      - target: 443
        published: ${HTTP3_PORT:-9443}
        protocol: udp
    networks:
      - default
      - shared

  messenger:
    image: ${IMAGES_PREFIX:-}symfony-frankenphp
    build:
      context: .
      target: frankenphp_prod
    restart: unless-stopped
    depends_on:
      php:
        condition: service_started
    env_file:
      - .env.local
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.local.local}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      SITE_BACKUP_PASSWORD_HASH: ${SITE_BACKUP_PASSWORD_HASH:?Set SITE_BACKUP_PASSWORD_HASH}
      SITE_SETUP_TOKEN: ${SITE_SETUP_TOKEN:?Set SITE_SETUP_TOKEN}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://${REDIS_HOST:-redis-8.10.0}:${REDIS_PORT:-6379}/messages}
    volumes:
      - php_secrets:/app/var/secrets
    command:
      [
        "php",
        "bin/console",
        "messenger:consume",
        "async_ingest",
        "-vv",
        "--time-limit=3600",
        "--memory-limit=256M",
      ]
    networks:
      - default
      - shared

  # Outbound notifications, HTTP-log, and Web Push (async transport).
  messenger-notify:
    image: ${IMAGES_PREFIX:-}symfony-frankenphp
    build:
      context: .
      target: frankenphp_prod
    restart: unless-stopped
    depends_on:
      php:
        condition: service_started
    env_file:
      - .env.local
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.local.local}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      SITE_BACKUP_PASSWORD_HASH: ${SITE_BACKUP_PASSWORD_HASH:?Set SITE_BACKUP_PASSWORD_HASH}
      SITE_SETUP_TOKEN: ${SITE_SETUP_TOKEN:?Set SITE_SETUP_TOKEN}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://${REDIS_HOST:-redis-8.10.0}:${REDIS_PORT:-6379}/messages}
    volumes:
      - php_secrets:/app/var/secrets
    command:
      [
        "php",
        "bin/console",
        "messenger:consume",
        "async",
        "-vv",
        "--time-limit=3600",
        "--memory-limit=256M",
      ]
    networks:
      - default
      - shared

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${DEFAULT_URI:?Set DEFAULT_URI}
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    networks:
      - default
      - shared

volumes:
  caddy_data:
  caddy_config:
  php_secrets:
  mercure_data:
  mercure_config:

networks:
  shared:
    name: ${SHARED_DOCKER_NETWORK:-server_network}
    external: true
