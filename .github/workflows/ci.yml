name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_ENV_FILES: .env.local
  APP_ENV: test
  APP_SECRET: ChangeMePleaseUseARealSecret
  DEFAULT_URI: http://localhost
  DATABASE_URL: mysql://app:!ChangeMe!@127.0.0.1:3306/app?serverVersion=9.7&charset=utf8mb4
  MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
  COMPOSER_ALLOW_SUPERUSER: "1"

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so rotated/removed secrets still fail the gate.
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository for secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  git-hygiene:
    name: Git hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history — trailers must not appear on any ancestor of HEAD.
          fetch-depth: 0

      - name: Block Cursor co-author / Made-with trailers
        run: sh .scripts/check-no-cursor-coauthor.sh HEAD

      - name: Module boundaries (AdminProject ownership)
        run: sh .scripts/check-module-boundaries.sh

  qa:
    name: Quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.5"]

    services:
      mysql:
        # AWS Public ECR mirror of Docker Hub library/mysql — avoids Hub pull timeouts on GHA
        image: public.ecr.aws/docker/library/mysql:9.7
        env:
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: "!ChangeMe!"
          MYSQL_ROOT_PASSWORD: "!ChangeMeRoot!"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p!ChangeMeRoot!"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, intl, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.12.4 --activate

      - name: Install and build front-end assets
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Prepare environment
        run: |
          cp .env.dist .env.local
          php -r '
            $pdo = new PDO("mysql:host=127.0.0.1;port=3306", "root", "!ChangeMeRoot!");
            $pdo->exec("CREATE DATABASE IF NOT EXISTS app_test");
            $pdo->exec("GRANT ALL ON app_test.* TO '\''app'\''@'\''%'\''");
            echo "app_test ready\n";
          '

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer check --diff

      - name: Twig-CS-Fixer
        run: vendor/bin/twig-cs-fixer lint --config=.twig-cs-fixer.dist.php

      - name: PHPStan
        run: |
          php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --memory-limit=512M -c phpstan.neon.dist

      - name: Rector
        run: vendor/bin/rector process --dry-run

      - name: PHPUnit
        run: |
          rm -rf var/cache/test
          php bin/console cache:warmup --env=test
          vendor/bin/phpunit

  # Coverage (PCOV) for the includable PHPUnit tree; default gate is 100%.
  coverage:
    name: Coverage (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.5"]
    env:
      # Statement coverage floor for includable PHPUnit source; keep at 100 unless debugging locally.
      COVERAGE_MIN: "100"

    services:
      mysql:
        # AWS Public ECR mirror of Docker Hub library/mysql — avoids Hub pull timeouts on GHA
        image: public.ecr.aws/docker/library/mysql:9.7
        env:
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: "!ChangeMe!"
          MYSQL_ROOT_PASSWORD: "!ChangeMeRoot!"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p!ChangeMeRoot!"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, intl, pdo_mysql, zip
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.12.4 --activate

      - name: Install and build front-end assets
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Prepare environment
        run: |
          cp .env.dist .env.local
          php -r '
            $pdo = new PDO("mysql:host=127.0.0.1;port=3306", "root", "!ChangeMeRoot!");
            $pdo->exec("CREATE DATABASE IF NOT EXISTS app_test");
            $pdo->exec("GRANT ALL ON app_test.* TO '\''app'\''@'\''%'\''");
            echo "app_test ready\n";
          '

      - name: PHPUnit with coverage
        run: |
          rm -rf var/cache/test
          php bin/console cache:warmup --env=test
          mkdir -p var/coverage var/coverage-html
          vendor/bin/phpunit \
            --coverage-text \
            --coverage-clover var/coverage/clover.xml \
            --coverage-html var/coverage-html

      - name: Soft coverage threshold
        run: sh .scripts/check-coverage-threshold.sh var/coverage/clover.xml

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage-${{ matrix.php }}
          path: |
            var/coverage/clover.xml
            var/coverage-html
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      PLAYWRIGHT_REQUIRE_SAMPLE: "1"
      PLAYWRIGHT_BASE_URL: https://localhost:9447
      PLAYWRIGHT_MAILPIT_URL: http://127.0.0.1:18026
      COMPOSER_ALLOW_SUPERUSER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare environment
        run: cp .env.dist .env.local

      # App compose attaches to SHARED_DOCKER_NETWORK as external; infra owns MySQL + Redis.
      - name: Start shared infra (MySQL + Redis)
        run: make up-infra

      - name: Build and start Compose stack
        run: |
          docker compose build
          # Install vendor once before php/messenger share the bind mount (avoids concurrent composer).
          docker compose run --rm --no-deps php \
            composer install --prefer-dist --no-progress --no-interaction
          docker compose --profile mail up -d
          # External shared network can race with first up; ensure php can resolve MySQL.
          NET="$(grep -E '^SHARED_DOCKER_NETWORK=' .env.local | cut -d= -f2- || true)"
          NET="${NET:-server_network}"
          for svc in php messenger messenger-notify; do
            cid="$(docker compose ps -q "$svc" 2>/dev/null || true)"
            if [ -n "$cid" ]; then
              docker network connect "$NET" "$cid" 2>/dev/null || true
            fi
          done
          # Entrypoint migrates when DB is ready; wait for HTTPS + DB DNS.
          for i in $(seq 1 90); do
            if curl -kfsS https://localhost:9447/health/live >/dev/null 2>&1 \
              && docker compose exec -T php test -f vendor/autoload_runtime.php \
              && docker compose exec -T php getent hosts mysql-9.7-primary >/dev/null 2>&1; then
              echo "Stack is live (vendor ready, MySQL DNS ok)"
              exit 0
            fi
            echo "Waiting for HTTPS + vendor + MySQL DNS… (${i}/90)"
            sleep 5
          done
          echo "Timed out waiting for /health/live or MySQL DNS" >&2
          docker compose exec -T php getent hosts mysql-9.7-primary || true
          docker network inspect "$NET" --format '{{json .Containers}}' || true
          docker compose logs --tail=200
          docker compose -p shared-infra -f compose.infra.yaml --env-file .env.local logs --tail=100 || true
          exit 1

      - name: Wait for Mailpit UI
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18026/api/v1/info >/dev/null 2>&1; then
              echo "Mailpit is up"
              exit 0
            fi
            echo "Waiting for Mailpit… (${i}/30)"
            sleep 2
          done
          echo "Mailpit UI did not become ready (UC-ADM-33 will soft-skip)" >&2
          docker compose --profile mail ps || true
          exit 0

      - name: Setup Node (host Playwright deps mount)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.12.4 --activate

      - name: Ensure node_modules on host
        run: |
          # Compose entrypoint may create root-/frankenphp-owned node_modules; reclaim for host pnpm.
          sudo chown -R "$(id -u):$(id -g)" node_modules vendor public/build 2>/dev/null || true
          if [ ! -d node_modules/@playwright/test ]; then
            pnpm install --frozen-lockfile
          fi

      - name: Build frontend assets
        run: make vite-build

      - name: Seed demo + sample data
        run: |
          make ready
          make seed-sample

      - name: Playwright E2E
        run: make test-e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down Compose
        if: always()
        run: |
          docker compose --profile hmr --profile mail down -v || true
          make down-infra || true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frankenphp_dev
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frankenphp_dev
          push: false
          tags: symfony-frankenphp-dev:ci
          cache-from: type=gha,scope=frankenphp-dev
          cache-to: type=gha,mode=max,scope=frankenphp-dev

      - name: Build frankenphp_prod
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frankenphp_prod
          push: false
          tags: symfony-frankenphp:ci
          cache-from: type=gha,scope=frankenphp-prod
          cache-to: type=gha,mode=max,scope=frankenphp-prod
