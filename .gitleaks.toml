# Gitleaks — block committed secrets in CI (`make secrets-scan`).
# https://github.com/gitleaks/gitleaks
title = "symfony-beacon"

[extend]
# Inherit default rule set (API keys, private keys, tokens, …).
useDefault = true

[[allowlists]]
description = "Paths that are never scanned as application secrets"
paths = [
  '''(^|/)vendor/''',
  '''(^|/)node_modules/''',
  '''(^|/)public/build/''',
  '''(^|/)\.php-cs-fixer\.cache$''',
  '''(^|/)\.twig-cs-fixer\.cache$''',
  '''(^|/)\.phpunit\.cache/''',
]

# False positive: prose "…token revoke, notification/threshold…" matches generic-api-key
# (comma treated as assignment; slash allowed in the captured "secret").
[[allowlists]]
description = "CSRF spec prose — notification/threshold is not a credential"
targetRules = ["generic-api-key"]
stopwords = [
  '''notification/threshold''',
]
