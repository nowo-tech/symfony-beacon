login:
    heading: Anmelden
    submit: Anmelden
    register_link: Erstes Konto erstellen
# FormKit convention keys (login_form.<field>.placeholder|help) — AuthKit only sets labels.
login_form:
    _username:
        placeholder: E-Mail oder Benutzername
        help: ''
    _password:
        placeholder: Passwort
        help: ''
    _remember_me:
        placeholder: ''
        help: ''
register:
    heading: Konto erstellen
    submit: Registrieren
    login_link: Ich habe bereits ein Konto
    field:
        displayName: Anzeigename
