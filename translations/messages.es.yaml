mercure_settings:
  title: Mercure
  intro: Alertas en vivo opcionales para miembros conectados cuando se crea una incidencia
    nueva. Desactivado por defecto — actívalo solo si hay un hub Mercure disponible.
    El Web Push sigue siendo una opción aparte en Cuenta → Interfaz.
  manual_hint: 'Usa «Cómo configurar» para una guía paso a paso con ejemplos. Manual
    completo del operador: docs/ops/MERCURE.md en el repositorio.'
  status:
    active: Las alertas Mercure en vivo están activadas para los miembros.
    inactive: Mercure está desactivado
    inactive_help: Los miembros no abrirán un EventSource hasta que actives Mercure
      aquí y proporciones una URL de hub alcanzable + secreto JWT (guardados abajo
      o vía entorno).
    url_database: La URL de publicación del hub se guarda en los ajustes de instancia.
    url_env: La URL de publicación del hub usa MERCURE_URL del entorno como respaldo.
    url_missing: No hay URL de publicación del hub configurada (indícala abajo o MERCURE_URL).
    secret_database: El secreto JWT se guarda cifrado en los ajustes de instancia.
    secret_env: El secreto JWT usa MERCURE_JWT_SECRET del entorno como respaldo.
    secret_missing: No hay secreto JWT configurado (indícalo abajo o MERCURE_JWT_SECRET).
  public_url_preview: 'URL del hub en el navegador: %url%'
  push_note: El push PWA en segundo plano se configura por usuario en Cuenta → Interfaz
    (requiere claves VAPID_*). No depende de Mercure.
  submit: Guardar ajustes de Mercure
  guide:
    open: Cómo configurar
    close: Cerrar
    title: Configurar Mercure paso a paso
    intro: Los toasts en vivo de incidencias nuevas usan un hub Mercure (Server-Sent
      Events). Mercure es opcional e independiente del Web Push (Cuenta → Interfaz).
    overview:
      title: 1. Qué necesitas
      body: Beacon publica actualizaciones privadas; los miembros suscritos las reciben
        mientras tienen una pestaña abierta. Estas piezas deben coincidir.
      item_hub: Un hub Mercure (servicio Compose mercure, u otro hub compatible).
      item_jwt: Un secreto JWT HMAC compartido (≥ 32 caracteres) para PHP y el hub.
      item_admin: El interruptor de esta pantalla, más overrides opcionales de URL/secreto.
      item_proxy: Acceso same-origin del navegador vía Caddy en /.well-known/mercure (por defecto en Compose).
    env:
      title: 2. Variables de entorno
      lead: Es preferible configurar el hub en .env y dejar los campos del formulario
        vacíos para que Administración solo active o desactive la función.
      step1: Copia o confirma estas variables en .env (desde .env.dist).
      step1_example: |
        MERCURE_URL=http://mercure/.well-known/mercure
        MERCURE_PUBLIC_URL=${DEFAULT_URI}/.well-known/mercure
        MERCURE_JWT_SECRET="!ChangeThisMercureHubJWTSecretKey!"
      step2: Sustituye el secreto JWT de ejemplo por un valor fuerte (mínimo 32 caracteres).
      step2_example: openssl rand -base64 48
      step2_note: La misma cadena debe usarla PHP (MERCURE_JWT_SECRET) y el hub
        (compose.yaml la mapea a MERCURE_PUBLISHER_JWT_KEY y MERCURE_SUBSCRIBER_JWT_KEY).
      step3: Qué hace cada variable.
      table_var: Variable
      table_meaning: Significado
      row_url: URL interna de publicación desde PHP (ejemplo Compose a la izquierda).
      row_public: URL del EventSource en el navegador. Prefiere ${DEFAULT_URI}/.well-known/mercure
        para permanecer same-origin a través de Caddy.
      row_jwt: Secreto HMAC compartido para JWT de publicación y suscripción.
    start:
      title: 3. Arrancar el hub
      step1: Arranca o recrea Mercure con el stack de la app.
      step1_example: |
        docker compose up -d mercure php
        # o el stack completo:
        make up
      step2: Comprueba el healthcheck del hub (dentro de la red Compose).
      step2_example: docker compose exec mercure curl -fsS http://127.0.0.1/healthz
      step3: Confirma que Caddy hace proxy al hub (ya está en .docker/frankenphp/Caddyfile).
      step3_example: |
        handle /.well-known/mercure* {
            reverse_proxy mercure:80
        }
    admin:
      title: 4. Activar alertas aquí
      step1: Activa «Activar alertas Mercure en vivo».
      step2: Deja vacíos Publish URL, Public URL y JWT para usar MERCURE_* del entorno.
      step3: O rellena esos campos para sobrescribir el env (se cifran en la base de datos).
      step4: Guarda. El panel de estado de arriba debería mostrar las alertas como activas.
      step5: Entra como miembro del proyecto, mantén una pestaña abierta, crea una incidencia nueva y comprueba el toast.
      current_url: 'URL de hub del navegador resuelta ahora: %url%'
    verify:
      title: 5. Verificar en el navegador
      step1: Abre DevTools → Network y filtra por mercure o EventSource.
      step2: Confirma una conexión a /.well-known/mercure (o tu public URL) con un JWT de autorización.
      step3: Crea una incidencia nueva en un proyecto al que pertenezcas y observa el evento SSE / toast.
      step4: GET /account/realtime/config solo incluye hubUrl + token cuando Mercure está activo y bien configurado.
      curl_example: |
        # Desde el host (sustituye por tu DEFAULT_URI)
        curl -sI "${DEFAULT_URI}/.well-known/mercure"
    external:
      title: 6. Hub externo (opcional)
      lead: Puedes apuntar Beacon a cualquier hub compatible con Mercure en lugar del servicio Compose.
      step1: Pon MERCURE_URL (o Publish URL) en un endpoint alcanzable desde el contenedor PHP.
      step2: Pon MERCURE_PUBLIC_URL (o Public URL) en una URL HTTPS que el navegador pueda abrir.
      step3: Usa el mismo secreto JWT en las claves publisher/subscriber del hub y en Beacon.
      step4: Si el hub es cross-origin, configura CORS del hub (cors_origins) con el origen de Beacon.
      example: |
        MERCURE_URL=https://mercure.example.com/.well-known/mercure
        MERCURE_PUBLIC_URL=https://mercure.example.com/.well-known/mercure
        MERCURE_JWT_SECRET="your-shared-secret-at-least-32-chars"
    troubleshoot:
      title: 7. Resolución de problemas
      inactive: Estado inactivo — interruptor apagado, o falta URL/secreto (DB y env vacíos).
      publish: Errores de publicación en logs — PHP no alcanza MERCURE_URL, o JWT ≠ claves del hub.
      unauthorized: EventSource 401 — el secreto del JWT de suscriptor ≠ MERCURE_SUBSCRIBER_JWT_KEY del hub.
      cors: Errores CORS — la public URL es cross-origin y cors_origins del hub no incluye Beacon.
      ciphertext: El navegador pide una ruta sin sentido como /MUIFA…== — falló el descifrado de overrides;
        limpia Publish/Public/JWT aquí (o déjalos vacíos) y usa los valores del entorno.
      push: Que los toasts solo aparezcan con la pestaña abierta es lo esperado; usa Web Push (VAPID_*) para segundo plano.
      recreate: |
        # Tras cambiar variables del hub
        docker compose up -d --force-recreate mercure
    docs_hint: Referencia completa (topics, privacidad, producción) — docs/ops/MERCURE.md.
