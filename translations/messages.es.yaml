    label: Legal
  last_updated: 'Última actualización: %date%'
  manage_cookies: Configuración de cookies
  placeholder:
    legal_name: 'Nombre legal: [Nombre legal del operador — sustituir]'
    address: 'Dirección: [Domicilio social — sustituir]'
    contact_email: 'Contacto: [privacy@ejemplo.com — sustituir]'
    registration: 'Registro mercantil / NIF: [si aplica — sustituir]'
  notice:
    title: Aviso legal
    intro: Este aviso legal aplica a la instancia autoalojada de %brand% que estás
      visitando. Sustituye los marcadores siguientes por los datos reales del operador
      antes del uso público.
    operator_heading: Operador
    operator_body: El operador de esta instancia es responsable del servicio y de
      los contenidos que publique aquí.
    hosting_heading: Alojamiento
    hosting_body: Este software puede alojarlo el operador o un proveedor de infraestructura
      elegido por el operador. Completa los detalles de hosting según tu despliegue.
    liability_heading: Responsabilidad
    liability_body: El software se ofrece tal cual. El operador sigue siendo responsable
      del uso lícito, del cumplimiento en protección de datos y de la exactitud de
      los textos legales específicos de esta instancia.
  privacy:
    title: Política de privacidad
    intro: Esta política describe cómo pueden tratarse datos personales al usar esta
      instancia de %brand%. El operador debe adaptarla a su organización y jurisdicción.
    controller_heading: Responsable del tratamiento
    controller_body: El operador de esta instancia Beacon es el responsable del tratamiento
      de las cuentas y la telemetría almacenadas en su despliegue. Completa nombre
      legal y contacto en la página de Aviso legal.
    data_heading: Datos que tratamos
    data_body: 'Según cómo configure y use la instancia el operador, el tratamiento
      puede incluir:'
    data_account: Datos de cuenta (correo, nombre visible, hash de contraseña, roles,
      preferencias)
    data_telemetry: Telemetría de errores y rendimiento enviada vía DSN / Envelope
    data_logs: Registros operativos y, opcionalmente, logs de consentimiento de cookies
    data_cookies: Cookies y tecnologías similares descritas en la página de Cookies
    purpose_heading: Finalidades
    purpose_body: Los datos se tratan para autenticar usuarios, operar el seguimiento
      de errores de los proyectos configurados, asegurar el servicio y (si está activo)
      recordar preferencias de cookies.
    retention_heading: Conservación
    retention_body: Los plazos de conservación los define el operador (ciclo de vida
      de cuentas, retención de proyectos, logs). Sustituye este párrafo por el calendario
      de tu organización.
    rights_heading: Tus derechos
    rights_body: Según la normativa aplicable (por ejemplo el RGPD), puedes tener
      derechos de acceso, rectificación, supresión, limitación, portabilidad y oposición.
      Contacta con el operador usando los datos del Aviso legal.
    cookies_heading: Cookies
    cookies_body: Usamos cookies necesarias para el acceso y el almacenamiento del
      consentimiento. Las categorías opcionales (preferencias, analítica) solo se
      activan si las permites en el banner de cookies.
  terms:
    title: Términos de uso
    intro: Estos términos regulan el uso de esta instancia de %brand%. El operador
      debe sustituir esta plantilla por términos acordes a su oferta (herramienta
      interna, SaaS, etc.).
    service_heading: Servicio
    service_body: Beacon ofrece seguimiento autoalojado de errores y rendimiento para
      proyectos configurados por usuarios autorizados.
    accounts_heading: Cuentas
    accounts_body: Debes mantener la confidencialidad de tus credenciales y usar el
      servicio solo para proyectos y datos que estés autorizado a tratar.
    accept_heading: Uso aceptable
    accept_body: No abuses de la API de ingest, no intentes accesos no autorizados
      ni subas contenido ilícito. El operador puede suspender cuentas que incumplan
      estos términos.
    limitation_heading: Limitación de responsabilidad
    limitation_body: En la medida permitida por la ley, el operador y los autores
      del software no responden de daños indirectos derivados del uso del servicio.
      Revisa esta cláusula con asesoramiento legal.
    changes_heading: Cambios
    changes_body: El operador puede actualizar estos términos. El uso continuado tras
      el aviso puede implicar la aceptación de los términos actualizados cuando la
      ley lo permita.
  cookies:
    title: Aviso de cookies
    intro: Esta página describe las cookies y tecnologías similares utilizadas por
      esta instancia de %brand%. Las cookies estrictamente necesarias sustentan la
      autenticación, la seguridad y el registro del consentimiento. Las categorías
      opcionales se utilizan únicamente con su consentimiento previo. Use Configuración
      de cookies para revisar o modificar su selección en cualquier momento.
    categories_heading: Categorías
    cat_required: Estrictamente necesarias
    cat_required_help: Imprescindibles para la autenticación, la seguridad y el registro
      de su decisión de consentimiento. Estas cookies no pueden desactivarse.
    cat_preferences: Preferencias
    cat_preferences_help: Cookies opcionales que almacenan elecciones de presentación
      o de funciones no esenciales cuando el operador las habilita y usted las acepta.
    cat_analytics: Analítica
    cat_analytics_help: Cookies de medición opcionales, utilizadas solo si el operador
      activa herramientas de analítica y usted otorga su consentimiento previo.
    inventory_heading: Inventario de cookies
    col_name: Nombre
    col_category: Categoría
    col_duration: Duración
    col_purpose: Finalidad
    duration_session: Hasta 1 día
    duration_remember: Hasta 30 días
    duration_consent: Aproximadamente 1 año
    purpose_session: Mantiene la sesión HTTP autenticada necesaria para acceder a
      las áreas protegidas del servicio.
    purpose_remember: Permite la autenticación persistente cuando se selecciona «Recordarme»
      al iniciar sesión (token seguro; duración limitada).
    purpose_csrf: Cookie CSRF de doble envío de corta duración que Symfony establece
      al enviar formularios protegidos (patrón csrf-token_<token>; prefijo __Host-
      en HTTPS).
    purpose_consent: Cookie_Consent y Cookie_Consent_Key registran que se tomó una
      decisión de consentimiento y vinculan una clave anónima al registro de auditoría
      en el servidor.
    purpose_category: Cookie_Category_analytics y Cookie_Category_preferences almacenan
      si cada categoría opcional fue aceptada o rechazada (mecanismo de consentimiento,
      no rastreadores).
    storage_heading: Almacenamiento local
    storage_body: La preferencia de tema (claro/oscuro) y algunas opciones de interfaz
      pueden guardarse en el localStorage del navegador y no constituyen cookies HTTP.
      Según la orientación habitual sobre ePrivacy, puede tratarse como estrictamente
      necesaria para una interfaz coherente; el operador debe confirmar las normas
      aplicables en su jurisdicción.
