      all: Todas
      involved: Involucrado
    event:
      'issue.new': Incidencia nueva
      'issue.regression': Regresión
      'issue.resolved': Resuelta
      'issue.reopened': Reabierta
      'issue.assigned': Asignada
      'issue.commented': Comentario
    event_help:
      'issue.new': Cuando se ingiere una incidencia nueva en un proyecto al que tienes
        acceso.
      'issue.regression': Cuando una incidencia ya resuelta vuelve a ocurrir.
      'issue.resolved': Cuando una incidencia se marca como resuelta.
      'issue.reopened': Cuando se reabre una incidencia resuelta.
      'issue.assigned': Cuando se asigna (o reasigna) una incidencia.
      'issue.commented': Cuando alguien comenta en una incidencia.
  push_notifications: Push del navegador (dispositivo)
  push_notifications_help: Opt-in opcional del dispositivo. Si lo activas, Beacon pide
    permiso al navegador y puede entregar alertas según tus preferencias de miembro —
    también con la app en segundo plano (PWA o navegador compatible). Los toasts en
    vivo requieren Administración → Mercure por separado, y el interruptor de alertas
    de miembro de arriba.
  push_title: Push del navegador
  push_intro: Activa la casilla de abajo, guarda y acepta el permiso cuando el navegador
    lo pida. El envío sigue tus preferencias de alertas de miembro de arriba.
  push_privacy: El push del navegador usa un endpoint de suscripción del dispositivo
    (no cookies de marketing). Puedes desactivarlo cuando quieras; consulta Privacidad
    y Ajustes de cookies.
  push_unavailable_title: Notificaciones push no disponibles
  push_unavailable_help: El operador no ha configurado las claves VAPID (VAPID_PUBLIC_KEY
    / VAPID_PRIVATE_KEY). Pide a un administrador, o usa toasts Mercure cuando estén
    activos en Administración → Mercure.
  issue_panels_collapsed: Paneles de incidencia colapsados por defecto
  issue_panels_help: Los paneles marcados empiezan colapsados en el detalle de incidencia/evento.
