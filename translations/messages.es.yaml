  member_alerts:
    title: Alertas de miembro
    intro: Los toasts en vivo (Mercure) y el Web Push usan estos valores de cuenta.
      Todo está activado por defecto; desactiva el interruptor general o un tipo de
      evento para reducir ruido. El alcance puede limitar las alertas a incidencias
      donde eres asignado o mencionado. Afina cada proyecto en Proyecto → Ajustes.
    master: Activar alertas de miembro
    master_help: Si está desactivado, no recibes toasts en vivo ni Web Push por eventos
      de incidencias. Se conservan tus elecciones de eventos y proyectos.
    master_off_hint: Las alertas de miembro están desactivadas. Activa el interruptor
      para configurar valores de cuenta, anulaciones por proyecto y push del navegador.
    events_title: Valores por defecto de la cuenta
    events_help: Se aplican a todos los proyectos salvo que los anules en los ajustes
      de ese proyecto.
    projects_title: Por proyecto
    projects_help: Solo aparecen los proyectos a los que tienes acceso. El envío requiere
      el interruptor de cuenta anterior y el proyecto activado aquí.
    projects_account_hint: Abre un proyecto para afinar alertas solo de ese proyecto
      (modal). El envío sigue requiriendo el interruptor de cuenta de arriba.
    projects_empty: Aún no eres miembro de ningún proyecto.
    project_page_title: Mis alertas en este proyecto
    project_page_intro: Estas preferencias solo te afectan a ti en este proyecto. Se
      combinan con los valores de tu cuenta y con los destinos del equipo — los
      toasts/push de miembro se lanzan cuando coinciden tus prefs y el evento; los
      destinos notifican canales externos de forma independiente.
    account_defaults_link: Editar valores por defecto de la cuenta
    project_save: Guardar mis alertas del proyecto
    modal_close: Cerrar
    project_enabled: Alertas para este proyecto
    project_off_hint: Las alertas de este proyecto están desactivadas. Activa el interruptor
      para definir anulaciones de eventos, o déjalo apagado para silenciar este proyecto
      manteniendo los valores de la cuenta.
    project_overrides: Anulaciones de eventos en este proyecto
    reset_overrides: Restablecer anulaciones (heredar valores de la cuenta)
    reset_overrides_help: Al guardar, borra las anulaciones por evento guardadas para
      este proyecto.
    has_overrides: Anulaciones personalizadas guardadas
    enabled: Notificar este evento
    scope_label: Alcance
    scope_switch_help: Apagado = todas las incidencias del proyecto; encendido = solo
      cuando estás involucrado
