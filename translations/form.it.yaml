# FormKit field catalogue (label / placeholder / help). Domain: form
admin_user:
  email:
    label: Email
    placeholder: nome@esempio.com
    help: Email di accesso di questo account.
  display_name:
    label: Nome visualizzato
    placeholder: Anna Rossi
    help: Mostrato nella directory admin e nella timeline attività.
  password:
    label: Password
    placeholder: Almeno 8 caratteri
    help: Almeno 8 caratteri.
  role:
    label: Ruolo
    placeholder: Seleziona un ruolo
    help: Ruolo di istanza (utente o admin).
  enabled:
    label: Account abilitato (può accedere)
    placeholder: ''
    help: Se disabilitato, l’utente non può accedere.
admin_instance_role:
  name:
    label: Nome
    placeholder: Supporto
    help: Fallback nel database per il nome visualizzato. La UI preferisce roles.catalog.<slug>.name se
      quella chiave è tradotta (slug = codice in minuscolo).
  code:
    label: Codice
    placeholder: ROLE_SUPPORT
    help: Codice in stile Symfony (es. ROLE_SUPPORT). Id macchina — non tradotto.
  description:
    label: Quando usarlo
    placeholder: Guida breve opzionale…
    help: Breve guida su quando assegnare questo ruolo. Preferisci roles.catalog.<slug>.description; questo
      campo è il fallback nel DB.
  enabled:
    label: Abilitato
    help: Se disabilitato, questo ruolo non può essere assegnato di nuovo.
project:
  nav:
    label: Sezioni del progetto
  governance:
    help: Conservazione per progetto, limiti di velocità e quote giornaliere. Lascia un campo vuoto per
      ereditare l'impostazione predefinita del server.
    inherit_hint: Vuoto = eredita l'impostazione predefinita del server (%default%). Utilizzare 0 per
      disabilitare quando il valore predefinito è diverso da zero.
    retention_days:
      label: Giorni di conservazione
    retention_max_events:
      label: Numero massimo di eventi memorizzati
    ingest_rate_limit:
      label: Limite di velocità di acquisizione (al minuto)
    event_quota_daily:
      label: Quota eventi giornaliera
    event_quota_monthly:
      label: Quota mensile di eventi
  name:
    label: Nome
    placeholder: per esempio. API di fatturazione
    help: Visualizzato nella dashboard e utilizzato per derivare lo slug del progetto.
    required: Il nome del progetto è obbligatorio.
  description:
    label: Descrizione
    placeholder: Breve riepilogo facoltativo
    help: Aiuta il tuo team a riconoscere questo progetto.
  api_keys:
    help: Utilizza un DSN in BEACON_DSN in modo che la tua app possa inviare errori a questo progetto.
  members:
    help: Membri diretti di questo progetto. I proprietari e gli amministratori gestiscono l'appartenenza.
      L'accesso può provenire anche dai gruppi collegati di seguito.
    email_label: E-mail del membro
    email_placeholder: utente@esempio.com
    role:
      admin: Ammin
      full: Full
      member: Membro
      owner: Proprietario
      viewer: Viewer
    role_label: Ruolo
  groups:
    help: Collega un gruppo in modo che ogni membro del gruppo ottenga il ruolo scelto in questo progetto.
      I proprietari devono essere aggiunti come singoli utenti.
    select: Seleziona un gruppo...
  config:
    help: 'JSON portabile per questo progetto (codice: %code%). Include membership per email; mai i segreti
      API.'
  danger:
    transfer_member_placeholder: Seleziona un membro...
site_appearance:
  brand_name:
    label: Marchio
    placeholder: symfony-beacon
    help: Mostrato nell'intestazione e nella pagina di accesso.
  brand_eyebrow:
    label: Sopracciglio di marca
    placeholder: Tracciamento degli errori
    help: Breve etichetta sopra il marchio nella schermata di accesso.
  accent_color:
    label: Accento
    placeholder: '#1f6f54'
    help: Accento primario (pulsanti, collegamenti) in modalità luce.
  accent_deep_color:
    label: Accento (al passaggio del mouse)
    placeholder: '#134736'
    help: Accento più scuro per gli stati al passaggio del mouse in modalità luce.
  accent_color_dark:
    label: Accento (scuro)
    placeholder: '#4aad7f'
    help: Accento primario in modalità oscura.
  accent_deep_color_dark:
    label: Accento al passaggio del mouse (scuro)
    placeholder: '#6bc49a'
    help: Accento più chiaro per gli stati al passaggio del mouse in modalità oscura.
  danger_color:
    label: Pericolo
    placeholder: '#b42318'
    help: Errore/accento distruttivo in modalità luce.
  danger_color_dark:
    label: Pericolo (scuro)
    placeholder: '#f97066'
    help: Errore/accento distruttivo in modalità oscura.
  warn_color:
    label: Avviso
    placeholder: '#b54708'
    help: Accento di avviso in modalità chiara.
  warn_color_dark:
    label: Avviso (scuro)
    placeholder: '#fdb022'
    help: Accento di avviso in modalità scura.
  paper_color:
    label: Carta
    placeholder: '#f3f6f4'
    help: Sfondo della pagina in modalità chiara.
  paper_color_dark:
    label: Carta (scuro)
    placeholder: '#0c1210'
    help: Sfondo della pagina in modalità scura.
  ink_color:
    label: Inchiostro
    placeholder: '#0f1c18'
    help: Colore del testo principale in modalità chiara.
  ink_color_dark:
    label: Inchiostro (scuro)
    placeholder: '#e6eee9'
    help: Colore del testo principale in modalità scura.
  surface_color:
    label: Superficie
    placeholder: '#ffffff'
    help: Pannelli e schede in modalità chiara.
  surface_color_dark:
    label: Superficie (scuro)
    placeholder: '#151c19'
    help: Pannelli e schede in modalità scura.
  footer_fixed:
    label: Footer fisso
    help: Mantiene il footer legale fissato in basso nella viewport mentre il contenuto scorre.
  corner_style:
    label: Stile angoli
    help: Le card usano un raggio maggiore; input e pulsanti restano più sobri.
    choice:
      sharp: Netto
      soft: Morbido (predefinito)
      rounded: Arrotondato
  border_strength:
    label: Definizione bordi
    help: Quanto sono definiti i bordi degli elementi in modalità chiara e scura (pannelli, input, chrome).
    choice:
      subtle: Sottile
      medium: Media (predefinito)
      strong: Forte
  color:
    invalid: 'Utilizza un colore esadecimale come #1f6f54.'
user_preferences:
  display_name:
    label: Nome da visualizzare
    placeholder: Il tuo nome
    help: Mostrato nel menu avatar e negli elenchi dei membri.
  email:
    label: E-mail
    placeholder: tu@esempio.com
    help: Utilizzato per accedere.
  slack_user_id:
    placeholder: U012ABCDEF
  phone:
    placeholder: '600 111 222'
  preferred_locale:
    label: Lingua
    placeholder: Auto
    help: Lingua dell'interfaccia utente preferita per questo account.
  preferred_theme:
    label: Tema
    placeholder: Auto
    help: Aspetto preferito diurno o notturno.
  preferred_content_width:
    label: Larghezza del contenuto
    placeholder: Contenuto
    help: Colonna del contenuto centrata o allunga l'area principale a tutta larghezza.
  preferred_ui_density:
    label: Densità dell'interfaccia utente
    placeholder: Comodo
    help: Spaziatura confortevole o disposizione dell'operatore più compatta.
  preferred_font_scale:
    label: Dimensione del testo
    placeholder: Medio
    help: Riduci o ingrandisci il testo dell'interfaccia.
  preferred_contrast:
    label: Contrasto
    placeholder: Sistema
    help: Segui il contrasto del dispositivo oppure forza testo e bordi più marcati.
  preferred_sidebar:
    label: Barra laterale
    placeholder: Espansa
    help: Stato predefinito su desktop se questo browser non ha ancora una preferenza salvata.
  preferred_motion:
    label: Movimento
    placeholder: Sistema
    help: Segui le preferenze del dispositivo, riduci le animazioni o mantieni il movimento completo.
  preferred_collapsed_issue_panels:
    label: I pannelli dei problemi sono compressi per impostazione predefinita
    placeholder: Seleziona pannelli…
    help: I pannelli selezionati iniziano a essere compressi nelle pagine dei dettagli dei
      problemi e degli eventi. Il tuo browser ricorda le operazioni manuali di apertura/chiusura.
  current_password:
    label: Password attuale
    placeholder: Password attuale
    help: Richiesto solo quando si imposta una nuova password.
    help_email_change: Obbligatoria quando cambi l’indirizzo email (login e destinazione reset password).
    help_sensitive_change: Obbligatoria per aggiornare e-mail o Slack user ID.
    help_required: Conferma la tua password attuale per impostarne una nuova.
  plain_password:
    label: Nuova password
    placeholder: Nuova password
    help: Scegli una password robusta che soddisfi i requisiti seguenti.
    mismatch: I campi della password devono corrispondere.
    strength_invalid: La password non soddisfa i requisiti di robustezza (%missing%).
    second:
      label: Conferma la nuova password
    first:
      label: Nuova password
  plain_password_confirm:
    label: Conferma la nuova password
    placeholder: Conferma la nuova password
    help: Reinserisci la nuova password.
ops_defaults:
  allow_anonymous_resolve:
    help: Legacy. Se attivo, Resolve può modificare le issue senza un attore Beacon mappato. Preferisci
      utenti mappati + triage.
    label: Consenti Resolve anonimo Slack/Teams
  allow_private_urls:
    help: Se attivo, i webhook in uscita possono puntare a host privati/link-local. Mantienilo disattivato
      in produzione.
    label: Consenti URL di notifica private
  circuit_breaker_cooldown:
    help: Minuti prima che una destinazione messa in pausa automaticamente possa ritentare. Usa 0 per
      richiedere la ripresa manuale.
    label: Cooldownoldown del circuit breaker in minuti
  circuit_breaker_threshold:
    help: Errori di consegna consecutivi prima che una destinazione di notifica venga messa in pausa automaticamente.
    label: Soglia di errori del circuit breaker
  clear_inbound_webhook_secret:
    help: Rimuovi il secret del webhook in ingresso memorizzato.
    label: Cancella secret del webhook in ingresso
  clear_metrics_token:
    help: Rimuovi il token di scrape memorizzato.
    label: Cancella token di scrape delle metriche
  delivery_history_limit:
    help: Numero di tentativi di consegna recenti conservati per ogni destinazione di notifica.
    label: Limite cronologia consegne
  envelope_max_bytes:
    help: HTTP 413 quando un body di ingest grezzo supera questa dimensione. Predefinito 2097152 (2 MiB).
    label: Dimensione max body Envelope / OTLP (byte)
  event_quota_daily:
    help: Massimo di eventi accettati per progetto ogni giorno. Usa 0 per illimitato.
    label: Quota giornaliera eventi
  event_quota_monthly:
    help: Massimo di eventi accettati per progetto per mese calendario UTC. Usa 0 per illimitato.
    label: Quota mensile eventi
  inbound_email_enabled:
    help: Se attivo, le email di menzione/assegnazione possono includere token Reply-To e POST /hooks/email/inbound
      accetta webhook del provider.
    label: Abilita commenti via email in ingresso
  inbound_mail_domain:
    help: Dominio usato negli indirizzi Reply-To (reply+{token}@dominio).
    label: Dominio mail in ingresso
  inbound_webhook_secret:
    help: Secret condiviso per X-Beacon-Inbound-Secret e firma HMAC Reply-To. Lasciare vuoto conserva
      il secret attuale.
    label: Secret webhook in ingresso
  ingest_rate_limit:
    help: Massimo di richieste Envelope per progetto ogni minuto. Usa 0 per illimitato.
    label: Limite di frequenza ingest al minuto
  ingest_reject_query_auth:
    help: Se attivo, i parametri beacon_key/beacon_secret in query vengono rifiutati (401). Disattiva
      solo durante la migrazione a X-Beacon-Auth o DSN Envelope.
    label: Rifiuta auth ingest via query string (obsoleta)
  metrics_require_token:
    help: Se attivo, /metrics restituisce 503 finché non è memorizzato un token delle metriche. Consigliato
      in produzione.
    label: Richiedi token di scrape delle metriche
  metrics_token:
    help: Token Bearer per gli scraper. Lasciare vuoto conserva il token attuale.
    label: Token di scrape delle metriche
  retention_days:
    help: Elimina la telemetria più vecchia di questo numero di giorni. Usa 0 per disattivare la retention
      per età.
    label: Giorni di retention
  retention_max_events:
    help: Conserva al massimo questo numero di eventi per progetto. Usa 0 per nessun tetto per conteggio.
    label: Massimo di eventi memorizzati per progetto
instance_mailer:
  plain_mailer_dsn:
    label: DSN Mailer
    help: Lascia vuoto per mantenere il valore cifrato corrente. Esempio smtp://user:pass@mail.example:587
      - null:// viene rifiutato (usa invece Cancella DSN memorizzato).
    placeholder: smtp://user:pass@mail.example:587
    invalid: Inserisci un DSN Symfony Mailer valido (ad esempio smtp://user:pass@host:587).
    null_transport: null:// non puo consegnare email. Incolla un DSN SMTP reale (o
      altro), oppure usa Cancella DSN memorizzato per ricadere sull'ambiente.
    scheme_not_allowed: Questo schema DSN Mailer non e consentito. Usa smtp, smtps
      o uno schema provider supportato (Mailgun, Postmark, SES, …).
  clear_mailer_dsn:
    label: Cancella DSN memorizzato
    help: Rimuove il DSN dal database e ricade su MAILER_DSN dall'ambiente finche non ne salvi uno nuovo.
  mailer_from:
    label: Indirizzo From
    help: Envelope From per magic login ed email di notifica. Valore predefinito beacon@localhost se vuoto.
    placeholder: beacon@example.com
instance_mercure:
  mercure_enabled:
    label: Abilita avvisi live Mercure
    help: Quando attivo, i membri autenticati si iscrivono a topic privati del progetto per i toast di
      nuove issue mentre l'app e aperta.
  mercure_url:
    label: URL di publish (server)
    help: Lascia vuoto per usare MERCURE_URL (ad es. http://mercure/.well-known/mercure dentro Compose).
    placeholder: http://mercure/.well-known/mercure
  mercure_public_url:
    label: URL pubblica (browser)
    help: Lascia vuoto per usare MERCURE_PUBLIC_URL (di solito same-origin /.well-known/mercure tramite
      Caddy).
    placeholder: https://localhost:9447/.well-known/mercure
  plain_mercure_jwt_secret:
    label: Segreto JWT
    help: Lascia vuoto per mantenere il valore cifrato corrente o ricadere su MERCURE_JWT_SECRET. Minimo
      32 caratteri se impostato.
    placeholder: ••••••••••••••••••••••••••••••••
    invalid: Inserisci una stringa di segreto JWT valida.
    too_short: Il segreto JWT deve contenere almeno 32 caratteri.
  clear_mercure_jwt_secret:
    label: Cancella il segreto JWT memorizzato
    help: Rimuove il segreto dal database e ricade su MERCURE_JWT_SECRET finche non ne salvi uno nuovo.
