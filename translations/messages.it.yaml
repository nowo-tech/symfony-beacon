  notice:
    title: Note legali
    intro: 'Questo avviso identifica l’operatore di questa istanza %brand%. Sostituisci i segnaposto con i dati reali prima dell’uso pubblico. Punto di partenza per LSSI-CE art. 10 e il GDPR — non un parere legale.'
    publisher_heading: Editore e titolare
    publisher_body: 'L’organizzazione che gestisce questa istanza è il prestatore del servizio della società dell’informazione e il titolare del trattamento di questa installazione. Compila l’identificazione sotto prima di trattare dati di terzi.'
    lssi_heading: Identificazione del servizio
    lssi_body: 'Ai sensi dell’articolo 10 della legge spagnola 34/2002 (LSSI-CE), l’operatore deve pubblicare denominazione, identificativi fiscali o di registro se applicabili, indirizzo postale e un’e-mail o un telefono di contatto.'
    self_host_heading: Installazioni self-hosted
    self_host_body: 'Queste pagine sono modelli modificabili. Chi distribuisce questo software è prestatore e titolare di quella installazione e deve sostituire ogni segnaposto con la propria identificazione. Il testo predefinito non deve nominare una società terza.'
    hosting_heading: Hosting
    hosting_body: 'Questa istanza è ospitata su infrastruttura scelta dall’operatore. Documenta l’host e il luogo di conservazione prima dell’uso pubblico. I responsabili del trattamento agiscono solo su istruzione dell’operatore.'
    ip_heading: Proprietà intellettuale
    ip_body: 'Marchio, mascotte e interfaccia di questa istanza appartengono all’operatore o ai suoi licenzianti. Il codice sorgente è offerto con licenza MIT nel repository; tale licenza non cede il marchio dell’operatore.'
    liability_heading: Responsabilità
    liability_body: 'L’operatore mantiene il servizio con la diligenza richiesta dallo stato dell’arte. Il testo predefinito non limita una responsabilità che il diritto dei consumatori spagnolo o dell’UE non consente di escludere. Fai esaminare questa clausola prima della produzione.'
    law_heading: Legge applicabile
    law_body: 'Sostituisci questa clausola con la legge applicabile e il foro indicati per l’operatore. Fino ad allora è un segnaposto. I consumatori possono agire davanti al giudice del proprio domicilio ove la legge lo preveda.'
  privacy:
    title: Informativa privacy
    intro: 'Questa informativa spiega come i dati personali possono essere trattati su questa istanza %brand% offerta a persone nell’UE/SEE, Spagna inclusa (GDPR e LOPDGDD). L’operatore deve sostituire i segnaposto con i propri dati di titolare prima della produzione.'
    controller_heading: Titolare del trattamento
    controller_body: 'L’operatore di questa istanza è il titolare del trattamento. Questo modello non include un responsabile della protezione dei dati; le richieste vanno al contatto dell’avviso legale.'
    controller_self_host: Chi ospita in proprio questo software è il titolare di quella installazione. Le applicazioni clienti che inviano telemetria restano titolari dei dati degli utenti finali contenuti in quegli eventi; Beacon conserva la telemetria per il titolare del progetto.
    data_heading: Dati trattati
    data_body: 'Su questa istanza l’operatore può trattare:'
    data_account: Dati di account — e-mail, nome visualizzato, hash della password, ruoli, lingua preferita e telefono se lo aggiungi.
    data_telemetry: Telemetria di progetto che tu o la tua applicazione inviate tramite un DSN (errori e prestazioni, che possono includere indirizzi IP, URL e identificatori inseriti dalla tua applicazione).
    data_security: Dati di sicurezza — tentativi di accesso, osservazioni del dispositivo (cookie di_obs) e browser attendibili. L’identificativo del dispositivo non è una password.
    data_logs: Log operativi, inclusi audit HTTP e log del consenso ai cookie.
    data_cookies: Cookie e memorie simili descritte nella pagina Cookie.
    purpose_heading: Finalità
    purpose_body: Trattiamo questi dati per creare e proteggere gli account, fornire il monitoraggio di errori e prestazioni dei progetti che configuri, inviare le notifiche che imposti, mantenere il servizio e registrare le scelte sui cookie.
    basis_heading: Basi giuridiche
    basis_contract: Contratto (GDPR art. 6, par. 1, lett. b) — account, autenticazione e servizio di monitoraggio richiesto.
    basis_legitimate: Legittimo interesse (art. 6, par. 1, lett. f) — sicurezza, prevenzione degli abusi, intelligence del dispositivo e log diagnostici. Puoi opporti quando la legge lo prevede.
    basis_consent: Consenso (art. 6, par. 1, lett. a ed ePrivacy) — categorie facoltative di cookie (preferenze, analitica). Revoca in qualsiasi momento da Impostazioni cookie. I cookie necessari non si basano sul consenso.
    basis_legal: Obbligo di legge (art. 6, par. 1, lett. c) — rispondere alle autorità competenti quando la legge lo richiede.
    recipients_heading: Destinatari
    recipients_body: 'I dati sono conservati sull’infrastruttura scelta dall’operatore e sul mailer configurato. L’installazione predefinita non vende dati personali. Gli amministratori di progetto possono aggiungere destinazioni di notifica; queste ricevono solo il contenuto di avviso configurato. I responsabili agiscono su istruzioni scritte.'
    transfers_heading: Trasferimenti internazionali
    transfers_body: 'L’operatore deve documentare se il trattamento resta nell’UE/SEE. Questo modello presume hosting nello SEE fino alla sostituzione. Se un amministratore configura un webhook o una casella fuori dallo SEE, provoca il trasferimento e deve avere un meccanismo del capo V del GDPR.'
    retention_heading: Conservazione
    retention_account: Gli account restano finché esistono e sono cancellati o anonimizzati quando elimini l’account o un amministratore rimuove l’utente.
    retention_telemetry: La telemetria è conservata per il periodo configurato su ciascun progetto. Senza periodo, gli eventi restano finché un amministratore li cancella o cancella il progetto.
    retention_cookies: Il cookie di sessione dura fino a 1 giorno; Ricordami fino a 30 giorni; i cookie di consenso circa 1 anno; di_obs 1 ora.
    retention_logs: I log HTTP e di consenso seguono la pulizia impostata in Amministrazione. I log di sicurezza sono tenuti solo per il tempo necessario a indagare abusi.
    rights_heading: I tuoi diritti
    rights_body: 'Puoi chiedere accesso, rettifica, cancellazione, limitazione, portabilità e opposizione, e revocare il consenso per i cookie facoltativi. Contatta l’operatore tramite l’avviso legale. Risposta entro un mese, prorogabile di due mesi se la richiesta è complessa; l’identità può essere verificata.'
    authority_heading: Autorità di controllo
    authority_body: Puoi proporre reclamo all’Agencia Española de Protección de Datos (AEPD), C/ Jorge Juan 6, 28001 Madrid, Spagna, https://www.aepd.es, o all’autorità del tuo Paese di residenza nell’UE/SEE.
    automated_heading: Decisioni automatizzate
    automated_body: Non adottiamo decisioni basate unicamente sul trattamento automatizzato che producano effetti giuridici o analoghi (GDPR art. 22). L’intelligence del dispositivo serve alla sicurezza dell’account; non concede né nega un contratto da sola e non è una credenziale.
    cookies_heading: Cookie
    cookies_body: I cookie strettamente necessari consentono l’accesso, la sicurezza e la registrazione del consenso. Le categorie facoltative si attivano solo se le consenti.
  terms:
    title: Condizioni d’uso
    intro: 'Queste condizioni sono un modello per l’uso di questa istanza %brand%. Sostituiscile prima della produzione con condizioni adatte all’offerta dell’operatore. Se usi solo il codice con licenza MIT sui tuoi server, le condizioni di quella installazione sono le tue.'
    service_heading: Servizio
    service_body: Il servizio è il monitoraggio di errori e prestazioni per progetti creati da utenti autorizzati, inclusa l’ingestione, il flusso delle issue, le notifiche e l’amministrazione.
    accounts_heading: Account
    accounts_body: Devi fornire dati di account esatti, mantenere riservate le credenziali e usare il servizio solo per progetti e dati personali che sei autorizzato a trattare. Rispondi dell’attività svolta con il tuo account.
    accept_heading: Uso accettabile
    accept_body: Non abusare dell’API di ingestione, non cercare accessi non autorizzati, non caricare contenuti illeciti e non usare il servizio per danneggiare altri. Possiamo sospendere l’accesso che viola queste condizioni o la legge.
    ip_heading: Proprietà intellettuale
    ip_body: 'Il codice sorgente è concesso in licenza MIT come indicato nel repository. Queste condizioni non cedono il marchio Beacon né i segni dell’operatore. Conservi i diritti sulla telemetria inviata; concedi all’operatore la licenza necessaria per memorizzarla e mostrarla al fine di prestare il servizio.'
    limitation_heading: Limitazione di responsabilità
    limitation_body: 'Nella misura consentita dal diritto applicabile, l’operatore non risponde di danni indiretti o consequenziali derivanti dall’uso del servizio. Resta impregiudicata la responsabilità che non può essere esclusa per legge. Fai esaminare questa clausola prima della produzione.'
    law_heading: Legge e foro
    law_body: 'Sostituisci questa clausola con la legge applicabile e il foro indicati per l’operatore. I consumatori possono agire davanti al giudice del proprio domicilio ove la legge lo preveda.'
    changes_heading: Modifiche
    changes_body: Possiamo aggiornare queste condizioni pubblicando il nuovo testo in questa pagina con una nuova data. Se una modifica riduce i tuoi diritti, avviseremo anche gli amministratori connessi prima dell’efficacia quando la legge richiede un preavviso. L’uso continuato dopo la data di efficacia è accettazione quando la legge ammette tale forma.
  cookies:
    title: Informativa cookie
    intro: Questa pagina elenca i cookie e le tecniche simili di questa istanza %brand%. I cookie strettamente necessari consentono autenticazione, sicurezza e registrazione del consenso. Le categorie facoltative si usano solo con il tuo consenso previo. Usa Impostazioni cookie per rivedere o cambiare la scelta in qualsiasi momento.
    categories_heading: Categorie
    cat_required: Strettamente necessari
    cat_required_help: Essenziali per autenticazione, sicurezza e registrazione della tua decisione. Non si possono disattivare dal banner.
    cat_preferences: Preferenze
    cat_preferences_help: Cookie facoltativi che memorizzano scelte di presentazione non essenziali, solo se accetti questa categoria.
    cat_analytics: Analitica
    cat_analytics_help: 'Cookie di misurazione facoltativi, solo se questa istanza attiva strumenti di analisi e accetti la categoria. La build predefinita non imposta un cookie di analisi di terzi.'
    inventory_heading: Inventario cookie
    col_name: Nome
    col_category: Categoria
    col_duration: Durata
    col_purpose: Finalità
    duration_session: Fino a 1 giorno
    duration_remember: Fino a 30 giorni
    duration_consent: Circa 1 anno
    duration_device: 1 ora
    purpose_session: Mantiene la sessione HTTP autenticata necessaria alle aree protette.
    purpose_remember: Consente l’autenticazione persistente quando si seleziona Ricordami all’accesso.
    purpose_csrf: Cookie CSRF a doppio invio, di breve durata, impostato da Symfony all’invio di moduli protetti (schema csrf-token_*; prefisso __Host- su HTTPS).
    purpose_consent: Cookie_Consent e Cookie_Consent_Key registrano che è stata presa una decisione di consenso e collegano una chiave anonima al registro di consenso del server.
    purpose_category: Cookie_Category_analytics e Cookie_Category_preferences memorizzano se ogni categoria facoltativa è stata accettata o rifiutata (meccanismo di consenso, non tracker).
    purpose_device: Puntatore HttpOnly (di_obs) per riconoscere un browser di ritorno, per la sicurezza dell’account. Non è una credenziale di accesso né un identificatore pubblicitario.
    storage_heading: Archiviazione locale
    storage_body: Il tema (chiaro/scuro) e alcune scelte di layout possono essere salvati nel localStorage del browser. Non sono cookie HTTP. Sono strettamente necessari per mantenere l’interfaccia scelta su questo dispositivo.
