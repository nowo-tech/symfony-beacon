    deleted: Destinazione eliminata.
    test_queued: Notifica di esempio nativa del canale accodata per la consegna.
    circuit_resumed: Destination circuit resumed; deliveries may proceed again.
  help:
    title: Guide di configurazione notifiche
    link: Guide di configurazione
    back: Torna alle impostazioni
    toc: Vai al canale
    intro: Istruzioni passo passo per collegare Slack, Discord, Microsoft Teams, Telegram, email oppure
      un webhook HTTP generico a questo progetto.
    payload_label: 'Beacon invia:'
    docs_hint: 'Riferimento completo (payload, consegna, permessi): docs/product/NOTIFICATIONS.md nel
      repository.'
    slack:
      title: Slack (Incoming Webhook)
      lead: Crea un Incoming Webhook per un'app Slack e incolla l'URL HTTPS in Beacon.
      step1: Apri api.slack.com/apps e crea un'app From scratch per il tuo workspace.
      step2: Abilita Incoming Webhooks, poi Add New Webhook to Workspace e scegli un canale.
      step3: Copia l'URL del webhook (https://hooks.slack.com/services/...).
      step4: In Beacon scegli Slack Incoming Webhook, incolla l'URL come endpoint, seleziona le categorie
        e salva.
      step5: Fai clic su Invia test e conferma che il messaggio compaia in Slack.
      payload: JSON con text (riepilogo) e un oggetto beacon che contiene il payload completo dell'evento.
      tip: Preferisci un canale ops dedicato. Ruota il webhook in Slack se dovesse trapelare e aggiorna
        la destinazione in Beacon.
    discord:
      title: Discord (webhook)
      lead: Crea un webhook di canale in Discord e incolla il suo URL in Beacon.
      step1: Apri Impostazioni server -> Integrazioni -> Webhook (oppure la scheda Integrazioni del canale).
      step2: Crea un nuovo webhook, assegnagli un nome (ad esempio Beacon) e scegli il canale di destinazione.
      step3: Copia l'URL del webhook (https://discord.com/api/webhooks/...).
      step4: In Beacon scegli Webhook Discord, incolla l'URL, seleziona le categorie, salva e poi Invia
        test.
      payload: JSON con content (riepilogo) e un array embeds (title, description, URL issue opzionale).
      tip: Discord applica rate limit ai webhook; Beacon consegna in modo asincrono tramite Messenger.
    teams:
      title: Microsoft Teams (Incoming Webhook)
      lead: Aggiungi un connettore Incoming Webhook a un canale Teams e incolla l'URL in Beacon.
      step1: Nel menu del canale Teams apri Connectors (o Gestisci canale -> Connectors).
      step2: Configura Incoming Webhook, assegnagli un nome e crealo.
      step3: Copia l'URL del webhook fornito da Teams.
      step4: In Beacon scegli Webhook Microsoft Teams, incolla l'URL, seleziona le categorie, salva e
        poi Invia test.
      payload: JSON Office 365 MessageCard con summary, title, text e un'azione Open in Beacon quando
        esiste un URL.
      tip: Se il tuo tenant consente solo Workflows invece dei classici Incoming Webhooks, punta una destinazione
        HTTP generica a un workflow che accetta POST JSON.
    telegram:
      title: Telegram (bot)
      lead: Crea un bot con BotFather e memorizza bot_token@chat_id come endpoint Beacon.
      step1: Apri @BotFather in Telegram, esegui /newbot e copia il token del bot.
      step2: Avvia una chat privata con il bot oppure aggiungilo a un gruppo e invia un messaggio.
      step3: Chiama getUpdates sulla Bot API e leggi message.chat.id (gli id dei gruppi sono spesso negativi).
      step4: In Beacon scegli Bot Telegram e imposta l'endpoint su bot_token@chat_id (esempio - 123:AA...@-1001234567890).
      step5: Salva e Invia test.
      payload: sendMessage della Bot API con chat_id e text (solo riepilogo; non il payload JSON completo).
      tip: L'ultimo @ nell'endpoint separa token e chat id. I token sono cifrati a riposo come gli altri
        endpoint.
    email:
      title: Email
      lead: Recapita gli avvisi a una casella email tramite Symfony Mailer. Configura prima il DSN Mailer
        in Amministrazione -> Mailer.
      step1: Apri Amministrazione -> Mailer e salva un DSN cifrato (smtp://...). MAILER_DSN nell'ambiente
        e solo un fallback di bootstrap; null://null non recapita nulla.
      step2: In Beacon scegli Email e imposta l'endpoint sull'indirizzo del destinatario.
      step3: Seleziona le categorie, salva, Invia test e controlla posta in arrivo/spam.
      payload: L'oggetto dell'email coincide con il riepilogo; il corpo contiene il riepilogo piu l'URL
        della issue o della performance quando presente.
      tip: Usa un alias ops condiviso. Per digest piu ricchi, preferisci Slack/Discord/Teams o un bridge
        HTTP.
    http:
      title: Webhook HTTP generico
      lead: Invia tramite POST il payload JSON canonico di Beacon a qualsiasi endpoint HTTPS di automazione.
      step1: Esponi un URL HTTPS che accetti POST con Content-Type application/json.
      step2: In Beacon scegli Webhook HTTP generico, incolla l'URL, seleziona le categorie, salva e poi
        Invia test.
      step3: Conferma che il tuo servizio riceva il body JSON canonico (event, summary, project, issue,
        url, category).
      payload: Payload JSON canonico come body della richiesta (User-Agent symfony-beacon-notifications/1.0).
      tip: Preferisci HTTPS e autentica il destinatario. Evita di puntare a indirizzi interni o di metadati
        cloud.
  project_layer_help: Queste destinazioni appartengono al progetto (canali del team), indipendenti dalle
    preferenze personali di avviso sopra. La consegna in uscita usa le categorie della destinazione; toast/push
    membro usano la matrice di preferenze del membro.
  teams:
    token_used: Questo link di azione Teams è già stato usato. Apri l’issue in Beacon se devi ancora modificarla.
