# FormKit field catalogue (label / placeholder / help). Domain: form
admin_user:
  email:
    label: Email
    placeholder: nombre@ejemplo.com
    help: Email de acceso de esta cuenta.
  display_name:
    label: Nombre visible
    placeholder: Ana Pérez
    help: Se muestra en el directorio de admin y en la actividad.
  password:
    label: Contraseña
    placeholder: Al menos 8 caracteres
    help: Al menos 8 caracteres.
  role:
    label: Rol
    placeholder: Selecciona un rol
    help: Rol de instancia (usuario o admin).
  enabled:
    label: Cuenta activa (puede iniciar sesión)
    placeholder: ''
    help: Si está desactivada, el usuario no puede iniciar sesión.
admin_instance_role:
  name:
    label: Nombre
    placeholder: Soporte
    help: Respaldo en base de datos del nombre visible. La UI prefiere roles.catalog.<slug>.name si esa
      clave está traducida (slug = código en minúsculas).
  code:
    label: Código
    placeholder: ROLE_SUPPORT
    help: Código estilo Symfony (p. ej. ROLE_SUPPORT). Id de máquina — no se traduce.
  description:
    label: Cuándo usarlo
    placeholder: Guía breve opcional…
    help: Guía breve sobre cuándo asignar este rol. Prefiere roles.catalog.<slug>.description; este campo
      es el respaldo en BD.
  enabled:
    label: Activo
    help: Si está desactivado, este rol no se puede asignar de nuevo.
project:
  nav:
    label: Secciones del proyecto
  governance:
    help: Retención, límites de tasa y cuotas diarias por proyecto. Deja un campo vacío para heredar el
      valor del servidor.
    inherit_hint: Vacío = heredar valor del servidor (%default%). Usa 0 para desactivar si el valor por
      defecto no es cero.
    retention_days:
      label: Días de retención
    retention_max_events:
      label: Máximo de eventos almacenados
    ingest_rate_limit:
      label: Límite de ingest (por minuto)
    event_quota_daily:
      label: Cuota diaria de eventos
    event_quota_monthly:
      label: Cuota mensual de eventos
  name:
    label: Nombre
    placeholder: p. ej. Billing API
    help: Se muestra en el panel y sirve para derivar el slug del proyecto.
    required: El nombre del proyecto es obligatorio.
  description:
    label: Descripción
    placeholder: Resumen opcional
    help: Ayuda a tu equipo a reconocer este proyecto.
  api_keys:
    help: Usa un DSN en BEACON_DSN para que tu app envíe errores a este proyecto.
  config:
    help: 'JSON portable de este proyecto (código: %code%). Incluye membresías por email; nunca incluye
      secretos de API.'
  members:
    help: Miembros directos de este proyecto. Propietarios y administradores gestionan la membresía. El
      acceso también puede venir de grupos vinculados.
    email_label: Email del miembro
    email_placeholder: usuario@ejemplo.com
    role:
      admin: Administrador
      full: Full
      member: Miembro
      owner: Propietario
      viewer: Solo lectura
    role_label: Rol
  groups:
    help: Vincula un grupo para que todos sus miembros reciban el rol elegido en este proyecto. Los propietarios
      se añaden como usuarios individuales.
    select: Selecciona un grupo…
  danger:
    transfer_member_placeholder: Selecciona un miembro…
site_appearance:
  brand_name:
    label: Nombre de marca
    placeholder: symfony-beacon
    help: Se muestra en la cabecera y en la página de acceso.
  brand_eyebrow:
    label: Etiqueta de marca
    placeholder: Seguimiento de errores
    help: Texto corto encima de la marca en la pantalla de acceso.
  accent_color:
    label: Acento
    placeholder: '#1f6f54'
    help: Acento principal (botones, enlaces) en modo día.
  accent_deep_color:
    label: Acento (hover)
    placeholder: '#134736'
    help: Acento más oscuro para hover en modo día.
  accent_color_dark:
    label: Acento (noche)
    placeholder: '#4aad7f'
    help: Acento principal en modo noche.
  accent_deep_color_dark:
    label: Acento hover (noche)
    placeholder: '#6bc49a'
    help: Acento más claro para hover en modo noche.
  danger_color:
    label: Peligro
    placeholder: '#b42318'
    help: Acento de error / destructivo en modo día.
  danger_color_dark:
    label: Peligro (noche)
    placeholder: '#f97066'
    help: Acento de error / destructivo en modo noche.
  warn_color:
    label: Aviso
    placeholder: '#b54708'
    help: Acento de aviso / precaución en modo día.
  warn_color_dark:
    label: Aviso (noche)
    placeholder: '#fdb022'
    help: Acento de aviso / precaución en modo noche.
  paper_color:
    label: Papel
    placeholder: '#f3f6f4'
    help: Fondo de página en modo día.
  paper_color_dark:
    label: Papel (noche)
    placeholder: '#0c1210'
    help: Fondo de página en modo noche.
  ink_color:
    label: Tinta
    placeholder: '#0f1c18'
    help: Color de texto principal en modo día.
  ink_color_dark:
    label: Tinta (noche)
    placeholder: '#e6eee9'
    help: Color de texto principal en modo noche.
  surface_color:
    label: Superficie
    placeholder: '#ffffff'
    help: Paneles y tarjetas en modo día.
  surface_color_dark:
    label: Superficie (noche)
    placeholder: '#151c19'
    help: Paneles y tarjetas en modo noche.
  footer_fixed:
    label: Footer fijo
    help: Mantiene el pie legal fijado al borde inferior del viewport mientras el contenido hace scroll.
  corner_style:
    label: Estilo de esquinas
    help: Las tarjetas usan un radio mayor; inputs y botones quedan más sutiles.
    choice:
      sharp: Afilado
      soft: Suave (por defecto)
      rounded: Redondeado
  border_strength:
    label: Definición de bordes
    help: Qué tan definidos se ven los bordes en modo claro y oscuro (paneles, inputs, chrome).
    choice:
      subtle: Sutil
      medium: Media (por defecto)
      strong: Fuerte
  color:
    invalid: 'Usa un color hexadecimal como #1f6f54.'
user_preferences:
  display_name:
    label: Nombre visible
    placeholder: Tu nombre
    help: Se muestra en el menú del avatar y en las listas de miembros.
  email:
    label: Correo
    placeholder: tu@ejemplo.com
    help: Se usa para iniciar sesión.
  slack_user_id:
    placeholder: U012ABCDEF
  phone:
    placeholder: '+34600111222'
  preferred_locale:
    label: Idioma
    placeholder: Automático
    help: Idioma preferido de la interfaz para esta cuenta.
  preferred_theme:
    label: Tema
    placeholder: Automático
    help: Apariencia preferida día o noche.
  preferred_content_width:
    label: Ancho del contenido
    placeholder: Contenido
    help: Columna centrada, o estirar el área principal a todo el ancho.
  preferred_ui_density:
    label: Densidad de la interfaz
    placeholder: Cómoda
    help: Espaciado cómodo, o un layout de operador más compacto.
  preferred_font_scale:
    label: Tamaño del texto
    placeholder: Mediano
    help: Escala el texto de la interfaz más pequeño o más grande.
  preferred_contrast:
    label: Contraste
    placeholder: Sistema
    help: Seguir el contraste del dispositivo, o forzar texto y bordes más marcados.
  preferred_sidebar:
    label: Barra lateral
    placeholder: Expandida
    help: Estado inicial en escritorio cuando este navegador aún no tiene preferencia guardada.
  preferred_motion:
    label: Movimiento
    placeholder: Sistema
    help: Seguir el dispositivo, reducir animaciones, o mantener el movimiento completo.
  preferred_collapsed_issue_panels:
    label: Paneles de incidencia colapsados por defecto
    placeholder: Seleccionar paneles…
    help: Los paneles marcados empiezan colapsados en el detalle de incidencia/evento. El navegador
      recuerda si los abres o cierras a mano.
  current_password:
    label: Contraseña actual
    placeholder: Contraseña actual
    help: Solo necesaria al establecer una nueva contraseña.
    help_email_change: Obligatoria al cambiar tu dirección de correo (inicio de sesión y destino del restablecimiento).
    help_sensitive_change: Obligatoria para actualizar tu correo o Slack user ID.
    help_required: Confirma tu contraseña actual para establecer una nueva.
  plain_password:
    label: Nueva contraseña
    placeholder: Nueva contraseña
    help: Elige una contraseña segura que cumpla los requisitos siguientes.
    mismatch: Las contraseñas no coinciden.
    strength_invalid: La contraseña no cumple los requisitos de fortaleza (%missing%).
    second:
      label: Confirmar nueva contraseña
    first:
      label: Nueva contraseña
  plain_password_confirm:
    label: Confirmar nueva contraseña
    placeholder: Confirmar nueva contraseña
    help: Vuelve a introducir la nueva contraseña.
ops_defaults:
  allow_anonymous_resolve:
    help: Legado. Si está activo, Resolve puede mutar incidencias sin un actor Beacon mapeado. Prefiere
      usuarios mapeados + triage.
    label: Permitir Resolve anónimo de Slack/Teams
  allow_private_urls:
    help: Si está activo, los webhooks de salida pueden apuntar a hosts privados/link-local. Manténlo
      desactivado en producción.
    label: Permitir URL privadas de notificación
  circuit_breaker_cooldown:
    help: Minutos antes de que un destino pausado automáticamente pueda reintentar. Usa 0 para exigir
      reanudación manual.
    label: Enfriamiento del circuit breaker (minutos)
  circuit_breaker_threshold:
    help: Fallos de entrega consecutivos antes de pausar automáticamente un destino de notificación.
    label: Umbral de fallos del circuit breaker
  clear_inbound_webhook_secret:
    help: Elimina el secreto de webhook de entrada almacenado.
    label: Borrar secreto de webhook de entrada
  clear_metrics_token:
    help: Elimina el token de scrape almacenado.
    label: Borrar token de scrape de métricas
  delivery_history_limit:
    help: Número de intentos de entrega recientes retenidos por cada destino de notificación.
    label: Límite del historial de entregas
  envelope_max_bytes:
    help: HTTP 413 cuando el cuerpo de ingest en bruto supera este tamaño. Predeterminado 2097152 (2 MiB).
    label: Tamaño máximo del cuerpo Envelope / OTLP (bytes)
  event_quota_daily:
    help: Máximo de eventos aceptados por proyecto cada día. Usa 0 para ilimitado.
    label: Cuota diaria de eventos
  event_quota_monthly:
    help: Máximo de eventos aceptados por proyecto por mes calendario UTC. Usa 0 para ilimitado.
    label: Cuota mensual de eventos
  inbound_email_enabled:
    help: Si está activo, el correo de mención/asignación puede incluir tokens Reply-To y POST /hooks/email/inbound
      acepta webhooks del proveedor.
    label: Activar comentarios por correo entrante
  inbound_mail_domain:
    help: Dominio usado en las direcciones Reply-To (reply+{token}@dominio).
    label: Dominio de correo entrante
  inbound_webhook_secret:
    help: Secreto compartido para X-Beacon-Inbound-Secret y firma HMAC de Reply-To. En blanco al guardar
      se conserva el actual.
    label: Secreto de webhook de entrada
  ingest_rate_limit:
    help: Máximo de peticiones Envelope por proyecto cada minuto. Usa 0 para ilimitado.
    label: Límite de ritmo de ingest por minuto
  ingest_reject_query_auth:
    help: Si está activo, se rechazan los parámetros beacon_key/beacon_secret en la query (401). Desactívalo
      solo al migrar clientes a X-Beacon-Auth o DSN Envelope.
    label: Rechazar autenticación de ingest por query string (obsoleta)
  metrics_require_token:
    help: Si está activo, /metrics responde 503 hasta que haya un token de métricas almacenado. Recomendado
      en producción.
    label: Exigir token de scrape de métricas
  metrics_token:
    help: Token Bearer para scrapers. En blanco al guardar se conserva el actual.
    label: Token de scrape de métricas
  retention_days:
    help: Elimina telemetría más antigua que este número de días. Usa 0 para desactivar la retención por
      antigüedad.
    label: Días de retención
  retention_max_events:
    help: Conserva como máximo este número de eventos por proyecto. Usa 0 para sin tope por recuento.
    label: Máximo de eventos almacenados por proyecto
instance_mailer:
  plain_mailer_dsn:
    label: DSN de Mailer
    help: Déjalo vacío para conservar el valor cifrado actual. Ejemplo smtp://user:pass@mail.example:587
      — null:// se rechaza (usa Borrar DSN guardado).
    placeholder: smtp://user:pass@mail.example:587
    invalid: Introduce un DSN de Symfony Mailer válido (por ejemplo smtp://user:pass@host:587).
    null_transport: null:// no puede entregar correo. Pega un DSN SMTP (u otro) real,
      o usa Borrar DSN guardado para volver al entorno.
    scheme_not_allowed: Ese esquema de DSN de Mailer no está permitido. Usa smtp,
      smtps o un proveedor soportado (Mailgun, Postmark, SES, …).
  clear_mailer_dsn:
    label: Borrar DSN guardado
    help: Elimina el DSN de la base de datos y vuelve a MAILER_DSN del entorno hasta que guardes uno nuevo.
  mailer_from:
    label: Dirección From
    help: Remitente para magic login y notificaciones por email. Por defecto beacon@localhost si está
      vacío.
    placeholder: beacon@example.com
instance_mercure:
  mercure_enabled:
    label: Activar alertas Mercure en vivo
    help: Si está activo, los miembros conectados se suscriben a topics privados del proyecto para toasts
      de incidencias nuevas mientras la app está abierta.
  mercure_url:
    label: URL de publicación (servidor)
    help: Déjalo vacío para usar MERCURE_URL (p. ej. http://mercure/.well-known/mercure dentro de Compose).
    placeholder: http://mercure/.well-known/mercure
  mercure_public_url:
    label: URL pública (navegador)
    help: Déjalo vacío para usar MERCURE_PUBLIC_URL (normalmente same-origin /.well-known/mercure vía
      Caddy).
    placeholder: https://localhost:9447/.well-known/mercure
  plain_mercure_jwt_secret:
    label: Secreto JWT
    help: Déjalo vacío para conservar el valor cifrado actual o usar MERCURE_JWT_SECRET. Mínimo 32 caracteres
      al establecerlo.
    placeholder: ••••••••••••••••••••••••••••••••
    invalid: Introduce una cadena de secreto JWT válida.
    too_short: El secreto JWT debe tener al menos 32 caracteres.
  clear_mercure_jwt_secret:
    label: Borrar secreto JWT guardado
    help: Elimina el secreto de la base de datos y vuelve a MERCURE_JWT_SECRET hasta que guardes uno nuevo.
social_login_credential:
  authorize_url:
    help: Opcional para proveedores integrados; obligatorio para IdP personalizados.
    label: URL de autorización
  client_id:
    label: Client ID
  client_secret:
    label: Client secret
    help_new: Secreto OAuth de la app registrada en el IdP.
    help_edit: Déjalo en blanco para conservar el secreto actual.
  enabled:
