    label: Activado
  enterprise_sso:
    help: Mostrar bajo «Iniciar sesión con tu organización» en lugar de los botones sociales de consumidor
      (IdP OIDC).
    label: SSO empresarial
  label:
    help: Texto del botón Continuar con en la página de login.
    label: Etiqueta del botón
  provider:
