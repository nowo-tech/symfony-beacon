    inventory_heading: Cookie-inventaris
    col_name: Naam
    col_category: Categorie
    col_duration: Duur
    col_purpose: Doel
    duration_session: Sessie
    duration_remember: Tot 7 dagen
    duration_consent: Ongeveer 1 jaar
    purpose_session: Handhaaft de geauthenticeerde HTTP-sessie die nodig is om beveiligde
      delen van de dienst te gebruiken.
    purpose_remember: Maakt persistente authenticatie mogelijk wanneer bij het inloggen
      “Onthoud mij” wordt geselecteerd (veilig token; beperkte geldigheid).
    purpose_csrf: Kortdurende double-submit CSRF-cookie die Symfony zet bij het verzenden
      van beveiligde formulieren (patroon csrf-token_<token>; __Host- prefix op HTTPS).
    purpose_consent: Cookie_Consent en Cookie_Consent_Key registreren dat een toestemmingskeuze
      is gemaakt en koppelen een anonieme sleutel aan het server-side auditlogboek.
    purpose_category: Cookie_Category_analytics en Cookie_Category_preferences slaan
