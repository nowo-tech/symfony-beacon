mercure_settings:
  title: Mercure
  intro: Optionele livemeldingen voor aangemelde leden wanneer een nieuwe issue wordt
    aangemaakt. Standaard uitgeschakeld - alleen inschakelen wanneer een Mercure-hub
    beschikbaar is. Web Push blijft een aparte opt-in onder Account -> Weergave.
  manual_hint: 'Operatorhandleiding (hub, JWT-secret, Compose, probleemoplossing):
    docs/ops/MERCURE.md in de repository.'
  status:
    active: Live Mercure-meldingen zijn ingeschakeld voor leden.
    inactive: Mercure staat uit
    inactive_help: Leden openen geen EventSource totdat je Mercure hier inschakelt
      en een bereikbare hub-URL + JWT-secret opgeeft (hieronder opgeslagen of via
      de omgeving).
    url_database: De hub publish-URL is opgeslagen in de instantie-instellingen.
    url_env: De hub publish-URL valt terug op MERCURE_URL uit de omgeving.
    url_missing: Geen hub publish-URL geconfigureerd (stel hieronder in of gebruik
      MERCURE_URL).
    secret_database: Het JWT-secret is versleuteld opgeslagen in de instantie-instellingen.
    secret_env: Het JWT-secret valt terug op MERCURE_JWT_SECRET uit de omgeving.
    secret_missing: Geen JWT-secret geconfigureerd (stel hieronder in of gebruik MERCURE_JWT_SECRET).
  public_url_preview: 'Browser-hub-URL: %url%'
  push_note: PWA-push op de achtergrond wordt per gebruiker ingesteld onder Account
    -> Weergave (vereist VAPID_*-sleutels). Het hangt niet af van Mercure.
  submit: Mercure-instellingen opslaan
  guide:
    title: Mercure stap voor stap configureren
    intro: Live-toasts voor nieuwe issues gebruiken een Mercure-hub (Server-Sent Events). Mercure is optioneel en onafhankelijk van Web Push (Account → Weergave).
    open: Hoe te configureren
    close: Sluiten
    docs_hint: 'Volledige referentie met topics, privacy en productie — docs/ops/MERCURE.md.'
    env:
      step1_example: |
        MERCURE_URL=http://mercure/.well-known/mercure
        MERCURE_PUBLIC_URL=${DEFAULT_URI}/.well-known/mercure
        MERCURE_JWT_SECRET="!ChangeThisMercureHubJWTSecretKey!"
      step2_example: openssl rand -base64 48
      title: 2. Omgevingsvariabelen
      lead: Configureer de hub liever in .env en laat de formuliervelden leeg zodat Beheer alleen de functie aan/uit zet.
      step1: Kopieer of bevestig deze variabelen in .env (uit .env.dist).
      step2: Vervang de placeholder-JWT-geheim door een sterke waarde (minimaal 32 tekens).
      step2_note: Dezelfde string moet door PHP (MERCURE_JWT_SECRET) en de hub worden gebruikt (compose.yaml mapt die naar MERCURE_PUBLISHER_JWT_KEY en MERCURE_SUBSCRIBER_JWT_KEY).
      step3: Weten wat elke variabele doet.
      table_var: Variabele
      table_meaning: Betekenis
      row_url: Interne publish-URL vanuit PHP (Compose-voorbeeld links).
      row_public: 'Browser-EventSource-URL. Gebruik bij voorkeur ${DEFAULT_URI}/.well-known/mercure zodat de browser same-origin via Caddy blijft.'
      row_jwt: Gedeeld HMAC-geheim voor publisher- en subscriber-JWTs.
    external:
      example: |
        MERCURE_URL=https://mercure.example.com/.well-known/mercure
        MERCURE_PUBLIC_URL=https://mercure.example.com/.well-known/mercure
        MERCURE_JWT_SECRET="your-shared-secret-at-least-32-chars"
      title: 6. Externe hub (optioneel)
      lead: Je kunt Beacon naar elke Mercure-compatibele hub laten wijzen in plaats van de Compose-service.
      step1: Zet MERCURE_URL (of Publish URL) op een endpoint dat de PHP-container kan bereiken.
      step2: Zet MERCURE_PUBLIC_URL (of Public URL) op een HTTPS-URL die browsers kunnen openen.
      step3: Gebruik hetzelfde JWT-geheim op de hub publisher/subscriber-sleutels en in Beacon.
      step4: 'Als de hub cross-origin is, configureer hub-CORS (cors_origins) voor je Beacon-origin.'
    start:
      step1_example: |
        docker compose up -d mercure php
        # or a full stack:
        make up
      step2_example: 'docker compose exec mercure curl -fsS http://127.0.0.1/healthz'
      step3_example: |
        handle /.well-known/mercure* {
            reverse_proxy mercure:80
        }
      title: 3. Hub starten
      step1: Start of herschep Mercure met de app-stack.
      step2: Bevestig het health-endpoint van de hub (binnen het Compose-netwerk).
      step3: Bevestig dat Caddy de hub proxyt (al in .docker/frankenphp/Caddyfile).
    troubleshoot:
      recreate: |
        # After changing hub env vars
        docker compose up -d --force-recreate mercure
      title: 7. Probleemoplossing
      inactive: 'Status inactief — schakelaar uit, of URL/geheim ontbreekt (DB en env leeg).'
      unauthorized: EventSource 401 — subscriber-JWT-geheim ≠ hub MERCURE_SUBSCRIBER_JWT_KEY.
      cors: CORS-fouten — public URL is cross-origin en hub cors_origins sluit Beacon uit.
      publish: 'Publish-fouten in logs — PHP kan MERCURE_URL niet bereiken, of JWT ≠ hub-sleutels.'
      ciphertext: Browser vraagt een onzinpad zoals /MUIFA…== — decryptie van overrides mislukt; maak Publish/Public/JWT hier leeg en gebruik env-waarden.
      push: 'Toasts alleen met open tab is verwacht; gebruik Web Push (VAPID_*) voor achtergrond.'
    verify:
      curl_example: |
        # From the host (replace with your DEFAULT_URI)
        curl -sI "${DEFAULT_URI}/.well-known/mercure"
      title: 5. Verifiëren in de browser
      step1: Open DevTools → Network en filter op mercure of EventSource.
      step2: Bevestig een verbinding met /.well-known/mercure (of je public URL) met een authorisatie-JWT.
      step3: Trigger een nieuw issue op een project waar je bij hoort en let op het SSE-event / toast.
      step4: GET /account/realtime/config moet hubUrl + token alleen bevatten wanneer Mercure is ingeschakeld en geconfigureerd.
    overview:
      title: 1. Wat je nodig hebt
      body: Beacon publiceert privé-updates; ingelogde leden abonneren zolang een tab open is. Deze onderdelen moeten overeenkomen.
      item_hub: 'Een Mercure-hub (Compose-service mercure, of elke Mercure-compatibele hub).'
      item_jwt: Eén gedeeld JWT-HMAC-geheim (≥ 32 tekens) voor PHP en de hub.
      item_proxy: Same-origin-browsertoegang via Caddy op /.well-known/mercure (Compose-standaard).
      item_admin: 'De hoofdschakelaar op dit scherm, plus optionele URL-/geheim-overrides.'
    admin:
      title: 4. Live-waarschuwingen hier inschakelen
      step1: Zet “Mercure-livewaarschuwingen inschakelen” aan.
      step2: 'Laat Publish URL, Public URL en JWT leeg om MERCURE_* uit de omgeving te gebruiken.'
      step3: Of vul die velden in om de env te overschrijven (waarden versleuteld in de database).
      step4: Opslaan. Het statuspaneel hierboven moet live-waarschuwingen als actief tonen.
      step5: 'Meld je aan als projectlid, houd een tab open, maak een nieuw issue en let op de in-app-toast.'
      current_url: 'Nu opgeloste browser-hub-URL: %url%'
