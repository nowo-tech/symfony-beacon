error:
    home: Terug naar home
    sign_in: Inloggen
    generic:
        title: Onverwachte omweg
        lead: Dat verzoek is niet aangekomen. Jij hebt niets in brand gestoken — probeer het zo opnieuw.
        hint: Onze mascotte zoekt al onder de bankkussens naar aanwijzingen.
    404:
        title: Naast de kaart
        lead: Dit pad staat niet op deze Beacon. Controleer de URL of volg het licht naar home — geen speurtocht nodig.
        hint: Zelfs de beste ontdekkers dwalen als de kaart ondersteboven ligt.
        image_alt: Beacon-mascotte met kaart en loep naast een grote 404
    403:
        title: Poort dicht
        lead: Je hebt niet de juiste sleutels voor deze pagina. Log in met een toegestaan account of ga terug — het is niet persoonlijk.
        hint: De mascotte omkopen met koekjes opent het slot ook niet. Hebben we geprobeerd.
        image_alt: Beacon-mascotte naast een beveiligde poort met 403
    500:
        title: Beacon-hik
        lead: Er ging iets mis aan onze kant, niet aan de jouwe. Wacht even en probeer opnieuw — jij deed niets verkeerd.
        hint: We tikken de servers heel zachtjes met een moersleutel. Heel zachtjes.
        image_alt: Beacon-mascotte die een serverrack met 500 repareert
