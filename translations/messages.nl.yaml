  notice:
    title: Juridische mededeling
    intro: Deze juridische kennisgeving is van toepassing op de zelfgehoste %brand%-instantie
      die u bezoekt. Vervang de onderstaande tijdelijke aanduidingen door de echte
      gegevens van de operator vóór openbaar gebruik.
    operator_heading: Exploitant
    operator_body: De exploitant van deze instantie is verantwoordelijk voor de dienst
      en voor de inhoud die zij hier publiceren.
    hosting_heading: Hosten
    hosting_body: Deze software kan worden gehost door de exploitant of door een door
      de exploitant gekozen externe infrastructuuraanbieder. De hostinggegevens moeten
      door de operator worden ingevuld.
    liability_heading: Betrouwbaarheid
    liability_body: De software wordt geleverd zoals hij is. De exploitant blijft
      verantwoordelijk voor rechtmatig gebruik, naleving van de gegevensbescherming
      en de juistheid van exploitantspecifieke juridische teksten in dit geval.
  privacy:
    title: Privacybeleid
    intro: Dit privacybeleid beschrijft hoe persoonlijke gegevens kunnen worden verwerkt
      wanneer u deze %brand%-instantie gebruikt. Exploitanten moeten deze tekst aanpassen
      aan hun organisatie en jurisdictie.
    controller_heading: Gegevensbeheerder
    controller_body: De operator van dit Beacon-exemplaar is de gegevensbeheerder
      voor accounts en telemetrie die in hun implementatie zijn opgeslagen. Vul de
      wettelijke naam en contactgegevens in op de pagina Juridische kennisgeving.
    data_heading: Gegevens die wij verwerken
    data_body: 'Afhankelijk van hoe de operator het exemplaar configureert en gebruikt,
      kan de verwerking het volgende omvatten:'
    data_account: Accountgegevens (e-mail, weergavenaam, wachtwoord-hash, rollen,
      voorkeuren)
    data_telemetry: Applicatiefout- en prestatietelemetrie verzonden via project-DSN/envelop-opname
    data_logs: Operationele logboeken en optionele logboeken voor toestemming voor
      cookies
    data_cookies: Cookies en soortgelijke technologieën beschreven op de Cookies-pagina
    purpose_heading: Doeleinden
    purpose_body: Gegevens worden verwerkt om gebruikers te authenticeren, fouten
      bij te houden voor geconfigureerde projecten, de service te beveiligen en (indien
      ingeschakeld) cookievoorkeuren te onthouden.
    retention_heading: Behoud
    retention_body: Bewaartermijnen worden gedefinieerd door de exploitant (accountlevenscyclus,
      bewaren van projectgegevens, bewaren van logbestanden). Vervang deze paragraaf
      door het bewaarschema van uw organisatie.
    rights_heading: Jouw rechten
    rights_body: Afhankelijk van de toepasselijke wetgeving (bijvoorbeeld AVG) heeft
      u mogelijk recht op toegang, rectificatie, verwijdering, beperking, overdraagbaarheid
      en bezwaar. Neem contact op met de exploitant via de gegevens op de pagina Juridische
      kennisgeving.
    cookies_heading: Koekjes
    cookies_body: We gebruiken noodzakelijke cookies voor aanmelding en opslag van
      toestemming. Optionele categorieën (voorkeuren, analyses) worden pas geactiveerd
      nadat u deze in de cookiebanner heeft toegestaan.
  terms:
    title: Gebruiksvoorwaarden
    intro: Deze voorwaarden zijn van toepassing op het gebruik van deze %brand%-instantie.
      Operators moeten dit sjabloon vervangen door termen die passen bij hun aanbod
      (interne tool, SaaS voor klanten, enz.).
    service_heading: Dienst
    service_body: Beacon biedt zelfgehoste fout- en prestatietracking voor projecten
      die zijn geconfigureerd door geautoriseerde gebruikers.
    accounts_heading: Rekeningen
    accounts_body: U moet de inloggegevens vertrouwelijk houden en de service alleen
      gebruiken voor projecten en gegevens die u mag verwerken.
    accept_heading: Acceptabel gebruik
    accept_body: Maak geen misbruik van de ingest-API, probeer geen ongeoorloofde
      toegang te verkrijgen of upload geen onwettige inhoud. De exploitant kan accounts
      opschorten die deze voorwaarden schenden.
    limitation_heading: Beperking van aansprakelijkheid
    limitation_body: Voor zover wettelijk toegestaan ​​zijn de exploitant en de softwareauteurs
      niet aansprakelijk voor indirecte schade die voortvloeit uit het gebruik van
      de dienst. Exploitanten moeten deze clausule door een raadsman laten beoordelen.
    changes_heading: Veranderingen
    changes_body: De exploitant kan deze voorwaarden bijwerken. Voortgezet gebruik
      na kennisgeving houdt aanvaarding in van de bijgewerkte voorwaarden, voor zover
      toegestaan ​​door de wet.
  cookies:
    title: Cookiemelding
    intro: Deze pagina beschrijft de cookies en vergelijkbare technologieën die door
      deze %brand%-instantie worden gebruikt. Strikt noodzakelijke cookies ondersteunen
      authenticatie, beveiliging en vastlegging van toestemming. Optionele categorieën
      worden alleen gebruikt met uw voorafgaande toestemming. Gebruik Cookie-instellingen
      om uw selectie te allen tijde te bekijken of te wijzigen.
    categories_heading: Categorieën
    cat_required: Strikt noodzakelijk
    cat_required_help: Essentieel voor authenticatie, beveiliging en vastlegging van
      uw toestemmingsbeslissing. Deze cookies kunnen niet worden uitgeschakeld.
    cat_preferences: Voorkeuren
