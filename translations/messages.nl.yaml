        updated: 'Meldingsbestemming bijgewerkt.'
        enabled: 'Bestemming ingeschakeld.'
        disabled: 'Bestemming uitgeschakeld.'
        deleted: 'Bestemming verwijderd.'
        test_queued: 'Kanaaleigen voorbeeldmelding in wachtrij geplaatst voor levering.'
        circuit_resumed: Destination circuit resumed; deliveries may proceed again.
    help:
        title: 'Handleidingen voor notificatie-setup'
        link: 'Setup-handleidingen'
        back: 'Terug naar instellingen'
        toc: 'Ga naar kanaal'
        intro: 'Stapsgewijze instructies om Slack, Discord, Microsoft Teams, Telegram, e-mail of een generieke HTTP-webhook met dit project te verbinden.'
        payload_label: 'Beacon verzendt:'
        docs_hint: 'Volledige referentie (payloads, levering, rechten): docs/NOTIFICATIONS.md in de repository.'
        slack:
            title: 'Slack (Incoming Webhook)'
            lead: 'Maak een Incoming Webhook voor een Slack-app aan en plak de HTTPS-URL in Beacon.'
            step1: 'Open api.slack.com/apps en maak een app From scratch voor je workspace.'
            step2: 'Schakel Incoming Webhooks in, kies daarna Add New Webhook to Workspace en selecteer een kanaal.'
            step3: 'Kopieer de webhook-URL (https://hooks.slack.com/services/...).'
            step4: 'Kies in Beacon Slack Incoming Webhook, plak de URL als endpoint, selecteer categorieen en sla op.'
            step5: 'Klik op Test verzenden en controleer of het bericht in Slack verschijnt.'
            payload: 'JSON met text (samenvatting) en een beacon-object met de volledige eventpayload.'
            tip: 'Gebruik bij voorkeur een apart ops-kanaal. Roteer de webhook in Slack als die ooit uitlekt en werk de bestemming in Beacon bij.'
        discord:
            title: 'Discord (webhook)'
            lead: 'Maak een kanaalwebhook in Discord aan en plak de URL in Beacon.'
            step1: 'Open Serverinstellingen -> Integraties -> Webhooks (of het tabblad Integraties van het kanaal).'
            step2: 'Maak een nieuwe webhook, geef die een naam (bijvoorbeeld Beacon) en kies het doelkanaal.'
            step3: 'Kopieer de webhook-URL (https://discord.com/api/webhooks/...).'
            step4: 'Kies in Beacon Discord-webhook, plak de URL, selecteer categorieen, sla op en verzend daarna een test.'
            payload: 'JSON met content (samenvatting) en een embeds-array (title, description, optionele issue-URL).'
            tip: 'Discord beperkt webhooks; Beacon levert asynchroon via Messenger.'
        teams:
            title: 'Microsoft Teams (Incoming Webhook)'
            lead: 'Voeg een Incoming Webhook-connector toe aan een Teams-kanaal en plak de URL in Beacon.'
            step1: 'Open in het Teams-kanaalmenu Connectors (of Kanaal beheren -> Connectors).'
            step2: 'Configureer Incoming Webhook, geef deze een naam en maak deze aan.'
            step3: 'Kopieer de webhook-URL die Teams verstrekt.'
            step4: 'Kies in Beacon Microsoft Teams-webhook, plak de URL, selecteer categorieen, sla op en verzend daarna een test.'
            payload: 'Office 365 MessageCard-JSON met summary, title, text en een Open in Beacon-actie wanneer een URL bestaat.'
            tip: 'Als je tenant alleen Workflows toestaat in plaats van klassieke Incoming Webhooks, laat dan een generieke HTTP-bestemming wijzen naar een workflow die POST-JSON accepteert.'
        telegram:
            title: 'Telegram (bot)'
            lead: 'Maak een bot met BotFather en sla bot_token@chat_id op als Beacon-endpoint.'
            step1: 'Open @BotFather in Telegram, voer /newbot uit en kopieer het bottoken.'
            step2: 'Start een privechat met de bot, of voeg hem toe aan een groep en stuur een bericht.'
            step3: 'Roep getUpdates aan op de Bot API en lees message.chat.id uit (groeps-id''s zijn vaak negatief).'
            step4: 'Kies in Beacon Telegram-bot en stel het endpoint in op bot_token@chat_id (voorbeeld - 123:AA...@-1001234567890).'
            step5: 'Opslaan en Test verzenden.'
            payload: 'Bot API sendMessage met chat_id en text (alleen de samenvatting; niet de volledige JSON-payload).'
            tip: 'De laatste @ in het endpoint splitst token en chat-id. Tokens worden net als andere endpoints versleuteld in rust opgeslagen.'
        email:
            title: E-mail
            lead: 'Lever meldingen af in een mailbox via Symfony Mailer. Configureer eerst de Mailer-DSN onder Beheer -> Mailer.'
            step1: 'Open Beheer -> Mailer en sla een versleutelde DSN op (smtp://...). MAILER_DSN uit de omgeving is alleen een bootstrapfallback; null://null levert niets af.'
            step2: 'Kies in Beacon E-mail en stel het endpoint in op het ontvangeradres.'
            step3: 'Selecteer categorieen, sla op, verzend een test en controleer inbox/spam.'
            payload: 'Het e-mailonderwerp is gelijk aan de samenvatting; de berichttekst is de samenvatting plus de issue- of performance-URL wanneer aanwezig.'
            tip: 'Gebruik een gedeelde ops-alias. Voor rijkere digests zijn Slack/Discord/Teams of een HTTP-bridge beter.'
        http:
            title: 'Generieke HTTP-webhook'
            lead: 'POST de canonieke Beacon-JSON-payload naar elk HTTPS-automatiseringsendpoint.'
            step1: 'Bied een HTTPS-URL aan die POST met Content-Type application/json accepteert.'
            step2: 'Kies in Beacon Generieke HTTP-webhook, plak de URL, selecteer categorieen, sla op en verzend daarna een test.'
            step3: 'Controleer of je service de canonieke JSON-body ontvangt (event, summary, project, issue, url, category).'
            payload: 'Canonieke JSON-payload als requestbody (User-Agent symfony-beacon-notifications/1.0).'
            tip: 'Gebruik bij voorkeur HTTPS en autenticeer je ontvanger. Vermijd interne of cloudmetadata-adressen.'
