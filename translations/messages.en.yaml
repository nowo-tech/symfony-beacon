mercure_settings:
  title: Mercure
  intro: Optional live alerts for signed-in members when a new issue is created. Disabled
    by default — enable only when a Mercure hub is available. Web Push remains a separate
    Account → Display opt-in.
  manual_hint: 'Use “How to configure” for a step-by-step walkthrough with examples. Full
    operator manual: docs/ops/MERCURE.md in the repository.'
  status:
    active: Live Mercure alerts are enabled for members.
    inactive: Mercure is off
    inactive_help: Members will not open an EventSource until you enable Mercure here
      and provide a reachable hub URL + JWT secret (saved below or via environment).
    url_database: Hub publish URL is stored in instance settings.
    url_env: Hub publish URL falls back to MERCURE_URL from the environment.
    url_missing: No hub publish URL configured (set below or MERCURE_URL).
    secret_database: JWT secret is stored encrypted in instance settings.
    secret_env: JWT secret falls back to MERCURE_JWT_SECRET from the environment.
    secret_missing: No JWT secret configured (set below or MERCURE_JWT_SECRET).
  public_url_preview: 'Browser hub URL: %url%'
  push_note: Background PWA push is configured per user under Account → Display (requires
    VAPID_* keys). It does not depend on Mercure.
  submit: Save Mercure settings
  guide:
    open: How to configure
    close: Close
    title: Configure Mercure step by step
    intro: Live toasts for new issues use a Mercure hub (Server-Sent Events). Mercure
      is optional and independent from Web Push (Account → Display).
    overview:
      title: 1. What you need
      body: Beacon publishes private updates; signed-in members subscribe while a tab
        is open. These pieces must agree.
      item_hub: A Mercure hub (Compose service mercure, or any Mercure-compatible hub).
      item_jwt: One shared JWT HMAC secret (≥ 32 characters) for PHP and the hub.
      item_admin: This screen’s master switch, plus optional URL/secret overrides.
      item_proxy: Same-origin browser access via Caddy at /.well-known/mercure (Compose default).
    env:
      title: 2. Environment variables
      lead: Prefer configuring the hub in .env and leaving the form fields blank so
        Administration only toggles the feature on or off.
      step1: Copy or confirm these variables in .env (from .env.dist).
      step1_example: |
        MERCURE_URL=http://mercure/.well-known/mercure
        MERCURE_PUBLIC_URL=${DEFAULT_URI}/.well-known/mercure
        MERCURE_JWT_SECRET="!ChangeThisMercureHubJWTSecretKey!"
      step2: Replace the placeholder JWT secret with a strong value (minimum 32 characters).
      step2_example: openssl rand -base64 48
      step2_note: The same string must be used by PHP (MERCURE_JWT_SECRET) and by the hub
        (compose.yaml maps it to MERCURE_PUBLISHER_JWT_KEY and MERCURE_SUBSCRIBER_JWT_KEY).
      step3: Know what each variable does.
      table_var: Variable
      table_meaning: Meaning
      row_url: Internal publish URL from PHP (Compose example left).
      row_public: Browser EventSource URL. Prefer ${DEFAULT_URI}/.well-known/mercure so
        the browser stays same-origin through Caddy.
      row_jwt: Shared HMAC secret for publisher and subscriber JWTs.
    start:
      title: 3. Start the hub
      step1: Start or recreate Mercure with the app stack.
      step1_example: |
        docker compose up -d mercure php
        # or a full stack:
        make up
      step2: Confirm the hub health endpoint (inside the Compose network).
      step2_example: docker compose exec mercure curl -fsS http://127.0.0.1/healthz
      step3: Confirm Caddy proxies the hub (already in .docker/frankenphp/Caddyfile).
      step3_example: |
        handle /.well-known/mercure* {
            reverse_proxy mercure:80
        }
    admin:
      title: 4. Enable live alerts here
      step1: Turn on “Enable Mercure live alerts”.
      step2: Leave Publish URL, Public URL, and JWT blank to use MERCURE_* from the environment.
      step3: Or fill those fields to override env (values are encrypted at rest in the database).
      step4: Save. The status panel above should show live alerts as active.
      step5: Sign in as a project member, keep a tab open, create a new issue, and watch for an in-app toast.
      current_url: 'Resolved browser hub URL right now: %url%'
    verify:
      title: 5. Verify in the browser
      step1: Open DevTools → Network and filter by mercure or EventSource.
      step2: Confirm a connection to /.well-known/mercure (or your public URL) with an authorization JWT.
      step3: Trigger a new issue on a project you belong to and watch for the SSE event / toast.
      step4: GET /account/realtime/config should include hubUrl + token only when Mercure is enabled and configured.
      curl_example: |
        # From the host (replace with your DEFAULT_URI)
        curl -sI "${DEFAULT_URI}/.well-known/mercure"
    external:
      title: 6. External hub (optional)
      lead: You can point Beacon at any Mercure-compatible hub instead of the Compose service.
      step1: Set MERCURE_URL (or Publish URL) to an endpoint the PHP container can reach.
      step2: Set MERCURE_PUBLIC_URL (or Public URL) to an HTTPS URL browsers can open.
      step3: Use the same JWT secret on the hub publisher/subscriber keys and in Beacon.
      step4: If the hub is cross-origin, configure hub CORS (cors_origins) for your Beacon origin.
      example: |
        MERCURE_URL=https://mercure.example.com/.well-known/mercure
        MERCURE_PUBLIC_URL=https://mercure.example.com/.well-known/mercure
        MERCURE_JWT_SECRET="your-shared-secret-at-least-32-chars"
    troubleshoot:
      title: 7. Troubleshooting
      inactive: Status inactive — toggle off, or missing URL/secret (DB and env both empty).
      publish: Publish errors in logs — PHP cannot reach MERCURE_URL, or JWT ≠ hub keys.
      unauthorized: EventSource 401 — subscriber JWT secret ≠ hub MERCURE_SUBSCRIBER_JWT_KEY.
      cors: CORS errors — public URL is cross-origin and hub cors_origins excludes Beacon.
      ciphertext: Browser requests a nonsense path like /MUIFA…== — stored overrides failed
        to decrypt; clear Publish/Public/JWT here (or leave blank) and use env values.
      push: Toasts only while a tab is open is expected; use Web Push (VAPID_*) for background.
      recreate: |
        # After changing hub env vars
        docker compose up -d --force-recreate mercure
    docs_hint: Full reference with topics, privacy, and production notes — docs/ops/MERCURE.md.
