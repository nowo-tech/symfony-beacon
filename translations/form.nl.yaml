# FormKit field catalogue (label / placeholder / help). Domain: form
admin_user:
  email:
    label: E-mail
    placeholder: naam@voorbeeld.nl
    help: Inlog-e-mail voor dit account.
  display_name:
    label: Weergavenaam
    placeholder: Jan Jansen
    help: Getoond in de admin-directory en activiteitstijdlijn.
  password:
    label: Wachtwoord
    placeholder: Minimaal 8 tekens
    help: Minimaal 8 tekens.
  role:
    label: Rol
    placeholder: Selecteer een rol
    help: Instantierol (gebruiker of admin).
  enabled:
    label: Account ingeschakeld (kan inloggen)
    placeholder: ''
    help: Indien uitgeschakeld kan de gebruiker niet inloggen.
admin_instance_role:
  name:
    label: Naam
    placeholder: Support
    help: Database-fallback voor de weergavenaam. De UI geeft de voorkeur aan roles.catalog.<slug>.name
      als die sleutel is vertaald (slug = code in kleine letters).
  code:
    label: Code
    placeholder: ROLE_SUPPORT
    help: Symfony-achtige code (bijv. ROLE_SUPPORT). Machine-id — niet vertaald.
  description:
    label: Wanneer gebruiken
    placeholder: Optionele korte toelichting…
    help: Korte toelichting wanneer deze rol toe te wijzen. Geef de voorkeur aan roles.catalog.<slug>.description;
      dit veld is de DB-fallback.
  enabled:
    label: Ingeschakeld
    help: Indien uitgeschakeld kan deze rol niet opnieuw worden toegewezen.
project:
  nav:
    label: Projectsecties
  governance:
    help: Retentie per project, tarieflimieten en dagelijkse quota. Laat een veld leeg om de serverstandaard
      over te nemen.
    inherit_hint: Leeg = serverstandaard overnemen (%default%). Gebruik 0 om uit te schakelen als de standaardwaarde
      niet nul is.
    retention_days:
      label: Retentie dagen
    retention_max_events:
      label: Max. opgeslagen gebeurtenissen
    ingest_rate_limit:
      label: Limiet voor opnamesnelheid (per minuut)
    event_quota_daily:
      label: Dagelijks evenementenquotum
    event_quota_monthly:
      label: Maandelijks evenementenquotum
  name:
    label: Naam
    placeholder: bijv. Facturerings-API
    help: Wordt weergegeven in het dashboard en gebruikt om de projectslug af te leiden.
    required: Projectnaam is vereist.
  description:
    label: Beschrijving
    placeholder: Optionele korte samenvatting
    help: Helpt uw ​​team dit project te herkennen.
  api_keys:
    help: Gebruik een DSN in BEACON_DSN zodat uw app fouten naar dit project kan verzenden.
  members:
    help: Directe leden van dit project. Eigenaren en beheerders beheren het lidmaatschap. Toegang kan
      ook afkomstig zijn van gekoppelde groepen hieronder.
    email_label: E-mailadres van lid
    email_placeholder: gebruiker@voorbeeld.com
    role:
      admin: Beheerder
      full: Full
      member: Lid
      owner: Eigenaar
      viewer: Viewer
    role_label: Rol
  groups:
    help: Koppel een groep zodat elk groepslid de gekozen rol in dit project krijgt. Eigenaren moeten
      worden toegevoegd als individuele gebruikers.
    select: Selecteer een groep…
  config:
    help: 'Draagbare JSON voor dit project (code: %code%). Bevat lidmaatschappen op e-mail; nooit API-geheimen.'
  danger:
    transfer_member_placeholder: Selecteer een lid…
