ops_defaults:
  allow_anonymous_resolve:
    help: Verouderd. Indien ingeschakeld mag Resolve issues wijzigen zonder gemapte Beacon-actor. Geef
      voorkeur aan gemapte gebruikers + triage.
    label: Anonieme Slack/Teams-Resolve toestaan
  allow_private_urls:
    help: Indien ingeschakeld mogen uitgaande webhooks privé-/link-local-hosts bereiken. Laat uitgeschakeld
      in productie.
    label: Privé-notificatie-URL’s toestaan
  circuit_breaker_cooldown:
    help: Minuten voordat een automatisch gepauzeerde bestemming opnieuw mag proberen. Gebruik 0 voor
      handmatige hervatting.
    label: Circuit breaker-afkoeling in minuten
  circuit_breaker_threshold:
    help: Opeenvolgende afleverfouten voordat een notificatiebestemming automatisch wordt gepauzeerd.
    label: Circuit breaker-foutdrempel
  clear_inbound_webhook_secret:
    help: Verwijder het opgeslagen inbound-webhookgeheim.
    label: Inbound-webhookgeheim wissen
  clear_metrics_token:
    help: Verwijder het opgeslagen scrape-token.
    label: Metrics-scrape-token wissen
  delivery_history_limit:
    help: Aantal recente afleverpogingen dat per notificatiebestemming wordt bewaard.
    label: Limiet aflevergeschiedenis
  envelope_max_bytes:
    help: HTTP 413 wanneer een ruwe ingest-body deze grootte overschrijdt. Standaard 2097152 (2 MiB).
    label: Max. Envelope-/OTLP-bodygrootte (bytes)
  event_quota_daily:
    help: Maximum geaccepteerde events per project per dag. Gebruik 0 voor onbeperkt.
    label: Dagelijkse eventquota
  event_quota_monthly:
    help: Maximum geaccepteerde events per project per UTC-kalendermaand. Gebruik 0 voor onbeperkt.
    label: Maandelijkse eventquota
  inbound_email_enabled:
    help: Indien ingeschakeld kunnen mention/assign-mails Reply-To-tokens bevatten en accepteert POST
      /hooks/email/inbound providerwebhooks.
    label: Inbound e-mailreacties inschakelen
  inbound_mail_domain:
    help: Domein gebruikt in Reply-To-adressen (reply+{token}@domein).
    label: Inbound maildomein
  inbound_webhook_secret:
    help: Gedeeld geheim voor X-Beacon-Inbound-Secret en Reply-To-HMAC-ondertekening. Leeg laten behoudt
      het huidige geheim.
    label: Inbound-webhookgeheim
  ingest_rate_limit:
    help: Maximum Envelope-verzoeken per project per minuut. Gebruik 0 voor onbeperkt.
    label: Ingest-snelheidslimiet per minuut
  ingest_reject_query_auth:
    help: Indien ingeschakeld worden beacon_key/beacon_secret-queryparameters geweigerd (401). Alleen
      uitschakelen tijdens migratie naar X-Beacon-Auth of Envelope-DSN.
    label: Verouderde querystring-ingest-auth weigeren
  metrics_require_token:
    help: Indien ingeschakeld geeft /metrics 503 totdat er een metrics-token is opgeslagen. Aanbevolen
      in productie.
    label: Metrics-scrape-token vereisen
  metrics_token:
    help: Bearer-token voor scrapers. Leeg laten behoudt het huidige token.
    label: Metrics-scrape-token
  retention_days:
    help: Verwijder telemetrie ouder dan dit aantal dagen. Gebruik 0 om leeftijdsgebaseerde retentie uit
      te schakelen.
    label: Retentiedagen
  retention_max_events:
    help: Bewaar hoogstens dit aantal events per project. Gebruik 0 voor geen maximum op aantal.
    label: Maximum opgeslagen events per project
instance_mailer:
  plain_mailer_dsn:
    label: Mailer-DSN
    help: Leeg laten om de huidige versleutelde waarde te behouden. Voorbeeld smtp://user:pass@mail.example:587
      - null:// wordt afgewezen (gebruik in plaats daarvan Opgeslagen DSN wissen).
    placeholder: smtp://user:pass@mail.example:587
    invalid: Voer een geldige Symfony Mailer-DSN in (bijvoorbeeld smtp://user:pass@host:587).
    null_transport: null:// kan geen e-mail afleveren. Plak een echte SMTP-DSN (of
      andere), of gebruik Opgeslagen DSN wissen om terug te vallen op de omgeving.
    scheme_not_allowed: Dat Mailer-DSN-schema is niet toegestaan. Gebruik smtp, smtps
      of een ondersteund providerschema (Mailgun, Postmark, SES, …).
  clear_mailer_dsn:
    label: Opgeslagen DSN wissen
    help: Verwijdert de DSN uit de database en valt terug op MAILER_DSN uit de omgeving totdat je een
      nieuwe opslaat.
  mailer_from:
    label: From-adres
    help: Envelope From voor magic login en notificatiemails. Standaard beacon@localhost wanneer leeg.
    placeholder: beacon@example.com
instance_mercure:
  mercure_enabled:
    label: Mercure-livemeldingen inschakelen
    help: Wanneer ingeschakeld abonneren aangemelde leden zich op prive-projecttopics voor nieuwe-issue-toasts
      zolang de app open is.
  mercure_url:
    label: Publish-URL (server)
    help: Leeg laten om MERCURE_URL te gebruiken (bijv. http://mercure/.well-known/mercure binnen Compose).
    placeholder: http://mercure/.well-known/mercure
  mercure_public_url:
    label: Publieke URL (browser)
    help: Leeg laten om MERCURE_PUBLIC_URL te gebruiken (meestal same-origin /.well-known/mercure via
      Caddy).
    placeholder: https://localhost:9447/.well-known/mercure
  plain_mercure_jwt_secret:
    label: JWT-secret
    help: Leeg laten om de huidige versleutelde waarde te behouden of terug te vallen op MERCURE_JWT_SECRET.
      Minimaal 32 tekens indien ingesteld.
    placeholder: ••••••••••••••••••••••••••••••••
    invalid: Voer een geldige JWT-secretstring in.
    too_short: JWT-secret moet minimaal 32 tekens bevatten.
  clear_mercure_jwt_secret:
    label: Opgeslagen JWT-secret wissen
    help: Verwijdert het secret uit de database en valt terug op MERCURE_JWT_SECRET totdat je een nieuwe
      opslaat.
