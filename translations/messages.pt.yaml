    digest_help: Quando ativado, o flush envia um resumo por destino. Quando desativado,
      cada alerta retido e enviado individualmente apos as horas silenciosas.
    pagerduty_note: PagerDuty nativo nao e suportado; use um webhook HTTP generico
      se precisar de uma ponte de incidentes.
