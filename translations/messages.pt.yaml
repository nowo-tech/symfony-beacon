    quiet_hours_enabled: Ativar horas silenciosas
    quiet_hours_help: Durante esta janela, os alertas ficam em buffer em vez de serem
      enviados de imediato. Execute app:notifications:flush-digests num agendamento
      (ou depois da janela).
    quiet_hours_timezone: Fuso horario
