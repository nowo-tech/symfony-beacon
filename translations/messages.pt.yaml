    endpoint: Endpoint
    endpoint_help: 'Slack / Discord / Teams / HTTP: URL HTTPS do webhook. Email: endereco
      do destinatario. Telegram: bot_token@chat_id'
    endpoint_invalid: O endpoint nao corresponde ao tipo selecionado.
    endpoint_ssrf: O endpoint nao deve apontar para enderecos privados, link-local
