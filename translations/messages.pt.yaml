        issue.reopened: 'Issue reaberta'
        issue.assigned: 'Issue atribuida'
        issue.commented: 'Issue comentada'
        issue.duplicated: 'Issue marcada como duplicada'
    flash:
        created: 'Destino de notificacao criado.'
        updated: 'Destino de notificacao atualizado.'
        enabled: 'Destino ativado.'
        disabled: 'Destino desativado.'
        deleted: 'Destino eliminado.'
        test_queued: 'Notificacao de exemplo nativa do canal colocada em fila para entrega.'
        circuit_resumed: Destination circuit resumed; deliveries may proceed again.
    help:
        title: 'Guias de configuracao de notificacoes'
        link: 'Guias de configuracao'
        back: 'Voltar as definicoes'
        toc: 'Ir para o canal'
        intro: 'Instrucoes passo a passo para ligar Slack, Discord, Microsoft Teams, Telegram, email ou um webhook HTTP generico a este projeto.'
        payload_label: 'Beacon envia:'
        docs_hint: 'Referencia completa (payloads, entrega, permissoes): docs/NOTIFICATIONS.md no repositorio.'
        slack:
            title: 'Slack (Incoming Webhook)'
            lead: 'Crie um Incoming Webhook de app Slack e cole o URL HTTPS no Beacon.'
            step1: 'Abra api.slack.com/apps e crie uma app From scratch para o seu workspace.'
            step2: 'Ative Incoming Webhooks, depois Add New Webhook to Workspace e escolha um canal.'
            step3: 'Copie o URL do webhook (https://hooks.slack.com/services/...).'
            step4: 'No Beacon escolha Slack Incoming Webhook, cole o URL como endpoint, selecione categorias e guarde.'
            step5: 'Clique em Enviar teste e confirme que a mensagem aparece no Slack.'
            payload: 'JSON com text (resumo) e um objeto beacon contendo o payload completo do evento.'
            tip: 'Prefira um canal ops dedicado. Rode o webhook no Slack se alguma vez for exposto e atualize o destino no Beacon.'
        discord:
            title: 'Discord (webhook)'
            lead: 'Crie um webhook de canal no Discord e cole o respetivo URL no Beacon.'
            step1: 'Abra Definicoes do servidor -> Integracoes -> Webhooks (ou o separador Integracoes do canal).'
            step2: 'Crie um novo webhook, de-lhe um nome (por exemplo Beacon) e escolha o canal de destino.'
            step3: 'Copie o URL do webhook (https://discord.com/api/webhooks/...).'
            step4: 'No Beacon escolha Webhook do Discord, cole o URL, selecione categorias, guarde e depois Enviar teste.'
            payload: 'JSON com content (resumo) e um array embeds (title, description, URL opcional da issue).'
            tip: 'O Discord aplica rate limits a webhooks; o Beacon entrega de forma assincrona via Messenger.'
        teams:
            title: 'Microsoft Teams (Incoming Webhook)'
            lead: 'Adicione um conector Incoming Webhook a um canal do Teams e cole o URL no Beacon.'
            step1: 'No menu do canal do Teams abra Connectors (ou Gerir canal -> Connectors).'
            step2: 'Configure o Incoming Webhook, atribua-lhe um nome e crie-o.'
            step3: 'Copie o URL do webhook fornecido pelo Teams.'
            step4: 'No Beacon escolha Webhook do Microsoft Teams, cole o URL, selecione categorias, guarde e depois Enviar teste.'
            payload: 'JSON Office 365 MessageCard com summary, title, text e uma acao Open in Beacon quando existir um URL.'
            tip: 'Se o seu tenant so permitir Workflows em vez dos classicos Incoming Webhooks, aponte um destino HTTP generico para um workflow que aceite POST JSON.'
        telegram:
            title: 'Telegram (bot)'
            lead: 'Crie um bot com o BotFather e guarde bot_token@chat_id como endpoint do Beacon.'
            step1: 'Abra @BotFather no Telegram, execute /newbot e copie o token do bot.'
            step2: 'Inicie uma conversa privada com o bot, ou adicione-o a um grupo e envie uma mensagem.'
            step3: 'Chame getUpdates na Bot API e leia message.chat.id (os ids de grupo sao frequentemente negativos).'
            step4: 'No Beacon escolha Bot do Telegram e defina o endpoint como bot_token@chat_id (exemplo - 123:AA...@-1001234567890).'
            step5: 'Guardar e Enviar teste.'
            payload: 'sendMessage da Bot API com chat_id e text (apenas o resumo; nao o payload JSON completo).'
            tip: 'O ultimo @ no endpoint separa o token do id do chat. Os tokens sao cifrados em repouso tal como os outros endpoints.'
        email:
            title: Email
            lead: 'Entregue alertas numa caixa de correio via Symfony Mailer. Configure primeiro o DSN do Mailer em Administracao -> Mailer.'
            step1: 'Abra Administracao -> Mailer e guarde um DSN cifrado (smtp://...). MAILER_DSN no ambiente e apenas um fallback de bootstrap; null://null nao entrega.'
            step2: 'No Beacon escolha Email e defina o endpoint como o endereco do destinatario.'
            step3: 'Selecione categorias, guarde, Enviar teste e verifique caixa de entrada/spam.'
            payload: 'O assunto do email e igual ao resumo; o corpo e o resumo mais o URL da issue ou da performance quando existir.'
            tip: 'Use um alias ops partilhado. Para digests mais ricos, prefira Slack/Discord/Teams ou uma ponte HTTP.'
        http:
            title: 'Webhook HTTP generico'
            lead: 'Envie por POST o payload JSON canonico do Beacon para qualquer endpoint HTTPS de automacao.'
            step1: 'Exponha um URL HTTPS que aceite POST com Content-Type application/json.'
            step2: 'No Beacon escolha Webhook HTTP generico, cole o URL, selecione categorias, guarde e depois Enviar teste.'
            step3: 'Confirme que o seu servico recebe o corpo JSON canonico (event, summary, project, issue, url, category).'
            payload: 'Payload JSON canonico como corpo do pedido (User-Agent symfony-beacon-notifications/1.0).'
            tip: 'Prefira HTTPS e autentique o recetor. Evite apontar para enderecos internos ou de metadados cloud.'
