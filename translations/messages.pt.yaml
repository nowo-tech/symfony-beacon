mercure_settings:
  title: Mercure
  intro: Alertas live opcionais para membros autenticados quando e criada uma nova
    issue. Desativado por predefinicao - ative apenas quando existir um hub Mercure
    disponivel. O Web Push continua a ser uma opcao separada em Conta -> Visualizacao.
  manual_hint: 'Manual do operador (hub, segredo JWT, Compose, resolucao de problemas):
    docs/ops/MERCURE.md no repositorio.'
  status:
    active: Os alertas live Mercure estao ativados para os membros.
    inactive: Mercure esta desativado
    inactive_help: Os membros nao abrirao um EventSource ate ativar Mercure aqui e
      fornecer um URL de hub acessivel + segredo JWT (guardados abaixo ou via ambiente).
    url_database: O URL de publicacao do hub esta guardado nas definicoes da instancia.
    url_env: O URL de publicacao do hub recorre a MERCURE_URL do ambiente.
    url_missing: Nao existe URL de publicacao do hub configurado (defina abaixo ou
      MERCURE_URL).
    secret_database: O segredo JWT esta guardado cifrado nas definicoes da instancia.
    secret_env: O segredo JWT recorre a MERCURE_JWT_SECRET do ambiente.
    secret_missing: Nao existe segredo JWT configurado (defina abaixo ou MERCURE_JWT_SECRET).
  public_url_preview: 'URL do hub no navegador: %url%'
  push_note: O push PWA em segundo plano e configurado por utilizador em Conta ->
    Visualizacao (requer chaves VAPID_*). Nao depende do Mercure.
  submit: Guardar definicoes do Mercure
  guide:
    title: Configurar Mercure passo a passo
    intro: Os toasts em direto para novas issues usam um hub Mercure (Server-Sent Events). Mercure é opcional e independente do Web Push (Conta → Apresentação).
    open: Como configurar
    close: Fechar
    docs_hint: 'Referência completa com topics, privacidade e notas de produção — docs/ops/MERCURE.md.'
    env:
      step1_example: |
        MERCURE_URL=http://mercure/.well-known/mercure
        MERCURE_PUBLIC_URL=${DEFAULT_URI}/.well-known/mercure
        MERCURE_JWT_SECRET="!ChangeThisMercureHubJWTSecretKey!"
      step2_example: openssl rand -base64 48
      title: 2. Variáveis de ambiente
      lead: Prefira configurar o hub no .env e deixar os campos do formulário vazios para a Administração apenas ligar/desligar a funcionalidade.
      step1: Copie ou confirme estas variáveis no .env (a partir de .env.dist).
      step2: Substitua o segredo JWT de exemplo por um valor forte (mínimo 32 caracteres).
      step2_note: A mesma cadeia deve ser usada pelo PHP (MERCURE_JWT_SECRET) e pelo hub (compose.yaml mapeia-a para MERCURE_PUBLISHER_JWT_KEY e MERCURE_SUBSCRIBER_JWT_KEY).
      step3: Saber o que cada variável faz.
      table_var: Variável
      table_meaning: Significado
      row_url: URL interna de publicação a partir do PHP (exemplo Compose à esquerda).
      row_public: 'URL EventSource do navegador. Prefira ${DEFAULT_URI}/.well-known/mercure para permanecer same-origin através do Caddy.'
      row_jwt: Segredo HMAC partilhado para JWTs de publisher e subscriber.
    external:
      example: |
        MERCURE_URL=https://mercure.example.com/.well-known/mercure
        MERCURE_PUBLIC_URL=https://mercure.example.com/.well-known/mercure
        MERCURE_JWT_SECRET="your-shared-secret-at-least-32-chars"
      title: 6. Hub externo (opcional)
      lead: Pode apontar a Beacon para qualquer hub compatível com Mercure em vez do serviço Compose.
      step1: Defina MERCURE_URL (ou Publish URL) para um endpoint que o contentor PHP possa alcançar.
      step2: Defina MERCURE_PUBLIC_URL (ou Public URL) para um URL HTTPS que os browsers possam abrir.
      step3: Use o mesmo segredo JWT nas chaves publisher/subscriber do hub e na Beacon.
      step4: 'Se o hub for cross-origin, configure CORS do hub (cors_origins) para a origem Beacon.'
    start:
      step1_example: |
        docker compose up -d mercure php
        # or a full stack:
        make up
      step2_example: 'docker compose exec mercure curl -fsS http://127.0.0.1/healthz'
      step3_example: |
        handle /.well-known/mercure* {
            reverse_proxy mercure:80
        }
      title: 3. Arrancar o hub
      step1: Arranque ou recrie o Mercure com a stack da app.
      step2: Confirme o endpoint de health do hub (dentro da rede Compose).
      step3: Confirme que o Caddy faz proxy do hub (já em .docker/frankenphp/Caddyfile).
    troubleshoot:
      recreate: |
        # After changing hub env vars
        docker compose up -d --force-recreate mercure
      title: 7. Resolução de problemas
      inactive: 'Estado inativo — interruptor desligado, ou faltam URL/segredo (DB e env vazios).'
      unauthorized: EventSource 401 — segredo JWT de subscritor ≠ MERCURE_SUBSCRIBER_JWT_KEY do hub.
      cors: Erros CORS — public URL é cross-origin e cors_origins do hub exclui a Beacon.
      publish: 'Erros de publicação nos logs — o PHP não alcança MERCURE_URL, ou JWT ≠ chaves do hub.'
      ciphertext: O browser pede um caminho sem sentido como /MUIFA…== — falha ao decifrar overrides; limpe Publish/Public/JWT aqui e use valores do env.
      push: 'Toasts só com separador aberto é o esperado; use Web Push (VAPID_*) para segundo plano.'
    verify:
      curl_example: |
        # From the host (replace with your DEFAULT_URI)
        curl -sI "${DEFAULT_URI}/.well-known/mercure"
      title: 5. Verificar no navegador
      step1: Abra DevTools → Network e filtre por mercure ou EventSource.
      step2: Confirme uma ligação a /.well-known/mercure (ou a sua public URL) com um JWT de autorização.
      step3: Dispare uma nova issue num projeto a que pertence e observe o evento SSE / toast.
      step4: GET /account/realtime/config só deve incluir hubUrl + token quando o Mercure está ativo e configurado.
    overview:
      title: 1. O que precisa
      body: A Beacon publica atualizações privadas; os membros com sessão iniciada subscrevem enquanto um separador está aberto. Estas peças devem coincidir.
      item_hub: 'Um hub Mercure (serviço Compose mercure, ou qualquer hub compatível).'
      item_jwt: Um segredo JWT HMAC partilhado (≥ 32 caracteres) para PHP e o hub.
      item_proxy: Acesso same-origin do navegador via Caddy em /.well-known/mercure (predefinição Compose).
      item_admin: 'O interruptor principal deste ecrã, mais substituições opcionais de URL/segredo.'
    admin:
      title: 4. Ativar alertas em direto aqui
      step1: Ative «Ativar alertas Mercure em direto».
      step2: 'Deixe Publish URL, Public URL e JWT vazios para usar MERCURE_* do ambiente.'
      step3: Ou preencha esses campos para substituir o env (valores cifrados em repouso na base de dados).
      step4: Guarde. O painel de estado acima deve mostrar os alertas como ativos.
      step5: 'Inicie sessão como membro do projeto, mantenha um separador aberto, crie uma nova issue e observe o toast.'
      current_url: 'URL de hub do navegador resolvida agora: %url%'
