            title: 'Slack (Incoming Webhook)'
            lead: "Creez un Incoming Webhook d''application Slack et collez l''URL HTTPS dans Beacon."
            step1: 'Ouvrez api.slack.com/apps et creez une application From scratch pour votre workspace.'
            step2: 'Activez Incoming Webhooks, puis Add New Webhook to Workspace et choisissez un canal.'
            step3: "Copiez l''URL du webhook (https://hooks.slack.com/services/...)."
            step4: "Dans Beacon choisissez Slack Incoming Webhook, collez l''URL comme endpoint, selectionnez les categories et enregistrez."
            step5: 'Cliquez sur Envoyer un test et verifiez que le message apparait dans Slack.'
            payload: "JSON avec text (resume) et un objet beacon contenant la payload complete de l''evenement."
            tip: "Preferez un canal ops dedie. Faites tourner le webhook dans Slack s''il fuite un jour ; mettez ensuite a jour la destination dans Beacon."
        discord:
            title: 'Discord (webhook)'
            lead: 'Creez un webhook de canal dans Discord et collez son URL dans Beacon.'
            step1: "Ouvrez Parametres du serveur -> Integrations -> Webhooks (ou l''onglet Integrations du canal)."
            step2: 'Creez un nouveau webhook, nommez-le (par exemple Beacon) et choisissez le canal cible.'
            step3: "Copiez l''URL du webhook (https://discord.com/api/webhooks/...)."
            step4: "Dans Beacon choisissez Webhook Discord, collez l''URL, selectionnez les categories, enregistrez puis envoyez un test."
            payload: "JSON avec content (resume) et un tableau embeds (title, description, URL d''issue facultative)."
            tip: 'Discord applique des limites de debit aux webhooks ; Beacon livre de facon asynchrone via Messenger.'
        teams:
            title: 'Microsoft Teams (Incoming Webhook)'
            lead: "Ajoutez un connecteur Incoming Webhook a un canal Teams et collez l''URL dans Beacon."
            step1: 'Dans le menu du canal Teams, ouvrez Connectors (ou Gerer le canal -> Connectors).'
            step2: 'Configurez Incoming Webhook, donnez-lui un nom et creez-le.'
            step3: "Copiez l''URL du webhook fournie par Teams."
            step4: "Dans Beacon choisissez Webhook Microsoft Teams, collez l''URL, selectionnez les categories, enregistrez puis envoyez un test."
            payload: "JSON Office 365 MessageCard avec summary, title, text et une action Open in Beacon lorsqu''une URL existe."
            tip: "Si votre tenant n''autorise que Workflows au lieu des Incoming Webhooks classiques, pointez une destination HTTP generique vers un workflow qui accepte un POST JSON."
        telegram:
            title: 'Telegram (bot)'
            lead: 'Creez un bot avec BotFather et stockez bot_token@chat_id comme endpoint Beacon.'
            step1: 'Ouvrez @BotFather dans Telegram, lancez /newbot et copiez le jeton du bot.'
            step2: 'Demarrez une conversation privee avec le bot, ou ajoutez-le a un groupe et envoyez un message.'
            step3: 'Appelez getUpdates sur la Bot API et lisez message.chat.id (les ids de groupe sont souvent negatifs).'
            step4: "Dans Beacon choisissez Bot Telegram et definissez l''endpoint sur bot_token@chat_id (exemple - 123:AA...@-1001234567890)."
            step5: 'Enregistrez puis envoyez un test.'
            payload: 'sendMessage de la Bot API avec chat_id et text (resume uniquement ; pas la payload JSON complete).'
            tip: "Le dernier @ de l''endpoint separe le token et l''id de chat. Les tokens sont chiffres au repos comme les autres endpoints."
        email:
            title: E-mail
            lead: "Envoyez les alertes vers une boite mail via Symfony Mailer. Configurez d''abord le DSN Mailer sous Administration -> Mailer."
            step1: "Ouvrez Administration -> Mailer et enregistrez un DSN chiffre (smtp://...). MAILER_DSN de l''environnement n''est qu''un fallback de bootstrap ; null://null ne livre rien."
            step2: "Dans Beacon choisissez E-mail et definissez l''endpoint sur l''adresse du destinataire."
            step3: 'Selectionnez les categories, enregistrez, envoyez un test et verifiez la boite / le spam.'
            payload: "L''objet de l''e-mail correspond au resume ; le corps contient le resume plus l''URL de l''issue ou de la performance lorsqu''elle existe."
            tip: 'Utilisez un alias ops partage. Pour des digests plus riches, preferez Slack/Discord/Teams ou un pont HTTP.'
        http:
            title: 'Webhook HTTP generique'
            lead: "Envoyez par POST la payload JSON canonique de Beacon vers n''importe quel endpoint HTTPS d''automatisation."
            step1: 'Exposez une URL HTTPS qui accepte les POST avec Content-Type application/json.'
            step2: "Dans Beacon choisissez Webhook HTTP generique, collez l''URL, selectionnez les categories, enregistrez puis envoyez un test."
            step3: 'Verifiez que votre service recoit le corps JSON canonique (event, summary, project, issue, url, category).'
            payload: 'Payload JSON canonique dans le corps de la requete (User-Agent symfony-beacon-notifications/1.0).'
            tip: 'Preferez HTTPS et authentifiez votre recepteur. Evitez de pointer vers des adresses internes ou de metadonnees cloud.'
