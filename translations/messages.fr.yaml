    hosting_body: 'Cette instance est hébergée sur une infrastructure choisie par l’opérateur. Documentez l’hébergeur et le lieu de stockage avant l’usage public. Les sous-traitants n’agissent que sur instruction de l’opérateur.'
    ip_heading: Propriété intellectuelle
    ip_body: 'La marque, la mascotte et l’interface de cette instance appartiennent à l’opérateur ou à ses concédants. Le code source est proposé sous licence MIT dans le dépôt ; cette licence ne cède pas la marque de l’opérateur.'
    liability_heading: Responsabilité
    liability_body: 'L’opérateur maintient le service avec la diligence exigée par l’état de l’art. Le texte par défaut ne limite pas une responsabilité que le droit de la consommation espagnol ou de l’UE n’autorise pas à exclure. Faites relire cette clause avant la production.'
    law_heading: Droit applicable
    law_body: 'Remplacez cette clause par le droit applicable et le for conseillés pour l’opérateur. Jusque-là, c’est un espace réservé. Les consommateurs peuvent saisir les tribunaux de leur domicile lorsque la loi le prévoit.'
  privacy:
    title: Politique de confidentialité
    intro: 'Cette politique explique comment des données personnelles peuvent être traitées sur cette instance %brand% offerte à des personnes dans l’UE/EEE, y compris l’Espagne (RGPD et LOPDGDD). L’opérateur doit remplacer les espaces réservés par ses propres données de responsable avant la production.'
    controller_heading: Responsable du traitement
    controller_body: 'L’opérateur de cette instance est le responsable de traitement. Ce modèle n’inclut pas de délégué à la protection des données ; les demandes vont au contact de l’avis légal.'
    controller_self_host: Un tiers qui auto-héberge ce logiciel est le responsable de ce déploiement. Les applications clientes qui envoient de la télémétrie restent responsables des données d’utilisateurs finaux contenues dans ces événements ; Beacon conserve cette télémétrie pour le titulaire du projet.
    data_heading: Données traitées
    data_body: 'Sur cette instance l’opérateur peut traiter :'
    data_account: Données de compte — e-mail, nom affiché, empreinte du mot de passe, rôles, langue préférée et téléphone si vous l’ajoutez.
    data_telemetry: Télémétrie de projet que vous ou votre application envoyez via un DSN (erreurs et performance, pouvant inclure adresses IP, URL et identifiants inclus par votre application).
    data_security: Données de sécurité — tentatives de connexion, observations d’appareil (cookie di_obs) et navigateurs de confiance. L’identifiant d’appareil n’est pas un mot de passe.
    data_logs: Journaux d’exploitation, y compris l’audit HTTP et les journaux de consentement aux cookies.
    data_cookies: Cookies et stockages similaires décrits sur la page Cookies.
    purpose_heading: Finalités
    purpose_body: Nous traitons ces données pour créer et sécuriser les comptes, fournir le suivi d’erreurs et de performance des projets que vous configurez, envoyer les notifications que vous définissez, maintenir le service et enregistrer les choix de cookies.
    basis_heading: Bases juridiques
    basis_contract: Contrat (RGPD art. 6, §1, b) — compte, authentification et service de suivi demandé.
    basis_legitimate: Intérêts légitimes (art. 6, §1, f) — sécurité, prévention des abus, intelligence d’appareil et journaux de diagnostic. Vous pouvez vous y opposer lorsque le droit le prévoit.
    basis_consent: Consentement (art. 6, §1, a et ePrivacy) — catégories facultatives de cookies (préférences, mesure d’audience). Retrait à tout moment dans Paramètres des cookies. Les cookies nécessaires ne reposent pas sur le consentement.
    basis_legal: Obligation légale (art. 6, §1, c) — répondre aux autorités compétentes lorsque la loi l’exige.
    recipients_heading: Destinataires
    recipients_body: 'Les données sont stockées sur l’infrastructure choisie par l’opérateur et chez le mailer qu’il configure. Le déploiement par défaut ne vend pas de données personnelles. Les administrateurs de projet peuvent ajouter des destinations de notification ; celles-ci ne reçoivent que le contenu d’alerte configuré. Les sous-traitants agissent sur instructions écrites.'
    transfers_heading: Transferts internationaux
    transfers_body: 'L’opérateur doit documenter si le traitement reste dans l’UE/EEE. Ce modèle suppose un hébergement dans l’EEE jusqu’à remplacement. Si un administrateur configure un webhook ou une boîte hors EEE, il provoque le transfert et doit disposer d’un mécanisme du chapitre V du RGPD.'
    retention_heading: Conservation
    retention_account: Les comptes sont conservés tant qu’ils existent et sont supprimés ou anonymisés lorsque vous supprimez le compte ou qu’un administrateur retire l’utilisateur.
    retention_telemetry: La télémétrie est conservée pendant la durée configurée sur chaque projet. Sans durée, les événements restent jusqu’à ce qu’un administrateur les supprime ou supprime le projet.
    retention_cookies: Le cookie de session dure jusqu’à 1 jour ; Se souvenir de moi jusqu’à 30 jours ; les cookies de consentement environ 1 an ; di_obs 1 heure.
    retention_logs: Les journaux HTTP et de consentement suivent la purge définie dans l’administration. Les journaux de sécurité ne sont gardés que le temps d’enquêter sur un abus.
    rights_heading: Vos droits
    rights_body: 'Vous pouvez demander l’accès, la rectification, l’effacement, la limitation, la portabilité et l’opposition, et retirer le consentement des cookies facultatifs. Contactez l’opérateur via l’avis légal. Réponse sous un mois, prolongeable de deux mois si la demande est complexe ; l’identité peut être vérifiée.'
    authority_heading: Autorité de contrôle
    authority_body: Vous pouvez introduire une réclamation auprès de l’Agencia Española de Protección de Datos (AEPD), C/ Jorge Juan 6, 28001 Madrid, Espagne, https://www.aepd.es, ou auprès de l’autorité de votre pays de résidence dans l’UE/EEE.
    automated_heading: Décisions automatisées
    automated_body: Nous ne prenons pas de décision fondée exclusivement sur un traitement automatisé produisant des effets juridiques ou similaires (RGPD art. 22). L’intelligence d’appareil sert la sécurité du compte ; elle n’accorde ni ne refuse un contrat à elle seule et n’est pas un identifiant de connexion.
    cookies_heading: Cookies
    cookies_body: Les cookies strictement nécessaires permettent la connexion, la sécurité et l’enregistrement du consentement. Les catégories facultatives ne s’activent que si vous les acceptez.
  terms:
    title: Conditions d’utilisation
    intro: 'Ces conditions sont un modèle pour l’usage de cette instance %brand%. Remplacez-les avant production par des conditions adaptées à l’offre de l’opérateur. Si vous n’utilisez que le code sous licence MIT sur vos serveurs, les conditions de ce déploiement sont les vôtres.'
    service_heading: Service
    service_body: Le service est le suivi d’erreurs et de performance pour les projets créés par des utilisateurs autorisés, y compris l’ingestion, le flux d’issues, les notifications et l’administration.
    accounts_heading: Comptes
    accounts_body: Vous devez fournir des données de compte exactes, garder vos identifiants confidentiels et n’utiliser le service que pour des projets et des données personnelles que vous êtes autorisé à traiter. Vous répondez de l’activité faite avec votre compte.
    accept_heading: Usage acceptable
    accept_body: N’abusez pas de l’API d’ingestion, ne cherchez pas un accès non autorisé, n’envoyez pas de contenu illicite et n’utilisez pas le service pour nuire à autrui. Nous pouvons suspendre un accès qui viole ces conditions ou la loi.
    ip_heading: Propriété intellectuelle
    ip_body: 'Le code source est licencié sous MIT comme indiqué dans le dépôt. Ces conditions ne cèdent pas la marque Beacon ni les signes de l’opérateur. Vous conservez les droits sur la télémétrie envoyée ; vous accordez à l’opérateur la licence nécessaire pour la stocker et l’afficher afin de fournir le service.'
    limitation_heading: Limitation de responsabilité
    limitation_body: 'Dans la mesure permise par le droit applicable, l’opérateur n’est pas responsable des dommages indirects ou consécutifs liés à l’usage du service. La responsabilité qui ne peut pas légalement être exclue demeure. Faites relire cette clause avant la production.'
    law_heading: Droit applicable et juridiction
    law_body: 'Remplacez cette clause par le droit applicable et le for conseillés pour l’opérateur. Les consommateurs peuvent saisir les tribunaux de leur domicile lorsque la loi le prévoit.'
    changes_heading: Modifications
    changes_body: Nous pouvons mettre à jour ces conditions en publiant le nouveau texte sur cette page avec une nouvelle date. Si une modification réduit vos droits, nous préviendrons aussi les administrateurs connectés avant la prise d’effet lorsque la loi exige un préavis. L’usage continu après la date d’effet vaut acceptation lorsque la loi admet cette forme.
  cookies:
    title: Politique de cookies
    intro: Cette page liste les cookies et techniques similaires de cette instance %brand%. Les cookies strictement nécessaires permettent l’authentification, la sécurité et l’enregistrement du consentement. Les catégories facultatives ne sont utilisées qu’avec votre consentement préalable. Utilisez Paramètres des cookies pour revoir ou modifier votre choix à tout moment.
    categories_heading: Catégories
    cat_required: Strictement nécessaires
    cat_required_help: Indispensables à l’authentification, à la sécurité et à l’enregistrement de votre décision. Ils ne peuvent pas être désactivés depuis la bannière.
    cat_preferences: Préférences
    cat_preferences_help: Cookies facultatifs qui mémorisent des choix de présentation non essentiels, seulement si vous acceptez cette catégorie.
    cat_analytics: Mesure d’audience
    cat_analytics_help: 'Cookies de mesure facultatifs, uniquement si cette instance active des outils d’analyse et que vous acceptez cette catégorie. La compilation par défaut n’installe pas de cookie d’analyse tiers.'
    inventory_heading: Inventaire des cookies
    col_name: Nom
    col_category: Catégorie
    col_duration: Durée
    col_purpose: Finalité
    duration_session: Jusqu’à 1 jour
    duration_remember: Jusqu’à 30 jours
    duration_consent: Environ 1 an
    duration_device: 1 heure
    purpose_session: Maintient la session HTTP authentifiée nécessaire aux zones protégées.
    purpose_remember: Permet l’authentification persistante lorsque « Se souvenir de moi » est coché à la connexion.
    purpose_csrf: Cookie CSRF à double envoi, de courte durée, posé par Symfony lors de l’envoi de formulaires protégés (motif csrf-token_* ; préfixe __Host- en HTTPS).
    purpose_consent: Cookie_Consent et Cookie_Consent_Key enregistrent qu’une décision de consentement a été prise et relient une clé anonyme au journal de consentement du serveur.
    purpose_category: Cookie_Category_analytics et Cookie_Category_preferences mémorisent si chaque catégorie facultative a été acceptée ou refusée (mécanisme de consentement, pas des traceurs).
    purpose_device: Pointeur HttpOnly (di_obs) pour reconnaître un navigateur qui revient, pour la sécurité du compte. Ce n’est ni un identifiant de connexion ni un identifiant publicitaire.
    storage_heading: Stockage local
    storage_body: Le thème (clair/sombre) et certains choix de mise en page peuvent être stockés dans le localStorage du navigateur. Ce ne sont pas des cookies HTTP. Ils sont strictement nécessaires pour conserver l’interface choisie sur cet appareil.
