mailer_settings:
  title: Mailer
  intro: Speichern Sie das Symfony Mailer DSN verschlusselt in der Datenbank (nicht
    in .env). Die Magic-Link-Anmeldung bleibt verborgen, bis hier ein DSN ungleich
    null gespeichert ist; E-Mail-Benachrichtigungsziele verwenden ebenfalls diesen
    Transport.
  status:
    database: Ausgehende E-Mails verwenden das in den Instanzeinstellungen gespeicherte
      DSN. Die Magic-Link-Anmeldung ist verfugbar, wenn dieses DSN kein Null-Transport
      ist.
    env_fallback: Es gibt noch kein Datenbank-DSN - ausgehende E-Mails fallen auf
      MAILER_DSN aus der Umgebung zuruck (normalerweise null://null). Die Magic-Link-Anmeldung
      bleibt deaktiviert, bis Sie hier ein verschlusseltes DSN speichern.
  current_dsn: 'Aktuelles DSN:'
  from_preview: 'Absenderadresse: %from%'
  submit: Mailer-Einstellungen speichern
  magic_ready: Magic-Link-E-Mail-Anmeldedaten sind bereit
  magic_blocked: Magic-Link-E-Mail ist nicht verfugbar (speichern Sie ein zustellbares
    verschlusseltes DSN)
  sample:
    title: Beispiel-E-Mail senden
    intro: Sendet eine Testnachricht uber das verschlusselte Mailer DSN (derselbe
      Transport wie fur die Magic-Link-Anmeldung).
    to_label: Empfanger
    submit: Beispiel senden
    unavailable: Speichern Sie zuerst ein gultiges verschlusseltes Mailer DSN (nicht
      null://), dann konnen Sie ein Beispiel senden.
    email_subject: Beacon-Mailer-Beispiel (Magic-Login-Anmeldedaten)
