    oder einen generischen HTTP-Endpunkt, wenn neue Issues, Regressionen, Schwellenwertspitzen
    oder N+1-Gruppen auftreten.
  empty: Noch keine Ziele. Fugen Sie einen Kanal hinzu, um Ihr Team zu benachrichtigen.
