mercure_settings:
  title: Mercure
  intro: Optionale Live-Benachrichtigungen fur angemeldete Mitglieder, wenn ein neues
    Issue erstellt wird. Standardmassig deaktiviert - nur aktivieren, wenn ein Mercure-Hub
    verfugbar ist. Web Push bleibt eine separate Aktivierung unter Konto -> Anzeige.
  manual_hint: 'Betriebshandbuch (Hub, JWT-Geheimnis, Compose, Fehlerbehebung): docs/ops/MERCURE.md
    im Repository.'
  status:
    active: Live-Mercure-Benachrichtigungen sind fur Mitglieder aktiviert.
    inactive: Mercure ist deaktiviert
    inactive_help: Mitglieder offnen kein EventSource, bis Sie Mercure hier aktivieren
      und eine erreichbare Hub-URL + ein JWT-Geheimnis angeben (unten gespeichert
      oder uber die Umgebung).
    url_database: Die Hub-Publish-URL ist in den Instanzeinstellungen gespeichert.
    url_env: Die Hub-Publish-URL fallt auf MERCURE_URL aus der Umgebung zuruck.
    url_missing: Es ist keine Hub-Publish-URL konfiguriert (unten setzen oder MERCURE_URL).
    secret_database: Das JWT-Geheimnis ist verschlusselt in den Instanzeinstellungen
      gespeichert.
    secret_env: Das JWT-Geheimnis fallt auf MERCURE_JWT_SECRET aus der Umgebung zuruck.
    secret_missing: Es ist kein JWT-Geheimnis konfiguriert (unten setzen oder MERCURE_JWT_SECRET).
  public_url_preview: 'Browser-Hub-URL: %url%'
  push_note: Hintergrund-PWA-Push wird pro Benutzer unter Konto -> Anzeige konfiguriert
    (benotigt VAPID_*-Schlussel). Es hangt nicht von Mercure ab.
  submit: Mercure-Einstellungen speichern
  guide:
    title: Mercure Schritt für Schritt konfigurieren
    intro: Live-Toasts für neue Issues nutzen einen Mercure-Hub (Server-Sent Events). Mercure ist optional und unabhängig von Web Push (Konto → Anzeige).
    open: So konfigurieren
    close: Schließen
    docs_hint: 'Vollständige Referenz zu Topics, Datenschutz und Produktion — docs/ops/MERCURE.md.'
    env:
      step1_example: |
        MERCURE_URL=http://mercure/.well-known/mercure
        MERCURE_PUBLIC_URL=${DEFAULT_URI}/.well-known/mercure
        MERCURE_JWT_SECRET="!ChangeThisMercureHubJWTSecretKey!"
      step2_example: openssl rand -base64 48
      title: 2. Umgebungsvariablen
      lead: 'Hub lieber in .env konfigurieren und Formularfelder leer lassen, damit die Administration nur die Funktion ein-/ausschaltet.'
      step1: Diese Variablen in .env kopieren oder bestätigen (aus .env.dist).
      step2: Platzhalter-JWT-Geheimnis durch einen starken Wert ersetzen (mindestens 32 Zeichen).
      step2_note: Dieselbe Zeichenkette muss PHP (MERCURE_JWT_SECRET) und der Hub verwenden (compose.yaml mappt sie auf MERCURE_PUBLISHER_JWT_KEY und MERCURE_SUBSCRIBER_JWT_KEY).
      step3: 'Wissen, wofür jede Variable steht.'
      table_var: Variable
      table_meaning: Bedeutung
      row_url: Interne Publish-URL aus PHP (Compose-Beispiel links).
      row_public: 'Browser-EventSource-URL. Bevorzugen Sie ${DEFAULT_URI}/.well-known/mercure, damit der Browser same-origin über Caddy bleibt.'
      row_jwt: Gemeinsames HMAC-Geheimnis für Publisher- und Subscriber-JWTs.
    external:
      example: |
        MERCURE_URL=https://mercure.example.com/.well-known/mercure
        MERCURE_PUBLIC_URL=https://mercure.example.com/.well-known/mercure
        MERCURE_JWT_SECRET="your-shared-secret-at-least-32-chars"
      title: 6. Externer Hub (optional)
      lead: Sie können Beacon auf jeden Mercure-kompatiblen Hub statt des Compose-Dienstes zeigen.
      step1: 'MERCURE_URL (oder Publish URL) auf einen Endpunkt setzen, den der PHP-Container erreichen kann.'
      step2: 'MERCURE_PUBLIC_URL (oder Public URL) auf eine HTTPS-URL setzen, die Browser öffnen können.'
      step3: Dasselbe JWT-Geheimnis für Hub-Publisher/Subscriber-Schlüssel und in Beacon verwenden.
      step4: Bei Cross-Origin-Hub CORS (cors_origins) für Ihren Beacon-Origin konfigurieren.
    start:
      step1_example: |
        docker compose up -d mercure php
        # or a full stack:
        make up
      step2_example: 'docker compose exec mercure curl -fsS http://127.0.0.1/healthz'
      step3_example: |
        handle /.well-known/mercure* {
            reverse_proxy mercure:80
        }
      title: 3. Hub starten
      step1: Mercure mit dem App-Stack starten oder neu erstellen.
      step2: Health-Endpoint des Hubs prüfen (im Compose-Netzwerk).
      step3: 'Bestätigen, dass Caddy den Hub proxied (bereits in .docker/frankenphp/Caddyfile).'
    troubleshoot:
      recreate: |
        # After changing hub env vars
        docker compose up -d --force-recreate mercure
      title: 7. Fehlerbehebung
      inactive: 'Status inaktiv — Schalter aus, oder URL/Geheimnis fehlen (DB und Env leer).'
      unauthorized: EventSource 401 — Subscriber-JWT-Geheimnis ≠ Hub MERCURE_SUBSCRIBER_JWT_KEY.
      cors: CORS-Fehler — Public URL ist cross-origin und Hub cors_origins schließt Beacon aus.
      publish: 'Publish-Fehler in Logs — PHP erreicht MERCURE_URL nicht, oder JWT ≠ Hub-Schlüssel.'
      ciphertext: Browser fordert Unsinnspfad wie /MUIFA…== — Overrides konnten nicht entschlüsselt werden; Publish/Public/JWT hier leeren und Env-Werte nutzen.
      push: 'Toasts nur bei offenem Tab sind erwartet; für Hintergrund Web Push (VAPID_*) nutzen.'
    verify:
      curl_example: |
        # From the host (replace with your DEFAULT_URI)
        curl -sI "${DEFAULT_URI}/.well-known/mercure"
      title: 5. Im Browser prüfen
      step1: DevTools → Network öffnen und nach mercure oder EventSource filtern.
      step2: Verbindung zu /.well-known/mercure (oder Ihrer Public URL) mit Autorisierungs-JWT bestätigen.
      step3: 'Neues Issue in einem Projekt erzeugen, dem Sie angehören, und SSE-Event / Toast beobachten.'
      step4: 'GET /account/realtime/config sollte hubUrl + token nur enthalten, wenn Mercure aktiv und konfiguriert ist.'
    overview:
      title: 1. Was Sie brauchen
      body: 'Beacon veröffentlicht private Updates; angemeldete Mitglieder abonnieren, solange ein Tab offen ist. Diese Teile müssen übereinstimmen.'
      item_hub: Ein Mercure-Hub (Compose-Dienst mercure oder ein kompatibler Hub).
      item_jwt: Ein gemeinsames JWT-HMAC-Geheimnis (≥ 32 Zeichen) für PHP und den Hub.
      item_proxy: Same-Origin-Browserzugriff über Caddy unter /.well-known/mercure (Compose-Standard).
      item_admin: Der Hauptschalter auf diesem Bildschirm plus optionale URL-/Geheimnis-Overrides.
    admin:
      title: 4. Live-Alerts hier aktivieren
      step1: „Mercure-Live-Alerts aktivieren“ einschalten.
      step2: 'Publish URL, Public URL und JWT leer lassen, um MERCURE_* aus der Umgebung zu nutzen.'
      step3: 'Oder Felder ausfüllen, um die Umgebung zu überschreiben (Werte werden in der DB verschlüsselt).'
      step4: Speichern. Das Statuspanel oben sollte Live-Alerts als aktiv anzeigen.
      step5: 'Als Projektmitglied anmelden, Tab offen lassen, neues Issue erzeugen und auf den In-App-Toast achten.'
      current_url: 'Aktuell aufgelöste Browser-Hub-URL: %url%'
instance_mercure:
