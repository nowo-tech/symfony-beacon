        intro: 'Schritt-fur-Schritt-Anleitungen, um Slack, Discord, Microsoft Teams, Telegram, E-Mail oder einen generischen HTTP-Webhook mit diesem Projekt zu verbinden.'
        payload_label: 'Beacon sendet:'
        docs_hint: 'Vollstandige Referenz (Payloads, Zustellung, Berechtigungen): docs/NOTIFICATIONS.md im Repository.'
        slack:
            title: 'Slack (Incoming Webhook)'
            lead: 'Erstellen Sie einen Slack-App-Incoming-Webhook und fugen Sie die HTTPS-URL in Beacon ein.'
            step1: 'Offnen Sie api.slack.com/apps und erstellen Sie eine App From scratch fur Ihren Workspace.'
            step2: 'Aktivieren Sie Incoming Webhooks, dann Add New Webhook to Workspace und wahlen Sie einen Kanal aus.'
            step3: 'Kopieren Sie die Webhook-URL (https://hooks.slack.com/services/...).'
            step4: 'Wahlen Sie in Beacon Slack Incoming Webhook, fugen Sie die URL als Endpunkt ein, wahlen Sie Kategorien und speichern Sie.'
            step5: 'Klicken Sie auf Test senden und bestatigen Sie, dass die Nachricht in Slack erscheint.'
            payload: 'JSON mit text (Zusammenfassung) und einem beacon-Objekt mit der vollstandigen Event-Payload.'
            tip: 'Bevorzugen Sie einen eigenen Ops-Kanal. Rotieren Sie den Webhook in Slack, wenn er jemals offengelegt wird, und aktualisieren Sie das Ziel in Beacon.'
        discord:
            title: 'Discord (Webhook)'
            lead: 'Erstellen Sie einen Kanal-Webhook in Discord und fugen Sie seine URL in Beacon ein.'
            step1: 'Offnen Sie Servereinstellungen -> Integrationen -> Webhooks (oder den Tab Integrationen des Kanals).'
            step2: 'Erstellen Sie einen neuen Webhook, benennen Sie ihn (zum Beispiel Beacon) und wahlen Sie den Zielkanal.'
            step3: 'Kopieren Sie die Webhook-URL (https://discord.com/api/webhooks/...).'
            step4: 'Wahlen Sie in Beacon Discord-Webhook, fugen Sie die URL ein, wahlen Sie Kategorien, speichern Sie und senden Sie dann einen Test.'
            payload: 'JSON mit content (Zusammenfassung) und einem embeds-Array (title, description, optionale Issue-URL).'
            tip: 'Discord begrenzt Webhooks; Beacon liefert asynchron uber Messenger.'
        teams:
            title: 'Microsoft Teams (Incoming Webhook)'
            lead: 'Fugen Sie einem Teams-Kanal einen Incoming-Webhook-Connector hinzu und fugen Sie die URL in Beacon ein.'
            step1: 'Offnen Sie im Teams-Kanalmenu Connectors (oder Kanal verwalten -> Connectors).'
            step2: 'Konfigurieren Sie Incoming Webhook, geben Sie ihm einen Namen und erstellen Sie ihn.'
            step3: 'Kopieren Sie die von Teams bereitgestellte Webhook-URL.'
            step4: 'Wahlen Sie in Beacon Microsoft Teams-Webhook, fugen Sie die URL ein, wahlen Sie Kategorien, speichern Sie und senden Sie dann einen Test.'
            payload: 'Office-365-MessageCard-JSON mit summary, title, text und einer Aktion Open in Beacon, wenn eine URL vorhanden ist.'
            tip: 'Wenn Ihr Tenant nur Workflows statt klassischer Incoming Webhooks erlaubt, richten Sie ein generisches HTTP-Ziel auf einen Workflow, der POST-JSON akzeptiert.'
        telegram:
            title: 'Telegram (Bot)'
            lead: 'Erstellen Sie einen Bot mit BotFather und speichern Sie bot_token@chat_id als Beacon-Endpunkt.'
            step1: 'Offnen Sie @BotFather in Telegram, fuhren Sie /newbot aus und kopieren Sie das Bot-Token.'
            step2: 'Starten Sie einen privaten Chat mit dem Bot oder fugen Sie ihn einer Gruppe hinzu und senden Sie eine Nachricht.'
            step3: 'Rufen Sie getUpdates in der Bot API auf und lesen Sie message.chat.id aus (Gruppen-IDs sind oft negativ).'
            step4: 'Wahlen Sie in Beacon Telegram-Bot und setzen Sie den Endpunkt auf bot_token@chat_id (Beispiel - 123:AA...@-1001234567890).'
            step5: 'Speichern und Test senden.'
            payload: 'Bot-API-sendMessage mit chat_id und text (nur Zusammenfassung, nicht die vollstandige JSON-Payload).'
            tip: 'Das letzte @ im Endpunkt trennt Token und Chat-ID. Tokens werden wie andere Endpunkte verschlusselt im Ruhezustand gespeichert.'
        email:
            title: E-Mail
            lead: 'Stellen Sie Benachrichtigungen uber Symfony Mailer an ein Postfach zu. Konfigurieren Sie zuerst das Mailer DSN unter Administration -> Mailer.'
            step1: 'Offnen Sie Administration -> Mailer und speichern Sie ein verschlusseltes DSN (smtp://...). MAILER_DSN aus der Umgebung ist nur ein Bootstrap-Fallback; null://null stellt nicht zu.'
            step2: 'Wahlen Sie in Beacon E-Mail und setzen Sie den Endpunkt auf die Empfangeradresse.'
            step3: 'Wahlen Sie Kategorien, speichern Sie, senden Sie einen Test und prufen Sie Posteingang/Spam.'
            payload: 'Der E-Mail-Betreff entspricht der Zusammenfassung; der Text enthalt die Zusammenfassung plus die Issue- oder Performance-URL, falls vorhanden.'
            tip: 'Verwenden Sie einen gemeinsamen Ops-Alias. Fur umfangreichere Digests sind Slack/Discord/Teams oder eine HTTP-Bridge besser geeignet.'
        http:
            title: 'Generischer HTTP-Webhook'
            lead: 'Senden Sie die kanonische Beacon-JSON-Payload per POST an jeden HTTPS-Automatisierungsendpunkt.'
            step1: 'Stellen Sie eine HTTPS-URL bereit, die POST mit Content-Type application/json akzeptiert.'
            step2: 'Wahlen Sie in Beacon Generischer HTTP-Webhook, fugen Sie die URL ein, wahlen Sie Kategorien, speichern Sie und senden Sie dann einen Test.'
            step3: 'Bestatigen Sie, dass Ihr Dienst den kanonischen JSON-Body empfangt (event, summary, project, issue, url, category).'
            payload: 'Kanonische JSON-Payload als Request-Body (User-Agent symfony-beacon-notifications/1.0).'
            tip: 'Bevorzugen Sie HTTPS und authentifizieren Sie Ihren Empfanger. Vermeiden Sie interne oder Cloud-Metadaten-Adressen.'
