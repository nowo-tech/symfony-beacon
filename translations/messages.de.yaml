  intro: Konfigurieren Sie instanzweite Standards für Ingest, Metriken, eingehende
    E-Mail, Hooks, Projektgovernance und Benachrichtigungszustellung.
  metrics_require_token:
    help: Wenn aktiviert, liefert /metrics 503, bis ein Metriken-Token gespeichert
      ist. In Produktion empfohlen.
