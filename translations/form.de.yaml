# FormKit field catalogue (label / placeholder / help). Domain: form
admin_user:
  email:
    label: E-Mail
    placeholder: name@beispiel.de
    help: Anmelde-E-Mail für dieses Konto.
  display_name:
    label: Anzeigename
    placeholder: Erika Mustermann
    help: Wird im Admin-Verzeichnis und in der Aktivitätszeitleiste angezeigt.
  password:
    label: Passwort
    placeholder: Mindestens 8 Zeichen
    help: Mindestens 8 Zeichen.
  role:
    label: Rolle
    placeholder: Rolle wählen
    help: Instanzrolle (Benutzer oder Admin).
  enabled:
    label: Konto aktiviert (Anmeldung möglich)
    placeholder: ''
    help: Wenn deaktiviert, kann sich der Benutzer nicht anmelden.
admin_instance_role:
  name:
    label: Name
    placeholder: Support
    help: Datenbank-Fallback für den Anzeigenamen. Die UI bevorzugt roles.catalog.<slug>.name, wenn der
      Schlüssel übersetzt ist (Slug = Code in Kleinbuchstaben).
  code:
    label: Code
    placeholder: ROLE_SUPPORT
    help: Symfony-artiger Code (z. B. ROLE_SUPPORT). Maschinen-ID — wird nicht übersetzt.
  description:
    label: Wann verwenden
    placeholder: Optionale kurze Hinweise…
    help: Kurzer Hinweis, wann diese Rolle vergeben werden soll. Bevorzugt roles.catalog.<slug>.description;
      dieses Feld ist der DB-Fallback.
  enabled:
    label: Aktiviert
    help: Wenn deaktiviert, kann diese Rolle nicht neu zugewiesen werden.
project:
  nav:
    label: Projektabschnitte
  governance:
    help: Aufbewahrung pro Projekt, Ratenlimits und Tageskontingente. Lassen Sie ein Feld leer, um den
      Serverstandard zu übernehmen.
    inherit_hint: Leer = Serverstandard übernehmen (%default%). Verwenden Sie 0 zum Deaktivieren, wenn
      der Standardwert ungleich Null ist.
    retention_days:
      label: Aufbewahrungstage
    retention_max_events:
      label: Max. gespeicherte Ereignisse
    ingest_rate_limit:
      label: Begrenzung der Aufnahmerate (pro Minute)
    event_quota_daily:
      label: Tägliches Event-Kontingent
    event_quota_monthly:
      label: Monatliches Ereigniskontingent
  name:
    label: Name
    placeholder: z.B. Abrechnungs-API
    help: Wird im Dashboard angezeigt und zur Ableitung des Projekt-Slugs verwendet.
    required: Projektname ist erforderlich.
  description:
    label: Beschreibung
    placeholder: Optionale kurze Zusammenfassung
    help: Hilft Ihrem Team, dieses Projekt zu erkennen.
  api_keys:
    help: Verwenden Sie einen DSN in BEACON_DSN, damit Ihre App Fehler an dieses Projekt senden kann.
  members:
    help: Direkte Mitglieder dieses Projekts. Eigentümer und Administratoren verwalten die Mitgliedschaft.
      Der Zugriff kann auch über unten verlinkte Gruppen erfolgen.
    email_label: E-Mail des Mitglieds
    email_placeholder: user@example.com
    role:
      admin: Admin
      full: Full
      member: Mitglied
      owner: Eigentümer
      viewer: Viewer
    role_label: Rolle
  groups:
    help: Verknüpfen Sie eine Gruppe, sodass jedes Gruppenmitglied die ausgewählte Rolle in diesem Projekt
      erhält. Besitzer müssen als einzelne Benutzer hinzugefügt werden.
    select: Wählen Sie eine Gruppe aus…
  config:
    help: 'Portables JSON für dieses Projekt (Code: %code%). Enthält Mitgliedschaften per E-Mail; nie
      API-Geheimnisse.'
  danger:
    transfer_member_placeholder: Wählen Sie ein Mitglied aus…
site_appearance:
  brand_name:
    label: Markenname
    placeholder: Symfony-Beacon
    help: Wird im Header und auf der Anmeldeseite angezeigt.
  brand_eyebrow:
    label: Marken-Augenbraue
    placeholder: Fehlerverfolgung
    help: Kurze Beschriftung über der Marke auf dem Anmeldebildschirm.
  accent_color:
    label: Akzent
    placeholder: '#1f6f54'
    help: Primärer Akzent (Schaltflächen, Links) im Lichtmodus.
  accent_deep_color:
    label: Akzent (schweben)
    placeholder: '#134736'
    help: Dunklerer Akzent für Schwebezustände im Hellmodus.
  accent_color_dark:
    label: Akzent (dunkel)
    placeholder: '#4aad7f'
    help: Primärer Akzent im Dunkelmodus.
  accent_deep_color_dark:
    label: Akzentschweben (dunkel)
    placeholder: '#6bc49a'
    help: Hellerer Akzent für Schwebezustände im Dunkelmodus.
  danger_color:
    label: Gefahr
    placeholder: '#b42318'
    help: Fehler / destruktiver Akzent im Lichtmodus.
  danger_color_dark:
    label: Gefahr (dunkel)
    placeholder: '#f97066'
    help: Fehler / destruktiver Akzent im Dunkelmodus.
  warn_color:
    label: Warnung
    placeholder: '#b54708'
    help: Warnakzent im Lichtmodus.
  warn_color_dark:
    label: Warnung (dunkel)
    placeholder: '#fdb022'
    help: Warnakzent im Dunkelmodus.
  paper_color:
    label: Papier
    placeholder: '#f3f6f4'
    help: Seitenhintergrund im Lichtmodus.
  paper_color_dark:
    label: Papier (dunkel)
    placeholder: '#0c1210'
    help: Seitenhintergrund im Dunkelmodus.
  ink_color:
    label: Tinte
    placeholder: '#0f1c18'
    help: Primäre Textfarbe im Lichtmodus.
  ink_color_dark:
    label: Tinte (dunkel)
    placeholder: '#e6eee9'
    help: Primäre Textfarbe im Dunkelmodus.
  surface_color:
    label: Oberfläche
    placeholder: '#ffffff'
    help: Panels und Karten im Lichtmodus.
  surface_color_dark:
    label: Oberfläche (dunkel)
    placeholder: '#151c19'
    help: Panels und Karten im Dunkelmodus.
  footer_fixed:
    label: Feste Fußzeile
    help: Hält die rechtliche Fußzeile am unteren Rand des Viewports, während der Inhalt scrollt.
  corner_style:
    label: Eckenstil
    help: Karten nutzen einen größeren Radius; Eingaben und Schaltflächen bleiben dezenter.
    choice:
      sharp: Scharf
      soft: Weich (Standard)
      rounded: Abgerundet
  border_strength:
    label: Randstärke
    help: Wie deutlich Elementränder im hellen und dunklen Modus wirken (Panels, Eingaben, Chrome).
    choice:
      subtle: Dezent
      medium: Mittel (Standard)
      strong: Stark
  color:
    invalid: 'Verwenden Sie eine Hex-Farbe wie #1f6f54.'
user_preferences:
  display_name:
    label: Anzeigename
    placeholder: Ihr Name
    help: Wird im Avatar-Menü und in den Mitgliederlisten angezeigt.
  email:
    label: E-Mail
    placeholder: you@example.com
    help: Wird zur Anmeldung verwendet.
  slack_user_id:
    placeholder: U012ABCDEF
  phone:
    placeholder: '600 111 222'
  preferred_locale:
    label: Sprache
    placeholder: Auto
    help: Bevorzugte UI-Sprache für dieses Konto.
  preferred_theme:
    label: Thema
    placeholder: Auto
    help: Bevorzugter Auftritt bei Tag oder bei Nacht.
  preferred_content_width:
    label: Inhaltsbreite
    placeholder: Inhalt
    help: Zentrierte Inhaltsspalte oder Dehnung des Hauptbereichs auf die gesamte Breite.
  preferred_ui_density:
    label: UI-Dichte
    placeholder: Komfortabel
    help: Bequemer Abstand oder eine kompaktere Bedieneranordnung.
  preferred_font_scale:
    label: Textgröße
    placeholder: Mittel
    help: Skalieren Sie die Oberflächentextgröße.
  preferred_contrast:
    label: Kontrast
    placeholder: System
    help: Gerätekontrast folgen oder stärkere Texte und Ränder erzwingen.
  preferred_sidebar:
    label: Seitenleiste
    placeholder: Erweitert
    help: Desktop-Standard, wenn dieser Browser noch keine gespeicherte Einstellung hat.
  preferred_motion:
    label: Bewegung
    placeholder: System
    help: Befolgen Sie die Gerätepräferenz, reduzieren Sie die Animationen oder behalten Sie die volle
      Bewegung bei.
  preferred_collapsed_issue_panels:
    label: Problembereiche sind standardmäßig ausgeblendet
    placeholder: Bereiche auswählen…
    help: Aktivierte Bereiche werden auf Problem- und Ereignisdetailseiten eingeblendet. Ihr
      Browser merkt sich manuelle Überschreibungen zum Öffnen/Schließen.
  current_password:
    label: Aktuelles Passwort
    placeholder: Aktuelles Passwort
    help: Nur erforderlich, wenn ein neues Passwort festgelegt wird.
    help_email_change: Erforderlich bei Änderung Ihrer E-Mail-Adresse (Login und Passwort-Reset-Ziel).
    help_sensitive_change: Erforderlich, um E-Mail oder Slack-Benutzer-ID zu aktualisieren.
    help_required: Bestätigen Sie Ihr aktuelles Passwort, um ein neues festzulegen.
  plain_password:
    label: Neues Passwort
    placeholder: Neues Passwort
    help: Wählen Sie ein starkes Passwort, das die folgenden Anforderungen erfüllt.
    mismatch: Die Passwortfelder müssen übereinstimmen.
    strength_invalid: Das Passwort erfüllt nicht die Sicherheitsanforderungen (%missing%).
    second:
      label: Bestätigen Sie das neue Passwort
    first:
      label: Neues Passwort
  plain_password_confirm:
    label: Bestätigen Sie das neue Passwort
    placeholder: Neues Passwort bestätigen
    help: Geben Sie Ihr neues Passwort erneut ein.
ops_defaults:
  allow_anonymous_resolve:
    help: Veraltet. Wenn aktiviert, kann Resolve Issues ohne zugeordneten Beacon-Akteur ändern. Bevorzugen
      Sie zugeordnete Benutzer + Triage.
    label: Anonymes Slack/Teams-Resolve erlauben
  allow_private_urls:
    help: Wenn aktiviert, dürfen ausgehende Webhooks private/link-lokale Hosts erreichen. In Produktion
      deaktiviert lassen.
    label: Private Benachrichtigungs-URLs erlauben
  circuit_breaker_cooldown:
    help: Minuten, bevor ein automatisch pausiertes Ziel erneut versuchen darf. 0 erzwingt manuelle Fortsetzung.
    label: Circuit-Breaker-Abkühlzeit in Minuten
  circuit_breaker_threshold:
    help: Aufeinanderfolgende Zustellfehler, bevor ein Benachrichtigungsziel automatisch pausiert wird.
    label: Circuit-Breaker-Fehlerschwelle
  clear_inbound_webhook_secret:
    help: Gespeichertes eingehendes Webhook-Geheimnis entfernen.
    label: Eingehendes Webhook-Geheimnis löschen
  clear_metrics_token:
    help: Gespeicherten Scrape-Token entfernen.
    label: Metriken-Scrape-Token löschen
  delivery_history_limit:
    help: Anzahl der jüngsten Zustellversuche, die pro Benachrichtigungsziel behalten werden.
    label: Limit des Zustellverlaufs
  envelope_max_bytes:
    help: HTTP 413, wenn ein roher Ingest-Body diese Größe überschreitet. Standard 2097152 (2 MiB).
    label: Max. Envelope-/OTLP-Bodygröße (Bytes)
  event_quota_daily:
    help: Maximal akzeptierte Events pro Projekt und Tag. 0 = unbegrenzt.
    label: Tägliche Event-Quote
  event_quota_monthly:
    help: Maximal akzeptierte Events pro Projekt und UTC-Kalendermonat. 0 = unbegrenzt.
    label: Monatliche Event-Quote
  inbound_email_enabled:
    help: Wenn aktiviert, können Mention/Assign-Mails Reply-To-Tokens enthalten und POST /hooks/email/inbound
      akzeptiert Anbieter-Webhooks.
    label: Eingehende E-Mail-Kommentare aktivieren
  inbound_mail_domain:
    help: Domäne für Reply-To-Adressen (reply+{token}@domain).
    label: Eingehende Mail-Domäne
  inbound_webhook_secret:
    help: Gemeinsames Geheimnis für X-Beacon-Inbound-Secret und Reply-To-HMAC. Leer lassen behält das
      aktuelle Geheimnis.
    label: Eingehendes Webhook-Geheimnis
  ingest_rate_limit:
    help: Maximale Envelope-Anfragen pro Projekt und Minute. 0 = unbegrenzt.
    label: Ingest-Ratenlimit pro Minute
  ingest_reject_query_auth:
    help: Wenn aktiviert, werden beacon_key/beacon_secret-Query-Parameter abgelehnt (401). Nur während
      der Migration zu X-Beacon-Auth oder Envelope-DSN deaktivieren.
    label: Veraltete Query-String-Ingest-Auth ablehnen
  metrics_require_token:
    help: Wenn aktiviert, liefert /metrics 503, bis ein Metriken-Token gespeichert ist. In Produktion
      empfohlen.
    label: Metriken-Scrape-Token erfordern
  metrics_token:
    help: Bearer-Token für Scraper. Leer lassen behält den aktuellen Token.
    label: Metriken-Scrape-Token
  retention_days:
    help: Telemetrie älter als diese Anzahl Tage löschen. 0 deaktiviert altersbasierte Aufbewahrung.
    label: Aufbewahrungstage
  retention_max_events:
    help: Höchstens so viele Events pro Projekt behalten. 0 = keine Obergrenze nach Anzahl.
    label: Maximal gespeicherte Events pro Projekt
instance_mailer:
  plain_mailer_dsn:
    label: Mailer DSN
    help: Leer lassen, um den aktuellen verschlusselten Wert zu behalten. Beispiel smtp://user:pass@mail.example:587
      - null:// wird abgelehnt (verwenden Sie stattdessen Gespeichertes DSN loschen).
    placeholder: smtp://user:pass@mail.example:587
    invalid: Geben Sie ein gultiges Symfony Mailer DSN ein (zum Beispiel smtp://user:pass@host:587).
    null_transport: null:// kann keine E-Mails zustellen. Fugen Sie ein echtes SMTP-DSN
      (oder ein anderes) ein oder verwenden Sie Gespeichertes DSN loschen, um auf
      die Umgebung zuruckzufallen.
    scheme_not_allowed: Dieses Mailer-DSN-Schema ist nicht erlaubt. Verwenden Sie
      smtp, smtps oder ein unterstutztes Provider-Schema (Mailgun, Postmark, SES,
      …).
  clear_mailer_dsn:
    label: Gespeichertes DSN loschen
    help: Entfernt das Datenbank-DSN und fallt auf MAILER_DSN aus der Umgebung zuruck, bis Sie ein neues
      speichern.
  mailer_from:
    label: Absenderadresse
    help: Envelope-From fur Magic-Login- und Benachrichtigungs-E-Mails. Standard ist beacon@localhost,
      wenn leer.
    placeholder: beacon@example.com
instance_mercure:
  mercure_enabled:
    label: Mercure-Live-Benachrichtigungen aktivieren
    help: Wenn aktiviert, abonnieren angemeldete Mitglieder private Projektthemen fur New-Issue-Toasts,
      solange die App geoffnet ist.
  mercure_url:
    label: Publish-URL (Server)
    help: Leer lassen, um MERCURE_URL zu verwenden (z. B. http://mercure/.well-known/mercure innerhalb
      von Compose).
    placeholder: http://mercure/.well-known/mercure
  mercure_public_url:
    label: Offentliche URL (Browser)
    help: Leer lassen, um MERCURE_PUBLIC_URL zu verwenden (normalerweise same-origin /.well-known/mercure
      uber Caddy).
    placeholder: https://localhost:9447/.well-known/mercure
  plain_mercure_jwt_secret:
    label: JWT-Geheimnis
    help: Leer lassen, um den aktuellen verschlusselten Wert zu behalten oder auf MERCURE_JWT_SECRET zuruckzufallen.
      Mindestens 32 Zeichen, wenn gesetzt.
    placeholder: ••••••••••••••••••••••••••••••••
    invalid: Geben Sie eine gultige JWT-Geheimniszeichenfolge ein.
    too_short: Das JWT-Geheimnis muss mindestens 32 Zeichen lang sein.
  clear_mercure_jwt_secret:
    label: Gespeichertes JWT-Geheimnis loschen
    help: Entfernt das Geheimnis aus der Datenbank und fallt auf MERCURE_JWT_SECRET zuruck, bis Sie ein
      neues speichern.
