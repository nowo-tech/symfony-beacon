# FormKit field catalogue (label / placeholder / help). Domain: form
admin_user:
  email:
    label: Email
    placeholder: name@example.com
    help: Sign-in email for this account.
  display_name:
    label: Display name
    placeholder: Jane Doe
    help: Shown in the admin directory and activity timeline.
  password:
    label: Password
    placeholder: At least 8 characters
    help: At least 8 characters.
  role:
    label: Role
    placeholder: Select a role
    help: Instance role (user or admin).
  enabled:
    label: Account enabled (can sign in)
    placeholder: ''
    help: When disabled, the user cannot sign in.
admin_instance_role:
  name:
    label: Name
    placeholder: Support
    help: Database fallback for the display name. UI prefers roles.catalog.<slug>.name when that key is
      translated (slug = lowercase code).
  code:
    label: Code
    placeholder: ROLE_SUPPORT
    help: Symfony-style code (e.g. ROLE_SUPPORT). Stored as the machine id — not translated.
  description:
    label: When to use
    placeholder: Optional short guidance…
    help: Short guidance on when to assign this role. Prefer roles.catalog.<slug>.description; this field
      is the database fallback.
  enabled:
    label: Enabled
    help: When disabled, this role cannot be newly assigned.
project:
  nav:
    label: Project sections
  governance:
    help: Per-project retention, rate limits, and daily/monthly event quotas. Leave a field empty to inherit
      the server default.
  name:
    label: Name
    placeholder: e.g. Billing API
    help: Shown in the dashboard and used to derive the project slug.
    required: Project name is required.
  description:
    label: Description
    placeholder: Optional short summary
    help: Helps your team recognize this project.
  api_keys:
    help: Use a DSN in BEACON_DSN so your app can send errors to this project.
  config:
    help: 'Portable JSON for this project (code: %code%). Includes memberships by email; never includes
      API secrets.'
  members:
    help: Direct members of this project. Owners and admins manage membership. Access can also come from
      linked groups below.
    email_label: Member email
    email_placeholder: user@example.com
    role:
      admin: Admin
      full: Full
      member: Member
      owner: Owner
      viewer: Viewer
    role_label: Role
  groups:
    help: Link a group so every group member gets the chosen role on this project. Owner and full roles
      must be assigned to individual users.
    select: Select a group…
  danger:
    transfer_member_placeholder: Select a member…
site_appearance:
  brand_name:
    label: Brand name
    placeholder: symfony-beacon
    help: Shown in the header and on the login page.
  brand_eyebrow:
    label: Brand eyebrow
    placeholder: Error tracking
    help: Short label above the brand on the login screen.
  accent_color:
    label: Accent
    placeholder: '#1f6f54'
    help: Primary accent (buttons, links) in light mode.
  accent_deep_color:
    label: Accent (hover)
    placeholder: '#134736'
    help: Darker accent for hover states in light mode.
  accent_color_dark:
    label: Accent (dark)
    placeholder: '#4aad7f'
    help: Primary accent in dark mode.
  accent_deep_color_dark:
    label: Accent hover (dark)
    placeholder: '#6bc49a'
    help: Lighter accent for hover states in dark mode.
  danger_color:
    label: Danger
    placeholder: '#b42318'
    help: Error / destructive accent in light mode.
  danger_color_dark:
    label: Danger (dark)
    placeholder: '#f97066'
    help: Error / destructive accent in dark mode.
  warn_color:
    label: Warning
    placeholder: '#b54708'
    help: Warning / caution accent in light mode.
  warn_color_dark:
    label: Warning (dark)
    placeholder: '#fdb022'
    help: Warning / caution accent in dark mode.
  paper_color:
    label: Paper
    placeholder: '#f3f6f4'
    help: Page background in light mode.
  paper_color_dark:
    label: Paper (dark)
    placeholder: '#0c1210'
    help: Page background in dark mode.
  ink_color:
    label: Ink
    placeholder: '#0f1c18'
    help: Primary text color in light mode.
  ink_color_dark:
    label: Ink (dark)
    placeholder: '#e6eee9'
    help: Primary text color in dark mode.
  surface_color:
    label: Surface
    placeholder: '#ffffff'
    help: Panels and cards in light mode.
  surface_color_dark:
    label: Surface (dark)
    placeholder: '#151c19'
    help: Panels and cards in dark mode.
  footer_fixed:
    label: Fixed footer
    help: Keep the legal footer pinned to the bottom of the viewport while page content scrolls.
  corner_style:
    label: Corner style
    help: Cards use a larger radius; inputs and buttons stay subtler.
    choice:
      sharp: Sharp
      soft: Soft (default)
      rounded: Rounded
  border_strength:
    label: Border strength
    help: How defined element borders look in light and dark mode (panels, inputs, chrome).
    choice:
      subtle: Subtle
      medium: Medium (default)
      strong: Strong
  color:
    invalid: 'Use a hex color like #1f6f54.'
user_preferences:
  display_name:
    label: Display name
    placeholder: Your name
    help: Shown in the avatar menu and member lists.
  email:
    label: Email
    placeholder: you@example.com
    help: Used to sign in.
  slack_user_id:
    placeholder: U012ABCDEF
  phone:
    placeholder: '+34600111222'
  preferred_locale:
    label: Language
    placeholder: Auto
    help: Preferred UI language for this account.
  preferred_theme:
    label: Theme
    placeholder: Auto
    help: Preferred day or night appearance.
  preferred_content_width:
    label: Content width
    placeholder: Content
    help: Centered content column, or stretch the main area full width.
  preferred_ui_density:
    label: UI density
    placeholder: Comfortable
    help: Comfortable spacing, or a more compact operator layout.
  preferred_font_scale:
    label: Text size
    placeholder: Medium
    help: Scale the interface text smaller or larger.
  preferred_contrast:
    label: Contrast
    placeholder: System
    help: Follow the device contrast preference, or force stronger text and borders.
  preferred_sidebar:
    label: Sidebar
    placeholder: Expanded
    help: Default desktop sidebar state when this browser has no saved preference yet.
  preferred_motion:
    label: Motion
    placeholder: System
    help: Follow the device preference, reduce animations, or keep full motion.
  current_password:
    label: Current password
    placeholder: Current password
    help: Required only when setting a new password.
    help_email_change: Required when changing your email address (login and password-reset destination).
    help_required: Confirm your current password to set a new one.
  plain_password:
    label: New password
    placeholder: New password
    help: Choose a strong password that meets the requirements below.
    second:
      label: Confirm new password
    first:
      label: New password
  plain_password_confirm:
    placeholder: Confirm new password
    help: Re-enter your new password.
ops_defaults:
  retention_days:
    label: Retention days
    help: Delete telemetry older than this many days. Use 0 to disable age-based retention.
  retention_max_events:
    label: Maximum stored events per project
    help: Keep at most this many events per project. Use 0 for no event-count cap.
  ingest_rate_limit:
    label: Ingest rate limit per minute
    help: Maximum Envelope requests per project each minute. Use 0 for unlimited.
  event_quota_daily:
    label: Daily event quota
    help: Maximum accepted events per project each day. Use 0 for unlimited.
  event_quota_monthly:
    label: Monthly event quota
    help: Maximum accepted events per project per UTC calendar month. Use 0 for unlimited.
  envelope_max_bytes:
    label: Max Envelope / OTLP body size (bytes)
    help: HTTP 413 when a raw ingest body exceeds this size. Default 2097152 (2 MiB).
  metrics_require_token:
    label: Require metrics scrape token
    help: When enabled, /metrics returns 503 until a metrics token is stored. Recommended in production.
  metrics_token:
    label: Metrics scrape token
    help: Bearer token for scrapers. Blank on save keeps the current token.
  clear_metrics_token:
    label: Clear metrics scrape token
    help: Remove the stored scrape token.
  inbound_email_enabled:
    label: Enable inbound email comments
    help: When enabled, mention/assign mail can include Reply-To tokens and POST /hooks/email/inbound
      accepts provider webhooks.
  inbound_mail_domain:
    label: Inbound mail domain
    help: Domain used in Reply-To addresses (reply+{token}@domain).
  inbound_webhook_secret:
    label: Inbound webhook secret
    help: Shared secret for X-Beacon-Inbound-Secret and Reply-To HMAC signing. Blank on save keeps the
      current secret.
  clear_inbound_webhook_secret:
    label: Clear inbound webhook secret
    help: Remove the stored inbound webhook secret.
  allow_private_urls:
    label: Allow private notification URLs
    help: When enabled, outbound webhooks may target private/link-local hosts. Keep disabled in production.
  allow_anonymous_resolve:
    label: Allow anonymous Slack/Teams Resolve
    help: Legacy. When enabled, Resolve may mutate issues without a mapped Beacon actor. Prefer mapped
      users + triage.
  delivery_history_limit:
    label: Delivery history limit
    help: Number of recent delivery attempts retained for each notification destination.
  circuit_breaker_threshold:
    label: Circuit breaker failure threshold
    help: Consecutive delivery failures before a notification destination is automatically paused.
  circuit_breaker_cooldown:
    label: Circuit breaker cooldown in minutes
    help: Minutes before an automatically paused destination may retry. Use 0 to require manual resume.
  ingest_reject_query_auth:
    label: Reject query-string ingest auth (deprecated)
    help: When enabled, beacon_key/beacon_secret query parameters are rejected (401). Disable only while
      migrating clients to X-Beacon-Auth or Envelope DSN.
instance_mailer:
  mailer_dsn:
    label: Mailer DSN
    help: Leave blank to keep the current encrypted value. Example smtp://user:pass@mail.example:587 —
      null:// is rejected (use Clear stored DSN instead).
    placeholder: smtp://user:pass@mail.example:587
    invalid: Enter a valid Symfony Mailer DSN (for example smtp://user:pass@host:587).
    null_transport: null:// cannot deliver mail. Paste a real SMTP (or other) DSN,
      or use Clear stored DSN to fall back to the environment.
    scheme_not_allowed: That Mailer DSN scheme is not allowed. Use smtp, smtps, or
      a supported provider scheme (Mailgun, Postmark, SES, …). Sendmail/native DSNs
      are blocked because they can execute host commands.
  clear_dsn:
    label: Clear stored DSN
    help: Removes the database DSN and falls back to MAILER_DSN from the environment until you save a
      new one.
  mailer_from:
    label: From address
    help: Envelope From for magic-login and notification emails. Defaults to beacon@localhost when empty.
    placeholder: beacon@example.com
instance_mercure:
  enabled:
    label: Enable Mercure live alerts
    help: When on, signed-in members subscribe to private project topics for new-issue toasts while the
      app is open.
  url:
    label: Publish URL (server)
    help: Leave blank to use MERCURE_URL (e.g. http://mercure/.well-known/mercure inside Compose).
    placeholder: http://mercure/.well-known/mercure
  public_url:
    label: Public URL (browser)
    help: Leave blank to use MERCURE_PUBLIC_URL (usually same-origin /.well-known/mercure via Caddy).
    placeholder: https://localhost:9447/.well-known/mercure
  jwt_secret:
    label: JWT secret
    help: Leave blank to keep the current encrypted value or fall back to MERCURE_JWT_SECRET. Minimum
      32 characters when set.
    placeholder: ••••••••••••••••••••••••••••••••
    invalid: Enter a valid JWT secret string.
    too_short: JWT secret must be at least 32 characters.
  clear_secret:
    label: Clear stored JWT secret
    help: Removes the database secret and falls back to MERCURE_JWT_SECRET until you save a new one.
social_login_credential:
  provider:
    label: Provider key
    help: Lowercase slug (google, github, microsoft, or custom).
  label:
    label: Button label
    help: Shown on the login page Continue-with button.
  client_id:
    label: Client ID
  client_secret:
    label: Client secret
    help_new: OAuth client secret from the IdP app registration.
    help_edit: Leave blank to keep the current secret.
  enabled:
    label: Enabled
    help: Disabled providers stay in the database but do not show on login.
  enterprise_sso:
    label: Enterprise SSO
    help: Show under “Sign in with your organization” instead of consumer social buttons (OIDC IdPs).
  authorize_url:
    label: Authorize URL
    help: Optional for built-in providers; required for custom IdPs.
  token_url:
    label: Token URL
    help: Optional for built-in providers; required for custom IdPs.
  userinfo_url:
    label: Userinfo URL
    help: Optional for built-in providers; required for custom IdPs.
  scopes:
    label: Scopes
    help: Optional space- or comma-separated OAuth scopes.
