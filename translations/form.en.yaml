    quiet_hours_range_invalid: Start and end times must differ.
    quiet_hours_required: Start and end times are required when quiet hours are enabled.
    quiet_hours_time_invalid: Use 24-hour HH:MM format (e.g. 22:00).
    quiet_hours_timezone_invalid: Invalid timezone identifier.
