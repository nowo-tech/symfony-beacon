# FormKit field catalogue (label / placeholder / help). Domain: form
admin_user:
  email:
    label: Email
    placeholder: nome@exemplo.com
    help: Email de acesso desta conta.
  display_name:
    label: Nome visível
    placeholder: Ana Silva
    help: Mostrado no diretório de admin e na linha de atividade.
  password:
    label: Palavra-passe
    placeholder: Pelo menos 8 caracteres
    help: Pelo menos 8 caracteres.
  role:
    label: Função
    placeholder: Selecionar uma função
    help: Função de instância (utilizador ou admin).
  enabled:
    label: Conta ativa (pode iniciar sessão)
    placeholder: ''
    help: Se estiver desativada, o utilizador não pode iniciar sessão.
admin_instance_role:
  name:
    label: Nome
    placeholder: Suporte
    help: Reserva na base de dados para o nome visível. A UI prefere roles.catalog.<slug>.name se essa
      chave estiver traduzida (slug = código em minúsculas).
  code:
    label: Código
    placeholder: ROLE_SUPPORT
    help: Código estilo Symfony (ex. ROLE_SUPPORT). Id de máquina — não traduzido.
  description:
    label: Quando usar
    placeholder: Orientação breve opcional…
    help: Orientação breve sobre quando atribuir este papel. Prefira roles.catalog.<slug>.description;
      este campo é a reserva na BD.
  enabled:
    label: Ativo
    help: Se estiver desativado, este papel não pode ser atribuído de novo.
project:
  nav:
    label: Seções do projeto
  governance:
    help: Retenção por projeto, limites de taxas e cotas diárias. Deixe um campo vazio para herdar o padrão
      do servidor.
    inherit_hint: Vazio = herda o padrão do servidor (%default%). Use 0 para desabilitar quando o padrão
      for diferente de zero.
    retention_days:
      label: Dias de retenção
    retention_max_events:
      label: Máximo de eventos armazenados
    ingest_rate_limit:
      label: Limite de taxa de ingestão (por minuto)
    event_quota_daily:
      label: Cota diária de eventos
    event_quota_monthly:
      label: Cota mensal de eventos
  name:
    label: Nome
    placeholder: por exemplo API de faturamento
    help: Mostrado no painel e usado para derivar o slug do projeto.
    required: O nome do projeto é obrigatório.
  description:
    label: Descrição
    placeholder: Breve resumo opcional
    help: Ajuda sua equipe a reconhecer este projeto.
  api_keys:
    help: Use um DSN em BEACON_DSN para que seu aplicativo possa enviar erros para este projeto.
  members:
    help: Membros diretos deste projeto. Proprietários e administradores gerenciam a associação. O acesso
      também pode vir dos grupos vinculados abaixo.
    email_label: E-mail do membro
    email_placeholder: usuário@exemplo.com
    role:
      admin: Administrador
      full: Full
      member: Membro
      owner: Proprietário
      viewer: Viewer
    role_label: Papel
  groups:
    help: Vincule um grupo para que cada membro do grupo receba a função escolhida neste projeto. Os proprietários
      devem ser adicionados como usuários individuais.
    select: Selecione um grupo…
  config:
    help: 'JSON portátil deste projeto (código: %code%). Inclui memberships por email; nunca segredos
      de API.'
  danger:
    transfer_member_placeholder: Selecione um membro…
site_appearance:
  brand_name:
    label: Marca
    placeholder: symfony-beacon
    help: Mostrado no cabeçalho e na página de login.
  brand_eyebrow:
    label: Sobrancelha de marca
    placeholder: Rastreamento de erros
    help: Etiqueta curta acima da marca na tela de login.
  accent_color:
    label: Sotaque
    placeholder: '#1f6f54'
    help: Acento primário (botões, links) no modo claro.
  accent_deep_color:
    label: Acento (passar o mouse)
    placeholder: '#134736'
    help: Acento mais escuro para estados de foco no modo claro.
  accent_color_dark:
    label: Sotaque (escuro)
    placeholder: '#4aad7f'
    help: Acento primário no modo escuro.
  accent_deep_color_dark:
    label: Foco acentuado (escuro)
    placeholder: '#6bc49a'
    help: Acento mais claro para estados de foco no modo escuro.
  danger_color:
    label: Perigo
    placeholder: '#b42318'
    help: Erro/acento destrutivo no modo claro.
  danger_color_dark:
    label: Perigo (escuro)
    placeholder: '#f97066'
    help: Erro/acento destrutivo no modo escuro.
  warn_color:
    label: Aviso
    placeholder: '#b54708'
    help: Acento de aviso no modo claro.
  warn_color_dark:
    label: Aviso (escuro)
    placeholder: '#fdb022'
    help: Acento de aviso no modo escuro.
  paper_color:
    label: Papel
    placeholder: '#f3f6f4'
    help: Fundo da página no modo claro.
  paper_color_dark:
    label: Papel (escuro)
    placeholder: '#0c1210'
    help: Fundo da página no modo escuro.
  ink_color:
    label: Tinta
    placeholder: '#0f1c18'
    help: Cor do texto principal no modo claro.
  ink_color_dark:
    label: Tinta (escuro)
    placeholder: '#e6eee9'
    help: Cor do texto principal no modo escuro.
  surface_color:
    label: Superfície
    placeholder: '#ffffff'
    help: Painéis e cartões no modo claro.
  surface_color_dark:
    label: Superfície (escuro)
    placeholder: '#151c19'
    help: Painéis e cartões no modo escuro.
  footer_fixed:
    label: Rodapé fixo
    help: Mantém o rodapé legal afixado na parte inferior da viewport enquanto o conteúdo faz scroll.
  corner_style:
    label: Estilo dos cantos
    help: Os cartões usam um raio maior; inputs e botões ficam mais subtis.
    choice:
      sharp: Afiado
      soft: Suave (predefinição)
      rounded: Arredondado
  border_strength:
    label: Definição das bordas
    help: Quão definidas ficam as bordas dos elementos em modo claro e escuro (painéis, inputs, chrome).
    choice:
      subtle: Subtil
      medium: Média (predefinição)
      strong: Forte
  color:
    invalid: 'Use uma cor hexadecimal como #1f6f54.'
user_preferences:
  display_name:
    label: Nome de exibição
    placeholder: Seu nome
    help: Exibido no menu de avatar e nas listas de membros.
  email:
    label: E-mail
    placeholder: você@exemplo.com
    help: Usado para fazer login.
  slack_user_id:
    placeholder: U012ABCDEF
  phone:
    placeholder: '600 111 222'
  preferred_locale:
    label: Linguagem
    placeholder: Auto
    help: Idioma de IU preferido para esta conta.
  preferred_theme:
    label: Tema
    placeholder: Auto
    help: Aparência preferida de dia ou de noite.
  preferred_content_width:
    label: Largura do conteúdo
    placeholder: Contente
    help: Coluna de conteúdo centralizada ou esticar a largura total da área principal.
  preferred_ui_density:
    label: Densidade da IU
    placeholder: Confortável
    help: Espaçamento confortável ou layout do operador mais compacto.
  preferred_font_scale:
    label: Tamanho do texto
    placeholder: Médio
    help: Reduza ou aumente o texto da interface.
  preferred_contrast:
    label: Contraste
    placeholder: Sistema
    help: Siga o contraste do dispositivo ou force texto e bordas mais marcados.
  preferred_sidebar:
    label: Barra lateral
    placeholder: Expandida
    help: Estado padrão no ambiente de trabalho se este browser ainda não tiver preferência guardada.
  preferred_motion:
    label: Movimento
    placeholder: Sistema
    help: Siga a preferência do dispositivo, reduza as animações ou mantenha o movimento total.
  preferred_collapsed_issue_panels:
    label: Painéis de problemas recolhidos por padrão
    placeholder: Selecionar painéis…
    help: Os painéis verificados começam recolhidos nas páginas de detalhes do problema e do
      evento. Seu navegador lembra substituições manuais de abertura/fechamento.
  current_password:
    label: Senha atual
    placeholder: Senha atual
    help: Necessário apenas ao definir uma nova senha.
    help_email_change: Obrigatória ao alterar o endereço de email (login e destino de redefinição de palavra-passe).
    help_sensitive_change: Obrigatória para atualizar o e-mail ou o Slack user ID.
    help_required: Confirme sua senha atual para definir uma nova.
  plain_password:
    label: Nova senha
    placeholder: Nova senha
    help: Escolha uma senha forte que cumpra os requisitos abaixo.
    mismatch: Os campos de senha devem corresponder.
    strength_invalid: A senha não atende aos requisitos de segurança (%missing%).
    second:
      label: Confirme a nova senha
    first:
      label: Nova senha
  plain_password_confirm:
    label: Confirme a nova senha
    placeholder: Confirme a nova senha
    help: Introduza novamente a nova senha.
ops_defaults:
  allow_anonymous_resolve:
    help: Legado. Se ativo, o Resolve pode alterar issues sem um ator Beacon mapeado. Prefira utilizadores
      mapeados + triage.
    label: Permitir Resolve anónimo do Slack/Teams
  allow_private_urls:
    help: Se ativo, os webhooks de saída podem apontar para hosts privados/link-local. Mantenha desativado
      em produção.
    label: Permitir URL privadas de notificação
  circuit_breaker_cooldown:
    help: Minutos antes de um destino automaticamente em pausa poder tentar de novo. Use 0 para exigir
      retoma manual.
    label: Arrefecimento do circuit breaker em minutos
  circuit_breaker_threshold:
    help: Falhas de entrega consecutivas antes de um destino de notificação ser automaticamente colocado
      em pausa.
    label: Limiar de falhas do circuit breaker
  clear_inbound_webhook_secret:
    help: Remover o segredo de webhook de entrada armazenado.
    label: Limpar segredo de webhook de entrada
  clear_metrics_token:
    help: Remover o token de scrape armazenado.
    label: Limpar token de scrape de métricas
  delivery_history_limit:
    help: Número de tentativas de entrega recentes retidas por cada destino de notificação.
    label: Limite do histórico de entregas
  envelope_max_bytes:
    help: HTTP 413 quando um corpo de ingest em bruto excede este tamanho. Predefinição 2097152 (2 MiB).
    label: Tamanho máximo do corpo Envelope / OTLP (bytes)
  event_quota_daily:
    help: Máximo de eventos aceites por projeto por dia. Use 0 para ilimitado.
    label: Quota diária de eventos
  event_quota_monthly:
    help: Máximo de eventos aceites por projeto por mês civil UTC. Use 0 para ilimitado.
    label: Quota mensal de eventos
  inbound_email_enabled:
    help: Se ativo, o correio de menção/atribuição pode incluir tokens Reply-To e POST /hooks/email/inbound
      aceita webhooks do fornecedor.
    label: Ativar comentários por e-mail de entrada
  inbound_mail_domain:
    help: Domínio usado nos endereços Reply-To (reply+{token}@domínio).
    label: Domínio de correio de entrada
  inbound_webhook_secret:
    help: Segredo partilhado para X-Beacon-Inbound-Secret e assinatura HMAC Reply-To. Em branco ao guardar
      mantém o segredo atual.
    label: Segredo de webhook de entrada
  ingest_rate_limit:
    help: Máximo de pedidos Envelope por projeto por minuto. Use 0 para ilimitado.
    label: Limite de ritmo de ingest por minuto
  ingest_reject_query_auth:
    help: Se ativo, os parâmetros beacon_key/beacon_secret na query são recusados (401). Desative apenas
      ao migrar clientes para X-Beacon-Auth ou DSN Envelope.
    label: Rejeitar autenticação de ingest por query string (obsoleta)
  metrics_require_token:
    help: Se ativo, /metrics devolve 503 até existir um token de métricas armazenado. Recomendado em produção.
    label: Exigir token de scrape de métricas
  metrics_token:
    help: Token Bearer para scrapers. Em branco ao guardar mantém o token atual.
    label: Token de scrape de métricas
  retention_days:
    help: Eliminar telemetria mais antiga do que este número de dias. Use 0 para desativar a retenção
      por idade.
    label: Dias de retenção
  retention_max_events:
    help: Manter no máximo este número de eventos por projeto. Use 0 para sem teto por contagem.
    label: Máximo de eventos armazenados por projeto
instance_mailer:
  plain_mailer_dsn:
    label: DSN do Mailer
    help: Deixe em branco para manter o valor cifrado atual. Exemplo smtp://user:pass@mail.example:587
      - null:// e rejeitado (use antes Limpar DSN guardado).
    placeholder: smtp://user:pass@mail.example:587
    invalid: Introduza um DSN Symfony Mailer valido (por exemplo smtp://user:pass@host:587).
    null_transport: null:// nao consegue entregar email. Cole um DSN SMTP real (ou
      outro), ou use Limpar DSN guardado para recorrer ao ambiente.
    scheme_not_allowed: Esse esquema de DSN Mailer nao e permitido. Use smtp, smtps
      ou um esquema de fornecedor suportado (Mailgun, Postmark, SES, …).
  clear_mailer_dsn:
    label: Limpar DSN guardado
    help: Remove o DSN da base de dados e recorre a MAILER_DSN do ambiente ate guardar um novo.
  mailer_from:
    label: Endereco From
    help: Envelope From para magic login e emails de notificacao. Por defeito usa beacon@localhost quando
      vazio.
    placeholder: beacon@example.com
instance_mercure:
  mercure_enabled:
    label: Ativar alertas live Mercure
    help: Quando ativo, os membros autenticados subscrevem topicos privados do projeto para toasts de
      novas issues enquanto a app esta aberta.
  mercure_url:
    label: URL de publicacao (servidor)
    help: Deixe em branco para usar MERCURE_URL (por ex. http://mercure/.well-known/mercure dentro do
      Compose).
    placeholder: http://mercure/.well-known/mercure
  mercure_public_url:
    label: URL publico (navegador)
    help: Deixe em branco para usar MERCURE_PUBLIC_URL (normalmente same-origin /.well-known/mercure via
      Caddy).
    placeholder: https://localhost:9447/.well-known/mercure
  plain_mercure_jwt_secret:
    label: Segredo JWT
    help: Deixe em branco para manter o valor cifrado atual ou recorrer a MERCURE_JWT_SECRET. Minimo de
      32 caracteres quando definido.
    placeholder: ••••••••••••••••••••••••••••••••
    invalid: Introduza uma string de segredo JWT valida.
    too_short: O segredo JWT tem de ter pelo menos 32 caracteres.
  clear_mercure_jwt_secret:
    label: Limpar segredo JWT guardado
    help: Remove o segredo da base de dados e recorre a MERCURE_JWT_SECRET ate guardar um novo.
