# FormKit field catalogue (label / placeholder / help). Domain: form
admin_user:
  email:
    label: E-mail
    placeholder: nom@exemple.com
    help: E-mail de connexion de ce compte.
  display_name:
    label: Nom affiché
    placeholder: Jeanne Dupont
    help: Affiché dans l’annuaire admin et la chronologie d’activité.
  password:
    label: Mot de passe
    placeholder: Au moins 8 caractères
    help: Au moins 8 caractères.
  role:
    label: Rôle
    placeholder: Sélectionnez un rôle
    help: Rôle d’instance (utilisateur ou admin).
  enabled:
    label: Compte activé (peut se connecter)
    placeholder: ''
    help: S’il est désactivé, l’utilisateur ne peut pas se connecter.
admin_instance_role:
  name:
    label: Nom
    placeholder: Support
    help: Valeur de secours en base pour le nom affiché. L’UI préfère roles.catalog.<slug>.name si cette
      clé est traduite (slug = code en minuscules).
  code:
    label: Code
    placeholder: ROLE_SUPPORT
    help: Code style Symfony (ex. ROLE_SUPPORT). Identifiant machine — non traduit.
  description:
    label: Quand l’utiliser
    placeholder: Guidance courte optionnelle…
    help: Courte indication sur quand attribuer ce rôle. Préférez roles.catalog.<slug>.description ; ce
      champ est le secours en base.
  enabled:
    label: Activé
    help: S’il est désactivé, ce rôle ne peut pas être nouvellement attribué.
project:
  nav:
    label: Sections du projet
  governance:
    help: Rétention par projet, limites de débit et quotas quotidiens. Laissez un champ vide pour hériter
      de la valeur par défaut du serveur.
    inherit_hint: Vide = hérite des valeurs par défaut du serveur (%default%). Utilisez 0 pour désactiver
      lorsque la valeur par défaut est différente de zéro.
    retention_days:
      label: Jours de rétention
    retention_max_events:
      label: Nombre maximum d'événements stockés
    ingest_rate_limit:
      label: Limite de taux d'ingestion (par minute)
    event_quota_daily:
      label: Quota d'événements quotidiens
    event_quota_monthly:
      label: Quota mensuel d’événements
  name:
    label: Nom
    placeholder: par ex. API de facturation
    help: Affiché dans le tableau de bord et utilisé pour dériver le slug du projet.
    required: Le nom du projet est requis.
  description:
    label: Description
    placeholder: Bref résumé facultatif
    help: Aide votre équipe à reconnaître ce projet.
  api_keys:
    help: Utilisez un DSN dans BEACON_DSN pour que votre application puisse envoyer des erreurs à ce projet.
  members:
    help: Membres directs de ce projet. Les propriétaires et les administrateurs gèrent les adhésions.
      L'accès peut également provenir des groupes liés ci-dessous.
    email_label: Courriel du membre
    email_placeholder: utilisateur@exemple.com
    role:
      admin: Administrateur
      full: Full
      member: Membre
      owner: Propriétaire
      viewer: Viewer
    role_label: Rôle
  groups:
    help: Liez un groupe afin que chaque membre du groupe obtienne le rôle choisi sur ce projet. Les propriétaires
      doivent être ajoutés en tant qu'utilisateurs individuels.
    select: Sélectionnez un groupe…
  config:
    help: 'JSON portable pour ce projet (code : %code%). Inclut les appartenances par e-mail ; jamais
      les secrets d’API.'
  danger:
    transfer_member_placeholder: Sélectionnez un membre…
site_appearance:
  brand_name:
    label: Nom de la marque
    placeholder: balise symfony
    help: Affiché dans l'en-tête et sur la page de connexion.
  brand_eyebrow:
    label: Sourcil de marque
    placeholder: Suivi des erreurs
    help: Étiquette courte au-dessus de la marque sur l'écran de connexion.
  accent_color:
    label: Accent
    placeholder: '#1f6f54'
    help: Accent principal (boutons, liens) en mode clair.
  accent_deep_color:
    label: Accent (survol)
    placeholder: '#134736'
    help: Accent plus sombre pour les états de survol en mode clair.
  accent_color_dark:
    label: Accent (sombre)
    placeholder: '#4aad7f'
    help: Accent principal en mode sombre.
  accent_deep_color_dark:
    label: Survol d'accent (sombre)
    placeholder: '#6bc49a'
    help: Accent plus clair pour les états de survol en mode sombre.
  danger_color:
    label: Danger
    placeholder: '#b42318'
    help: Erreur / accent destructeur en mode clair.
  danger_color_dark:
    label: Danger (sombre)
    placeholder: '#f97066'
    help: Erreur/accent destructeur en mode sombre.
  warn_color:
    label: Avertissement
    placeholder: '#b54708'
    help: Accent d'avertissement en mode clair.
  warn_color_dark:
    label: Avertissement (sombre)
    placeholder: '#fdb022'
    help: Accent d'avertissement en mode sombre.
  paper_color:
    label: Papier
    placeholder: '#f3f6f4'
    help: Fond de page en mode clair.
  paper_color_dark:
    label: Papier (sombre)
    placeholder: '#0c1210'
    help: Fond de page en mode sombre.
  ink_color:
    label: Encre
    placeholder: '#0f1c18'
    help: Couleur du texte principal en mode clair.
  ink_color_dark:
    label: Encre (sombre)
    placeholder: '#e6eee9'
    help: Couleur du texte principal en mode sombre.
  surface_color:
    label: Surface
    placeholder: '#ffffff'
    help: Panneaux et cartes en mode clair.
  surface_color_dark:
    label: Surface (sombre)
    placeholder: '#151c19'
    help: Panneaux et cartes en mode sombre.
  footer_fixed:
    label: Pied de page fixe
    help: Garde le pied de page légal épinglé en bas de la fenêtre pendant le défilement du contenu.
  corner_style:
    label: Style des coins
    help: Les cartes utilisent un rayon plus grand ; champs et boutons restent plus discrets.
    choice:
      sharp: Anguleux
      soft: Doux (défaut)
      rounded: Arrondi
  border_strength:
    label: Force des bordures
    help: À quel point les bordures des éléments sont marquées en mode clair et sombre (panneaux, champs,
      chrome).
    choice:
      subtle: Discrète
      medium: Moyenne (défaut)
      strong: Forte
  color:
    invalid: 'Utilisez une couleur hexadécimale comme #1f6f54.'
user_preferences:
  display_name:
    label: Nom d'affichage
    placeholder: Votre nom
    help: Affiché dans le menu de l'avatar et dans les listes de membres.
  email:
    label: E-mail
    placeholder: vous@exemple.com
    help: Utilisé pour se connecter.
  slack_user_id:
    placeholder: U012ABCDEF
  phone:
    placeholder: '+34600111222'
  preferred_locale:
    label: Langue
    placeholder: Auto
    help: Langue d'interface utilisateur préférée pour ce compte.
  preferred_theme:
    label: Thème
    placeholder: Auto
    help: Aspect préféré de jour ou de nuit.
  preferred_content_width:
    label: Largeur du contenu
    placeholder: Contenu
    help: Colonne de contenu centrée ou étirez la zone principale sur toute la largeur.
  preferred_ui_density:
    label: Densité de l'interface utilisateur
    placeholder: Confortable
    help: Espacement confortable ou disposition de l'opérateur plus compacte.
  preferred_font_scale:
    label: Taille du texte
    placeholder: Moyen
    help: Réduisez ou agrandissez le texte de l'interface.
  preferred_contrast:
    label: Contraste
    placeholder: Système
    help: Suivre le contraste de l'appareil ou forcer un texte et des bordures plus marqués.
  preferred_sidebar:
    label: Barre latérale
    placeholder: Développée
    help: État par défaut sur bureau si ce navigateur n'a pas encore de préférence enregistrée.
  preferred_motion:
    label: Mouvement
    placeholder: Système
    help: Suivez les préférences de l'appareil, réduisez les animations ou conservez le mouvement complet.
  preferred_collapsed_issue_panels:
    label: Les panneaux de problèmes sont réduits par défaut
    placeholder: Sélectionner des panneaux…
    help: Les panneaux cochés commencent par être réduits sur les pages de détails des problèmes
      et des événements. Votre navigateur mémorise les remplacements d'ouverture/fermeture manuels.
  current_password:
    label: Mot de passe actuel
    placeholder: Mot de passe actuel
    help: Requis uniquement lors de la définition d'un nouveau mot de passe.
    help_email_change: Requis lors du changement d’adresse e-mail (connexion et destination de réinitialisation).
    help_sensitive_change: Requis pour mettre à jour votre e-mail ou votre ID Slack.
    help_required: Confirmez votre mot de passe actuel pour en définir un nouveau.
  plain_password:
    label: Nouveau mot de passe
    placeholder: Nouveau mot de passe
    help: Choisissez un mot de passe fort qui répond aux exigences ci-dessous.
    mismatch: Les champs du mot de passe doivent correspondre.
    strength_invalid: Le mot de passe ne répond pas aux exigences de force (%missing%).
    second:
      label: Confirmer le nouveau mot de passe
    first:
      label: Nouveau mot de passe
  plain_password_confirm:
    label: Confirmer le nouveau mot de passe
    placeholder: Confirmer le nouveau mot de passe
    help: Saisissez à nouveau votre nouveau mot de passe.
ops_defaults:
  allow_anonymous_resolve:
    help: Hérité. Si activé, Resolve peut modifier des incidents sans acteur Beacon associé. Préférez
      des utilisateurs associés + triage.
    label: Autoriser Resolve anonyme Slack/Teams
  allow_private_urls:
    help: Si activé, les webhooks sortants peuvent cibler des hôtes privés/link-local. À laisser désactivé
      en production.
    label: Autoriser les URL de notification privées
  circuit_breaker_cooldown:
    help: Minutes avant qu’une destination automatiquement en pause puisse réessayer. 0 exige une reprise
      manuelle.
    label: Refroidissement du circuit breaker (minutes)
  circuit_breaker_threshold:
    help: Échecs de livraison consécutifs avant qu’une destination de notification soit automatiquement
      mise en pause.
    label: Seuil d’échecs du circuit breaker
  clear_inbound_webhook_secret:
    help: Supprimer le secret de webhook entrant stocké.
    label: Effacer le secret de webhook entrant
  clear_metrics_token:
    help: Supprimer le jeton de scrape stocké.
    label: Effacer le jeton de scrape des métriques
  delivery_history_limit:
    help: Nombre de tentatives de livraison récentes conservées pour chaque destination de notification.
    label: Limite de l’historique de livraison
  envelope_max_bytes:
    help: HTTP 413 lorsqu’un corps d’ingest brut dépasse cette taille. Défaut 2097152 (2 Mio).
    label: Taille max. du corps Envelope / OTLP (octets)
  event_quota_daily:
    help: Maximum d’événements acceptés par projet et par jour. 0 = illimité.
    label: Quota quotidien d’événements
  event_quota_monthly:
    help: Maximum d’événements acceptés par projet et par mois calendaire UTC. 0 = illimité.
    label: Quota mensuel d’événements
  inbound_email_enabled:
    help: Si activé, les e-mails de mention/assignation peuvent inclure des jetons Reply-To et POST /hooks/email/inbound
      accepte les webhooks du fournisseur.
    label: Activer les commentaires par e-mail entrant
  inbound_mail_domain:
    help: Domaine utilisé dans les adresses Reply-To (reply+{token}@domaine).
    label: Domaine de messagerie entrante
  inbound_webhook_secret:
    help: Secret partagé pour X-Beacon-Inbound-Secret et la signature HMAC Reply-To. Laisser vide conserve
      le secret actuel.
    label: Secret de webhook entrant
  ingest_rate_limit:
    help: Maximum de requêtes Envelope par projet et par minute. 0 = illimité.
    label: Limite de débit d’ingest par minute
  ingest_reject_query_auth:
    help: Si activé, les paramètres beacon_key/beacon_secret en query sont refusés (401). Désactiver uniquement
      lors de la migration vers X-Beacon-Auth ou DSN Envelope.
    label: Refuser l’auth d’ingest par query string (obsolète)
  metrics_require_token:
    help: Si activé, /metrics renvoie 503 tant qu’aucun jeton de métriques n’est stocké. Recommandé en
      production.
    label: Exiger un jeton de scrape des métriques
  metrics_token:
    help: Jeton Bearer pour les scrapers. Laisser vide conserve le jeton actuel.
    label: Jeton de scrape des métriques
  retention_days:
    help: Supprimer la télémétrie plus ancienne que ce nombre de jours. 0 désactive la rétention par âge.
    label: Jours de rétention
  retention_max_events:
    help: Conserver au plus ce nombre d’événements par projet. 0 = pas de plafond par nombre.
    label: Maximum d’événements stockés par projet
instance_mailer:
  plain_mailer_dsn:
    label: DSN Mailer
    help: Laisser vide pour conserver la valeur chiffree actuelle. Exemple smtp://user:pass@mail.example:587
      - null:// est refuse (utilisez plutot Effacer le DSN stocke).
    placeholder: smtp://user:pass@mail.example:587
    invalid: Saisissez un DSN Symfony Mailer valide (par exemple smtp://user:pass@host:587).
    null_transport: null:// ne peut pas livrer d''e-mail. Collez un vrai DSN SMTP
      (ou autre), ou utilisez Effacer le DSN stocke pour retomber sur l''environnement.
    scheme_not_allowed: Ce schema de DSN Mailer n''est pas autorise. Utilisez smtp,
      smtps ou un fournisseur pris en charge (Mailgun, Postmark, SES, …).
  clear_mailer_dsn:
    label: Effacer le DSN stocke
    help: Supprime le DSN de la base et retombe sur MAILER_DSN de l''environnement jusqu''a ce que vous
      en enregistriez un nouveau.
  mailer_from:
    label: Adresse From
    help: Envelope From pour le magic login et les e-mails de notification. Valeur par defaut beacon@localhost
      si vide.
    placeholder: beacon@example.com
instance_mercure:
  mercure_enabled:
    label: Activer les alertes Mercure en direct
    help: Une fois active, les membres connectes s''abonnent a des topics prives de projet pour les toasts
      de nouvelle issue tant que l''application est ouverte.
  mercure_url:
    label: URL de publication (serveur)
    help: Laisser vide pour utiliser MERCURE_URL (par ex. http://mercure/.well-known/mercure dans Compose).
    placeholder: http://mercure/.well-known/mercure
  mercure_public_url:
    label: URL publique (navigateur)
    help: Laisser vide pour utiliser MERCURE_PUBLIC_URL (generalement same-origin /.well-known/mercure
      via Caddy).
    placeholder: https://localhost:9447/.well-known/mercure
  plain_mercure_jwt_secret:
    label: Secret JWT
    help: Laisser vide pour conserver la valeur chiffree actuelle ou retomber sur MERCURE_JWT_SECRET.
      Minimum 32 caracteres si defini.
    placeholder: ••••••••••••••••••••••••••••••••
    invalid: Saisissez une chaine de secret JWT valide.
    too_short: Le secret JWT doit contenir au moins 32 caracteres.
  clear_mercure_jwt_secret:
    label: Effacer le secret JWT stocke
    help: Supprime le secret de la base et retombe sur MERCURE_JWT_SECRET jusqu''a ce que vous en enregistriez
      un nouveau.
